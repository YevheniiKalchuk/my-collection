"cat_tir": 40000, "cat_year": 2021, "name_en": "\"Chornobyl. Revival. Przewalski's Horse\" (nickel silver)", "desc_ua": "Пам’ятна монета присвячена символу відродження дикої природи, знаковій тварині заповідника – коню Пржевальського – єдиному існуючому виду диких коней, що збереглися донині в первісному вигляді, і який занесено до Міжнародної Червоної книги з природоохоронним статусом “на межі зникнення”. Монета розпочинає ряд монет “Чорнобиль. Відродження”.\n\nНа аверсі монети розміщено: малий Державний Герб України (угорі), написи: УКРАЇНА (під гербом); номінал монети – 5/ГРИВЕНЬ (праворуч від герба); у центрі – символічне колесо життя, що знаменує відродження природи: стилізований міжнародний знак “Радіаційна загроза”, оповитий листям, навколо якого тварини, популяції яких розвиваються у 30-кілометровій зоні відчуження, що стала своєрідним резерватом для розмноження зокрема лелеки чорного, коня Пржевальського, рисі, зубра, лося, ведмедя бурого; по колу, на дзеркальному тлі написи: ЧОРНОБИЛЬСЬКИЙ РАДІАЦІЙНО-ЕКОЛОГІЧНИЙ БІОСФЕРНИЙ ЗАПОВІДНИК (ліворуч), CHORNOBYL RADIATION AND ECOLOGICAL BIOSPHERE RESERVE (праворуч); рік карбування – 2021 (унизу); логотип Банкнотно-монетного двору Національного банку України (угорі).\n\nНа реверсі монети на тлі пейзажу зображено коня Пржевальського (використано тамподрук), над яким на дзеркальному тлі написи: КІНЬ/ПРЖЕВАЛЬСЬКОГО/EQUUS FERUS PRZEWALSKII; угорі – коня та лоша.", "desc_en": "The commemorative coin is dedicated to a symbol of wildlife revival – the reserve's iconic animal, Przewalski's horse – the only surviving species of wild horse preserved in its original form, listed in the International Red Book with the conservation status of \"endangered\". The coin opens the \"Chornobyl. Revival\" series.\n\nThe obverse features: the small State Coat of Arms of Ukraine (at the top), the inscriptions: УКРАЇНА (under the coat of arms); the coin denomination – 5/HRYVEN (to the right of the coat of arms); in the centre – a symbolic wheel of life signifying the revival of nature: a stylised international \"Radiation Hazard\" sign entwined with leaves, surrounded by animals whose populations are thriving in the 30-kilometre exclusion zone, which has become a unique reserve for the reproduction of, in particular, the black stork, Przewalski's horse, lynx, bison, elk and brown bear; around the circle, on a mirror background, the inscriptions: ЧОРНОБИЛЬСЬКИЙ РАДІАЦІЙНО-ЕКОЛОГІЧНИЙ БІОСФЕРНИЙ ЗАПОВІДНИК (on the left), CHORNOBYL RADIATION AND ECOLOGICAL BIOSPHERE RESERVE (on the right); the year of issue – 2021 (at the bottom); the logo of the National Bank of Ukraine Banknote Printing and Minting Works (at the top).\n\nThe reverse depicts Przewalski's horse against a landscape background (pad printing), above which, on a mirror background, the inscriptions: КІНЬ/ПРЖЕВАЛЬСЬКОГО/EQUUS FERUS PRZEWALSKII; at the top – a horse and a foal."}, {"id": 79, "uid": "701a12ad3d", "name": "«Чорнобиль. Відродження. Ведмідь бурий» (н)", "cat": "Пам'ятні монети", "img": "images/img_79.jpg", "photos": [{"src": "images/img_79.jpg", "label": "Аверс"}, {"src": "images/img_79_b.jpg", "label": "Реверс"}], "url": "https://coins.bank.gov.ua/chornobil-vidrodzhennja-vedmid-burij-n-/p-1036.html", "price": 0, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "16,54", "diametr": "35,0", "gurt": "рифлений", "yakist": "спеціальний анциркулейтед", "tyrazh": "40000", "rik": "2022", "seriya": "Флора і фауна", "nominal": "5", "hud": "Наталія Фандікова", "skul": "Анатолій Демяненко, Володимир Дем'яненко", "note": "У тому числі 20 000 шт. у сувенірній упаковці; придбано поза магазином НБУ", "cat_nom": "5 грн", "cat_tir": 40000, "cat_year": 2022, "name_en": "\"Chornobyl. Revival. Brown Bear\" (nickel silver)", "desc_ua": "Пам`ятна монета присвячена ведмедю бурому. Чорнобильський радіаційно-екологічний біосферний заповідник – унікальний об’єкт природно-заповідного фонду України, розташований на території, що постраждала від наслідків аварії на Чорнобильській атомній електростанції.\nНезважаючи на катастрофу планетарного масштабу, природа відновлюється тут на диво швидкими темпами. Ці величезні простори стали своєрідним резерватом для розмноження типових для регіону Полісся та рідкісних червонокнижних представників тваринного світу. Тут спостерігаються процеси повернення великих тварин у місця природних ареалів, де раніше вони були повністю винищені людиною.\nОдин із таких видів – ведмідь бурий, який через сто років відсутності з’явився тут знову в останні післяаварійні десятиліття. Фотопастки час від часу фіксують перебування звіра на території заповідника. На думку фахівців, у майбутньому на території двох заповідників – Чорнобильського та суміжного з ним Поліського державного радіаційно-екологічного заповідника (білорусь) – може комфортно проживати близько 40 ведмедів.\n\nНа аверсі монети розміщено: малий Державний Герб України (угорі), написи: УКРАЇНА (під гербом); номінал монети – 5/ГРИВЕНЬ (праворуч від герба); у центрі – символічне колесо життя, що знаменує відродження природи: стилізований міжнародний знак “Радіаційна загроза”, оповитий листям, навколо якого тварини, популяції яких розвиваються у 30-кілометровій зоні відчуження, що стала своєрідним резерватом для розмноження, зокрема лелеки чорного, коня Пржевальського, рисі, зубра, лося, ведмедя бурого; по колу, на дзеркальному тлі написи: ЧОРНОБИЛЬСЬКИЙ РАДІАЦІЙНО-ЕКОЛОГІЧНИЙ БІОСФЕРНИЙ ЗАПОВІДНИК (ліворуч), CHORNOBYL RADIATION AND ECOLOGICAL BIOSPHERE RESERVE; рік карбування – 2022 (унизу); логотип Банкнотно-монетного двору Національного банку України (угорі).\n\nНа реверсі монети на тлі пейзажу зображено ведмедя бурого (використано тамподрук), над яким на дзеркальному тлі написи: ВЕДМІДЬ/БУРИЙ/URSUS ARCTOS; угорі – ведмедя та ведмежа.", "desc_en": "This commemorative coin is dedicated to the brown bear. The Chornobyl Radiation and Ecological Biosphere Reserve is a unique object of Ukraine's nature reserve fund, located on territory affected by the consequences of the accident at the Chornobyl Nuclear Power Plant.\nDespite the catastrophe of planetary scale, nature here is recovering at a surprisingly rapid pace. These vast expanses have become a kind of reserve for the reproduction of typical for the Polissia region and rare, Red-Book-listed representatives of the animal world. Here, processes of the return of large animals to the places of their natural habitats, where they had previously been completely exterminated by humans, are observed.\nOne of these species is the brown bear, which, after a hundred years of absence, reappeared here in the last post-accident decades. Camera traps occasionally record the presence of the animal on the reserve's territory. According to experts, in the future, about 40 bears could comfortably live on the territory of two reserves – Chornobyl and the adjacent Polissia State Radiation and Ecological Reserve (Belarus).\n\nThe obverse of the coin features: the small State Coat of Arms of Ukraine (at the top), inscriptions: УКРАЇНА (below the coat of arms); the coin's denomination – 5 / ГРИВЕНЬ (to the right of the coat of arms); in the centre – a symbolic wheel of life signifying the revival of nature: a stylized international \"Radiation Hazard\" sign entwined with leaves, around which are animals whose populations are developing in the 30-kilometre exclusion zone, which has become a kind of reserve for reproduction, in particular the black stork, Przewalski's horse, lynx, European bison, moose, brown bear; along the circle, on a mirror background, inscriptions: ЧОРНОБИЛЬСЬКИЙ РАДІАЦІЙНО-ЕКОЛОГІЧНИЙ БІОСФЕРНИЙ ЗАПОВІДНИК (left), CHORNOBYL RADIATION AND ECOLOGICAL BIOSPHERE RESERVE; the year of issue – 2022 (below); the logo of the National Bank of Ukraine Banknote Printing and Minting Works (above).\n\nThe reverse of the coin, against a landscape background, depicts a brown bear (pad printing used), above which, on a mirror background, are the inscriptions: ВЕДМІДЬ / БУРИЙ / URSUS ARCTOS; above – a bear and a bear cub."}, {"id": 80, "uid": "b82225a5aa", "name": "«Локі» – інвестиційний зливок срібла 1 унція (Royal Mint)", "cat": "Зливки", "img": "images/img_80.jpg", "photos": [{"src": "images/img_80.jpg", "label": "Аверс"}, {"src": "images/img_80_b.jpg", "label": "Реверс"}, {"src": "images/img_80_c.jpg", "label": "Паковання"}, {"src": "images/img_80_d.jpg", "label": "Паковання"}], "url": "https://www.royalmint.com/invest/bullion/bullion-bars/silver-bars/loki-1oz-silver-minted-bullion-bar/", "price": 4800, "qty": 1, "metal": "срібло 999,9", "metal_short": "срібло 999,9", "masa": "31,1 (1 тройська унція)", "diametr": "28,98 × 49,96", "gurt": "—", "yakist": "інвестиційна (bullion)", "tyrazh": "10000", "rik": "2025", "seriya": "Норвезькі боги (Norse Gods)", "nominal": "—", "hud": "Ден Торн (Dan Thorne)", "skul": "—", "note": "Третій, фінальний випуск серії «Норвезькі боги» Королівського монетного двору Великої Британії; блістерне паковання", "cat_nom": "—", "cat_tir": 10000, "cat_year": 2025, "name_en": "\"Loki\" – 1 oz silver investment bar (Royal Mint)", "desc_ua": "Центральна постать скандинавської міфології, Локі – вродливий настільки ж, наскільки й підступний. Син велетня Фарбауті та жінки на ім'я Лаувей, Локі – складна постать: він і рятує богів Асгарда зі скрути, і стає причиною багатьох їхніх негараздів. У нього троє жахливих дітей: Фенрір – велетенський вовк, Хель – богиня потойбіччя, та Йормунганд – титанічний змій, що обвиває Мідгард.\n\nНа дизайні цього вишуканого зливка Локі зображено з лукавою усмішкою – він сидить на дереві, а під його ногами згорнувся Йормунганд. У руці він тримає гілочку омели – рослини, що спричинила смерть Бальдра, події, в якій Локі відіграв головну роль.", "desc_en": "A central character within Norse mythology, Loki is as beautiful as he is treacherous. The son of the giant Farbauti and a woman named Laufey, Loki is a complex character; he is both a problem solver for the gods of Asgard but also the cause of many of their problems. He has three monstrous children: Fenrir, the giant wolf, Hel, goddess of the underworld, and Jörmungandr, the titanic serpent that encircles Midgard.\n\nThe design for this stunning bullion bar depicts Loki sporting a mischievous grin as he sits on a tree with Jörmungandr coiled beneath his feet. He holds a sprig of mistletoe, the plant that causes the death of Baldr, an event in which Loki plays a central role."}, {"id": 81, "uid": "78c813bc86", "name": "«Мешканці морських глибин» – набір із двох монет (н)", "cat": "Набори", "img": "images/img_81.jpg", "photos": [{"src": "images/img_81.jpg", "label": "Аверс"}, {"src": "images/img_81_b.jpg", "label": "Реверс"}, {"src": "images/img_81_c.jpg", "label": "Паковання"}, {"src": "images/img_81_d.jpg", "label": "Паковання (зворот)"}, {"src": "images/img_81_e.jpg", "label": "Аверс «Азовське море. Морський кріт»"}, {"src": "images/img_81_f.jpg", "label": "Реверс «Азовське море. Морський кріт»"}, {"src": "images/img_81_g.jpg", "label": "Аверс «Чорне море. Чорноморський гребінець»"}, {"src": "images/img_81_h.jpg", "label": "Реверс «Чорне море. Чорноморський гребінець»"}], "url": "https://coins.bank.gov.ua/nabir-iz-dvoh-pam-jatnih-monet-meshkanci-morskih-glibin-u-suvenirnomu-pakovanni/p-1213.html", "price": 412, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "рифлений", "yakist": "спеціальний анциркулейтед", "tyrazh": "50000", "rik": "2026", "seriya": "Флора і фауна України", "nominal": "10", "hud": "Аліса Іванова", "skul": "Анатолій Демяненко, Володимир Атаманчук", "note": "Набір із двох монет: «Азовське море. Морський кріт» та «Чорне море. Чорноморський гребінець» (номінал кожної 5 грн); сувенірне паковання; дата введення в обіг 21.09.2026", "cat_nom": "10 грн", "cat_tir": 50000, "cat_year": 2026, "name_en": "\"Dwellers of the Sea Depths\" – two-coin set (nickel silver)", "desc_ua": "Набір із двох пам’ятних монет присвячений унікальним представникам морської фауни Чорного та Азовського морів – невід’ємній складовій природної спадщини України. Чорне та Азовське моря відіграють важливу роль у збереженні біорізноманіття регіону, підтриманні екологічної рівноваги та забезпеченні економічної стабільності держави. Серед багатьох мешканців цих водойм – рак-самітник (Diogenes pugilator) і бичок-кругляк (Neogobius melanostomus) – види, що слугують біоіндикаторами стану морського середовища та є важливими елементами морських екосистем. Цим набором з двох пам’ятних монет Національний банк України має на меті привернути увагу до проблеми збереження морів, нагадати про відповідальність людства за охорону природних ресурсів і підкреслити значення морської біоти у формуванні екосистеми України.\n\nНа аверсі монети, присвяченої Азовському морю, у центрі композиції розміщено стилізований контур Азовського моря з прилеглою територією України, виконаний у вигляді рельєфних горизонтальних ліній, що імітують морські хвилі. Угорі праворуч розташовано малий Державний Герб України, під яким горизонтально зазначено рік карбування – 2025, а вертикально – напис УКРАЇНА. Унизу монети розміщено номінал 5 з графічним знаком гривні та логотип Банкнотно-монетного двору Національного банку України. У нижній частині композиції півколом розміщено написи: АЗОВСЬКЕ МОРЕ та THE SEA OF AZOV. На реверсі монети зображено двох бичків-кругляків (елемент оздоблення – кольоровий друк) у природному середовищі – на піщано-мулистому дні серед кам’янистих уламків і водної рослинності. На передньому плані зображено кладку ікри, що акцентує увагу на репродуктивній функції виду та його екологічному значенні. Угорі півколом зазначено напис БИЧОК-КРУГЛЯК, а внизу – NEOGOBIUS MELANOSTOMUS.\n\nНа аверсі монети, присвяченої Чорному морю, зображено стилізований абрис Чорного моря з прилеглою територією України, виконаний у вигляді рельєфних горизонтальних ліній різної довжини, що імітують морські хвилі. Угорі праворуч розміщено малий Державний Герб України, під яким зазначено напис УКРАЇНА. Унизу по центру розташовано номінал – 5 з графічним знаком гривні, рік карбування монети – 2025, а також логотип Банкнотно-монетного двору Національного банку України. У нижній частині композиції півколом розміщено написи: ЧОРНЕ МОРЕ та THE BLACK SEA. На реверсі монети зображено рака-самітника (елемент оздоблення – кольоровий друк) у типовому біотопі – на кам’янистому дні з черепашками та уламками мушель, що характерні для прибережної зони Чорного моря. Угорі півколом розміщено напис DIOGENES PUGILATOR, унизу – РАК-САМІТНИК.", "desc_en": "The set of two commemorative coins is dedicated to the unique representatives of the marine fauna of the Black and Azov Seas – an integral component of Ukraine’s natural heritage. The Black and Azov Seas play an important role in preserving the region’s biodiversity, maintaining ecological balance, and ensuring the economic stability of the state. Among the many inhabitants of these waters are the hermit crab (Diogenes pugilator) and the round goby (Neogobius melanostomus) – species that serve as bioindicators of the state of the marine environment and are important elements of marine ecosystems. With this set of two commemorative coins, the National Bank of Ukraine aims to draw attention to the problem of preserving the seas, remind of humanity’s responsibility for protecting natural resources, and emphasize the importance of marine biota in shaping Ukraine’s ecosystem.\n\nThe obverse of the coin dedicated to the Sea of Azov features at the center of the composition a stylized outline of the Sea of Azov with the adjacent territory of Ukraine, rendered as relief horizontal lines imitating sea waves. At the top right is the small State Coat of Arms of Ukraine, beneath which the year of issue – 2025 is indicated horizontally, and vertically the inscription УКРАЇНА. At the bottom of the coin is the denomination 5 with the graphic symbol of the hryvnia and the logo of the National Bank of Ukraine Banknote Printing and Minting Works. In the lower part of the composition, in a semicircle, are the inscriptions: АЗОВСЬКЕ МОРЕ and THE SEA OF AZOV. The reverse of the coin depicts two round gobies (a decorative element – color printing) in their natural environment – on a sandy-silty bottom among rocky debris and aquatic vegetation. In the foreground is a clutch of eggs, drawing attention to the reproductive function of the species and its ecological significance. At the top, in a semicircle, is the inscription БИЧОК-КРУГЛЯК, and at the bottom – NEOGOBIUS MELANOSTOMUS.\n\nThe obverse of the coin dedicated to the Black Sea depicts a stylized outline of the Black Sea with the adjacent territory of Ukraine, rendered as relief horizontal lines of varying lengths imitating sea waves. At the top right is the small State Coat of Arms of Ukraine, beneath which is the inscription УКРАЇНА. At the bottom center are the denomination – 5 with the graphic symbol of the hryvnia, the year of issue of the coin – 2025, and the logo of the National Bank of Ukraine Banknote Printing and Minting Works. In the lower part of the composition, in a semicircle, are the inscriptions: ЧОРНЕ МОРЕ and THE BLACK SEA. The reverse of the coin depicts a hermit crab (a decorative element – color printing) in its typical biotope – on a rocky bottom with shells and shell fragments characteristic of the Black Sea coastal zone. At the top, in a semicircle, is the inscription DIOGENES PUGILATOR, at the bottom – РАК-САМІТНИК."}, {"id": 82, "uid": "17dbdc9b37", "name": "«Тим, хто врятував світ. 40 років Чорнобильської катастрофи» (н)", "cat": "Пам'ятні монети", "img": "images/img_82.jpg", "photos": [{"src": "images/img_82.jpg", "label": "Аверс"}, {"src": "images/img_82_b.jpg", "label": "Реверс"}, {"src": "images/img_82_c.jpg", "label": "Паковання"}, {"src": "images/img_82_d.jpg", "label": "Паковання (зворот)"}], "url": "https://coins.bank.gov.ua/-tim-hto-vrjatuvav-svit-40-rokiv-chornobilskoji-katastrophi-n-u-suvenirnomu-pakovanni/p-1191.html", "price": 242, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "рифлений", "yakist": "спеціальний анциркулейтед", "tyrazh": "35000", "rik": "2026", "seriya": "Інші монети", "nominal": "5", "hud": "Коваленко Микола", "skul": "—", "note": "Сувенірне паковання; дата введення в обіг 24.04.2026", "cat_nom": "5 грн", "cat_tir": 35000, "cat_year": 2026, "name_en": "\"To Those Who Saved the World. 40 Years Since the Chornobyl Disaster\" (nickel silver)", "desc_ua": "Пам’ятна монета присвячена учасникам ліквідації аварії на Чорнобильській атомній електростанції. До усунення наслідків найбільшої в історії ядерної енергетики катастрофи було долучено близько 600 тисяч людей – військових, пожежників, правоохоронців, медиків, науковців і добровольців, які ціною власного здоров’я та життя зменшили масштаб трагедії для мільйонів людей в Україні та за її межами. Назва монети перегукується з найменуванням пам’ятника “Тим, хто врятував світ” у Чорнобилі, який створено пожежниками (автор проєкту – Іван Симонов) у пам’ять про колег, які в перші хвилини аварії прийняли на себе нищівний удар вогняної стихії.\n\nНа аверсі монети розміщено напис ЧОРНОБ, у якому перші дві літери стилізовано під число 40, що символічно поєднує часовий вимір трагедії з її назвою, а незавершене зображення букви Б відіграє роль композиційного переходу до реверсу. У верхній частині композиції розміщено малий Державний Герб України, напис УКРАЇНА, рік карбування монети – 2026. Зверху ліворуч зображено логотип Банкнотно-монетного двору Національного банку України. Унизу монети – номінал 5 та графічний знак гривні.\n\nНа реверсі монети розміщено напис БІЛЬ, який за змістом перегукується з незавершеним словом на аверсі, а також нагадує про страждання, спричинені наслідками Чорнобильської катастрофи, і глибоку скорботу, що назавжди закарбувалася в колективній пам’яті. У верхній частині композиції – напис 40 РОКІВ ЧОРНОБИЛЬСЬКОЇ КАТАСТРОФИ.", "desc_en": "The commemorative coin is dedicated to the participants in the liquidation of the accident at the Chornobyl Nuclear Power Plant. About 600 thousand people were involved in eliminating the consequences of the largest catastrophe in the history of nuclear energy – military personnel, firefighters, law enforcement officers, medics, scientists, and volunteers who, at the cost of their own health and lives, reduced the scale of the tragedy for millions of people in Ukraine and beyond. The name of the coin echoes the name of the monument “To Those Who Saved the World” in Chornobyl, created by firefighters (project author – Ivan Symonov) in memory of colleagues who in the first minutes of the accident took upon themselves the devastating blow of the fire element.\n\nThe obverse of the coin bears the inscription ЧОРНОБ, in which the first two letters are stylized as the number 40, symbolically combining the temporal dimension of the tragedy with its name, and the unfinished depiction of the letter Б serves as a compositional transition to the reverse. In the upper part of the composition are the small State Coat of Arms of Ukraine, the inscription УКРАЇНА, the year of issue of the coin – 2026. At the top left is the logo of the National Bank of Ukraine Banknote Printing and Minting Works. At the bottom of the coin – the denomination 5 and the graphic sign of the hryvnia.\n\nThe reverse of the coin bears the inscription БІЛЬ, which echoes the unfinished word on the obverse, and also recalls the suffering caused by the consequences of the Chornobyl catastrophe and the deep sorrow forever engraved in collective memory. In the upper part of the composition – the inscription 40 РОКІВ ЧОРНОБИЛЬСЬКОЇ КАТАСТРОФИ."}];

function renderGPanel(){
gpanel.innerHTML=`<div class="grow"><input type="text" id="gnew" placeholder="${t('gNewPh')}"><button class="gbtn" id="gadd">${t('gAdd')}</button></div><div class="glist">`
+store.groups.map(g=>{const n=Object.keys(store.ig).filter(k=>(store.ig[k]||[]).includes(g.id)).length;
return `<div class="gitem"><span>${esc(g.name)} <small>· ${n}</small></span><button data-ren="${g.id}" title="${t('gRenT')}">✎</button><button data-del="${g.id}" title="${t('gDelT')}">×</button></div>`;}).join('')
+'</div><div style="color:var(--mut);font-size:12px;margin-top:8px">'+t('gNote')+'</div>';
document.getElementById('gadd').onclick=()=>{const v=document.getElementById('gnew').value.trim();if(!v)return;
store.groups.push({id:'g'+Date.now().toString(36),name:v});save();renderGPanel();renderGChips();};
document.getElementById('gnew').onkeydown=e=>{if(e.key==='Enter')document.getElementById('gadd').click();};
gpanel.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const id=b.dataset.del;
store.groups=store.groups.filter(g=>g.id!==id);
Object.keys(store.ig).forEach(k=>{store.ig[k]=store.ig[k].filter(x=>x!==id);if(!store.ig[k].length)delete store.ig[k];});
if(gfilter===id)gfilter='';save();renderGPanel();renderGChips();render();});
gpanel.querySelectorAll('[data-ren]').forEach(b=>b.onclick=()=>{const id=b.dataset.ren;const g=store.groups.find(x=>x.id===id);
const v=prompt(t('gNewName'),g.name);if(v&&v.trim()){g.name=v.trim();save();renderGPanel();renderGChips();}});}
// --- Вигляд: сітка / список ---
const vgrid=document.getElementById('vgrid'),vlist=document.getElementById('vlist');
function setView(v){store.view=v;save();vgrid.classList.toggle('on',v==='grid');vlist.classList.toggle('on',v==='list');render();}
vgrid.onclick=()=>setView('grid');vlist.onclick=()=>setView('list');
// --- Приховані позиції ---
const hbtn=document.getElementById('hbtn'),hpanel=document.getElementById('hpanel'),hpanelrow=document.getElementById('hpanelrow');
hbtn.onclick=()=>{const open=hpanelrow.style.display==='none';hpanelrow.style.display=open?'':'none';if(open)renderHPanel();};
function renderHPanel(){
const hs=store.hidden.map(u=>DATA.find(d=>d.uid===u)).filter(d=>d&&!store.deleted.includes(d.uid));
hpanel.innerHTML='<div class="gt" style="color:var(--mut);font-size:13px;margin-bottom:8px">'+t('hTitle')+'</div><div class="glist">'
+hs.map(d=>`<div class="gitem"><span>${esc(dispName(d))}</span><button data-back="${d.uid}">${t('hBack')}</button></div>`).join('')+'</div>'
+(hs.length?'':'<div style="color:var(--mut)">'+t('hNone')+'</div>');
hpanel.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{store.hidden=store.hidden.filter(u=>u!==b.dataset.back);save();renderHPanel();render();});}
// --- Серії: перейменування ---
const sbtn=document.getElementById('sbtn'),spanel=document.getElementById('spanel'),spanelrow=document.getElementById('spanelrow');
sbtn.onclick=()=>{const open=spanelrow.style.display==='none';spanelrow.style.display=open?'':'none';if(open)renderSPanel();};
function renderSPanel(){
const ss=allSeries();
spanel.innerHTML='<div style="color:var(--mut);font-size:13px;margin-bottom:8px">'+t('sTitle')+'</div><div class="glist">'
+ss.map(s=>{const n=DATA.filter(d=>effSer(d)===s&&!store.hidden.includes(d.uid)&&!store.deleted.includes(d.uid)).length;
const custom=store.seriesNames[s];
return `<div class="gitem"><span>${esc(serDisp(s))}${custom?` <small>· ${esc(s)}</small>`:''} <small>· ${n}</small></span><button data-sren="${escA(s)}" title="${t('gRenT')}">✎</button>${custom?`<button data-sreset="${escA(s)}" title="${t('resetNameT')}">↺</button>`:''}</div>`;}).join('')+'</div>';
spanel.querySelectorAll('[data-sren]').forEach(b=>b.onclick=()=>{const s=b.dataset.sren;const v=prompt(t('sNewName'),store.seriesNames[s]||s);if(v&&v.trim()&&v.trim()!==s){store.seriesNames[s]=v.trim();save();renderSerSelect();renderSPanel();render();}});
spanel.querySelectorAll('[data-sreset]').forEach(b=>b.onclick=()=>{delete store.seriesNames[b.dataset.sreset];save();renderSerSelect();renderSPanel();render();});}
// --- Експорт / імпорт налаштувань ---
document.getElementById('expbtn').onclick=()=>{const blob=new Blob([JSON.stringify(store)],{type:'application/json'});
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mycollection-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);};
document.getElementById('impfile').onchange=e=>{const f=e.target.files[0];if(!f)return;
const rd=new FileReader();rd.onload=()=>{try{const s=JSON.parse(rd.result);
if(s&&Array.isArray(s.groups)){store=Object.assign({groups:[],ig:{},view:'grid',lang:'ua',main:{},hidden:[],deleted:[],seriesNames:{},coinSeries:{},edits:{}},s);save();gfilter='';
vgrid.classList.toggle('on',store.view!=='list');vlist.classList.toggle('on',store.view==='list');
applyLang();}else alert(t('badFile'));}catch(err){alert(t('badFile'));}};
rd.readAsText(f);e.target.value='';};
const langUa=document.getElementById('langUa'),langEn=document.getElementById('langEn');
langUa.onclick=()=>setLang('ua');langEn.onclick=()=>setLang('en');
function setLang(l){if(store.lang===l)return;store.lang=l;save();applyLang();}
function applyLang(){
document.title=t('docTitle');document.documentElement.lang=store.lang==='en'?'en':'uk';
document.getElementById('h1t').textContent=t('h1');
document.getElementById('subt').textContent=t('sub');
document.getElementById('sl1').textContent=t('stItems');
document.getElementById('sl2').textContent=t('stValue');
document.getElementById('sl3').textContent=t('stYears');
q.placeholder=t('searchPh');
const _sv=sort.value;
sort.innerHTML=[['cat','sCat'],['year','sYear'],['name','sName'],['price','sPrice'],['tir','sTir']].map(([v,k])=>`<option value="${v}">${t(k)}</option>`).join('');
sort.value=_sv;
vgrid.title=t('gridV');vlist.title=t('listV');
document.getElementById('gbtn').textContent=t('myGroups');
sbtn.textContent=t('seriesB');
hbtn.textContent=t('hiddenB');
const _eb=document.getElementById('expbtn');_eb.textContent=t('exportB');_eb.title=t('exportT');
document.getElementById('implabel').textContent=t('importB');
document.getElementById('foott').textContent=t('footer');
langUa.classList.toggle('on',store.lang==='ua');langEn.classList.toggle('on',store.lang==='en');
vgrid.classList.toggle('on',store.view!=='list');vlist.classList.toggle('on',store.view==='list');
renderSerSelect();renderChips();renderGChips();render();
if(curM&&document.getElementById('mback').classList.contains('open'))openM(curM);}
applyLang();
</script>
</body></html>
