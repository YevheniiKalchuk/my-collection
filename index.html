тьби. По колу змію оточують стилізовані символи, притаманні кожній порі року: сніжинки (угорі праворуч), квітки (унизу праворуч), плоди (унизу ліворуч), гілки (угорі ліворуч). На аверсі монети розміщено: угорі – малий Державний Герб України, праворуч від якого напис півколом УКРАЇНА; на дзеркальному тлі по колу зображені 12 символів східного календаря, у центрі кола – стилізований годинник зі стрілкою, що вказує на змію – символ року, над стрілкою – 2025; унизу ліворуч напис півколом 5 ГРИВЕНЬ; на матовому тлі зображені стилізовані під українську витинанку символи кожної пори року: сніжинка (угорі), квітка (праворуч), ягода (унизу), листок (ліворуч); логотип Банкнотно-монетного двору Національного банку України (праворуч над символом тигра).", "desc_en": "The reverse of the coin features in the centre of the composition the symbol of the 2025 Eastern calendar – a mysterious snake that also signifies danger for the enemy. The image is set in a hexagon, expressing dynamics and inner strength, and combined with the aggressive depiction of the head – hostility and unpredictability for the attacker. The snake's tail is whimsically curled and resembles a sabre, symbolising readiness for battle. Around the circle, the snake is surrounded by stylised symbols characteristic of each season: snowflakes (top right), flowers (bottom right), fruits (bottom left), branches (top left). The obverse of the coin features: at the top – the small State Coat of Arms of Ukraine, to the right of which the inscription УКРАЇНА in a semicircle; on a mirror background around the circle are the 12 symbols of the Eastern calendar, in the centre of the circle – a stylised clock with a hand pointing to the snake – the symbol of the year, above the hand – 2025; at the bottom left the inscription 5 ГРИВЕНЬ in a semicircle; on the matte background are stylised symbols of each season in the Ukrainian vytynanka style: a snowflake (top), a flower (right), a berry (bottom), a leaf (left); the logo of the National Bank of Ukraine Banknote Printing and Minting Works (right, above the tiger symbol)."}, {"id": 37, "uid": "733189d065", "name": "Парламентаризм у сувенірному пакованні (н)", "cat": "Пам'ятні монети", "img": "images/img_37.jpg", "photos": [{"src": "images/img_37.jpg", "label": "Аверс"}, {"src": "images/img_37_b.jpg", "label": "Реверс"}, {"src": "images/img_37_c.jpg", "label": "Реверс"}, {"src": "images/img_37_d.jpg", "label": "Фото 4"}], "url": "https://coins.bank.gov.ua/parlamentarizm-u-suvenirnomu-pakovanni-n-/p-1113.html", "price": 163, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "рифлений", "yakist": "спеціальний анциркулейтед", "tyrazh": "50000", "rik": "2024", "seriya": "Інші монети", "nominal": "5", "hud": "Дизайн – Балута Тетяна", "skul": "Атаманчук Володимир", "note": "", "cat_nom": "5 грн", "cat_tir": 50000, "cat_year": 2024, "name_en": "\"Parliamentarism\" (nickel silver) in souvenir packaging", "desc_ua": "Пам’ятна монета “Парламентаризм” присвячена системі політичної організації держави, важливій складовій демократичного устрою країни, що ґрунтується на принципах народного представництва, поділу влади та верховенства права. В Україні єдиним органом законодавчої влади є Верховна Рада. Вона формує законодавчу базу, контролює виконавчу владу та визначає стратегічні напрями розвитку держави. На сучасному етапі, навіть в умовах воєнного стану, Верховна Рада працює над удосконаленням законодавчої бази, захистом держави та громадян, а також над впровадженням реформ, спрямованих на зміну світоглядних принципів на всіх рівнях життя і рухом країни до європейського добробуту. На реверсі монети по колу розміщено стилізований український орнамент. На дзеркальному тлі в центрі композиції розміщено логотип Верховної Ради України. На аверсі монети в центрі композиції розміщено малий Державний Герб України. У верхній частині навколо герба зображені стилізовані силуети сучасних українців, які є представниками різних соціальних, вікових та професійних груп. Це втілює ідею багатогранності українського народу та підкреслює, що кожний громадянин згідно зі статтею 3 Конституції України є найвищою соціальною цінністю нашої держави. Між силуетами розміщено написи: ПРАВА, СВОБОДА, ДЕМОКРАТІЯ, ЛЮДИНА, ЗАХИСТ ВІТЧИЗНИ, НАРОД, ПАРЛАМЕНТАРИЗМ, РОЗВИТОК КРАЇНИ, ІНКЛЮЗИВНІСТЬ, РІВНІСТЬ, ЄВРОІНТЕГРАЦІЯ та ЗАКОН, що відображають фундаментальні принципи демократії. Нижче герба зображено впізнаване всіма українцями інформаційне табло для відображення в сесійній залі Верховної Ради результатів голосування, під яким зазначено напис УКРАЇНА і рік карбування – 2024, ліворуч – логотип Банкнотно-монетного двору Національного банку України, праворуч – номінал 5 з графічним символом гривні.", "desc_en": "The commemorative coin “Парламентаризм” is dedicated to the system of political organisation of the state, an important component of the country's democratic order, based on the principles of popular representation, separation of powers and the rule of law. In Ukraine, the sole body of legislative power is the Verkhovna Rada. It forms the legislative base, controls the executive branch and determines the strategic directions of the state's development. At the current stage, even under martial law, the Verkhovna Rada works to improve the legislative base, protect the state and citizens, and implement reforms aimed at changing worldview principles at all levels of life and moving the country towards European prosperity. The reverse of the coin features a stylised Ukrainian ornament around the circle. On a mirror background in the centre of the composition is the logo of the Verkhovna Rada of Ukraine. The obverse of the coin features the small State Coat of Arms of Ukraine in the centre of the composition. In the upper part around the coat of arms are stylised silhouettes of modern Ukrainians representing different social, age and professional groups. This embodies the idea of the multifacetedness of the Ukrainian people and emphasises that every citizen, according to Article 3 of the Constitution of Ukraine, is the highest social value of our state. Between the silhouettes are the inscriptions: ПРАВА, СВОБОДА, ДЕМОКРАТІЯ, ЛЮДИНА, ЗАХИСТ ВІТЧИЗНИ, НАРОД, ПАРЛАМЕНТАРИЗМ, РОЗВИТОК КРАЇНИ, ІНКЛЮЗИВНІСТЬ, РІВНІСТЬ, ЄВРОІНТЕГРАЦІЯ and ЗАКОН, reflecting the fundamental principles of democracy. Below the coat of arms is the information board recognisable to all Ukrainians, used in the Verkhovna Rada session hall to display voting results, under which are the inscription УКРАЇНА and the year of issue – 2024; to the left – the logo of the National Bank of Ukraine Banknote Printing and Minting Works, to the right – the denomination 5 with the hryvnia graphic symbol."}, {"id": 38, "uid": "b2dd78e4ae", "name": "Ой у лузі червона калина у сувенірній упаковці (н)", "cat": "Пам'ятні монети", "img": "images/img_38.jpg", "photos": [{"src": "images/img_38.jpg", "label": "Аверс"}, {"src": "images/img_38_b.jpg", "label": "Реверс"}, {"src": "images/img_38_c.jpg", "label": "Реверс"}, {"src": "images/img_38_d.jpg", "label": "Аверс"}], "url": "https://coins.bank.gov.ua/oj-u-luzi-chervona-kalina-u-suvenirnij-upakovci-n-/p-843.html", "price": 198, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "рифлений", "yakist": "спеціальний анциркулейтед", "tyrazh": "145000", "rik": "2022", "seriya": "Безсмертна моя Україно", "nominal": "5", "hud": "Кривонос Дмитро", "skul": "Іваненко Святослав, Атаманчук Володимир", "note": "", "cat_nom": "5 грн", "cat_tir": 145000, "cat_year": 2022, "name_en": "\"Oh, the Red Viburnum in the Meadow\" (nickel silver) in souvenir packaging", "desc_ua": "На реверсі монети на дзеркальному тлі розміщено: угорі півколом напис – продовження пісні: А МИ НАШУ СЛАВНУ УКРАЇНУ, ГЕЙ, ГЕЙ, РОЗВЕСЕЛИМО!; у центрі зображено гілку – листок і ягоди калини. На аверсі монети на дзеркальному тлі розміщено: малий Державний Герб України (ліворуч), у центрі – стилізовану символічну композицію: захисники різних поколінь – козак, січовий стрілець і сучасний воїн Збройних Сил України, підіймають калину – опоетизований символ України, крона якої нагадує абриси кордонів нашої Батьківщини; написи: А МИ ТУЮ ЧЕРВОНУ КАЛИНУ ПІДІЙМЕМО, (угорі півколом), унизу рік карбування – 2022 та півколом – УКРАЇНА, праворуч номінал – 5 та розміщено графічний символ гривні; унизу праворуч (під номіналом) логотип Банкнотно-монетного двору Національного банку України.", "desc_en": "The reverse of the coin features on a mirror background: at the top in a semicircle the inscription – a continuation of the song: А МИ НАШУ СЛАВНУ УКРАЇНУ, ГЕЙ, ГЕЙ, РОЗВЕСЕЛИМО!; in the centre a branch – a leaf and guelder-rose berries. The obverse of the coin features on a mirror background: the small State Coat of Arms of Ukraine (left), in the centre – a stylised symbolic composition: defenders of different generations – a Cossack, a Sich Rifleman and a modern warrior of the Armed Forces of Ukraine – raising the guelder rose – a poeticised symbol of Ukraine whose crown resembles the outlines of our Motherland's borders; the inscriptions: А МИ ТУЮ ЧЕРВОНУ КАЛИНУ ПІДІЙМЕМО, (at the top in a semicircle), at the bottom the year of issue – 2022 and in a semicircle – УКРАЇНА, to the right the denomination – 5 and the hryvnia graphic symbol; at the bottom right (under the denomination) the logo of the National Bank of Ukraine Banknote Printing and Minting Works."}, {"id": 39, "uid": "8f011a59a9", "name": "Пльонтанізм (Іван Марчук) у сувенірному пакованні (н)", "cat": "Пам'ятні монети", "img": "images/img_39.jpg", "photos": [{"src": "images/img_39.jpg", "label": "Аверс"}, {"src": "images/img_39_b.jpg", "label": "Паковання"}, {"src": "images/img_39_c.jpg", "label": "Паковання"}, {"src": "images/img_39_d.jpg", "label": "Реверс"}], "url": "https://coins.bank.gov.ua/plontanizm-ivan-marchuk-u-suvenirnomu-pakovanni-n-/p-1110.html", "price": 472, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "рифлений", "yakist": "спеціальний анциркулейтед", "tyrazh": "75000", "rik": "2024", "seriya": "Українська спадщина", "nominal": "5", "hud": "Марчук Іван; адаптація дизайну – Кучинська Олександра", "skul": "Атаманчук Володимир, Дем'яненко Володимир", "note": "", "cat_nom": "5 грн", "cat_tir": 75000, "cat_year": 2024, "name_en": "\"Pliontanism (Ivan Marchuk)\" (nickel silver) in souvenir packaging", "desc_ua": "На реверсі монет зображено фрагмент картини “Пробудження” – образ дівчини з блакитно-жовтою стрічкою на голові. Вона стоїть на тлі квітучого безмежжя рідних просторів, символізуючи пробудження України. На аверсі монети в центрі композиції зображено фрагмент картини “Пробудження”, створеної Іваном Марчуком у 1992 році. Мотив дизайну – коло, що асоціативно нагадує сонце, символізуючи джерело життя, енергії та розвитку. Праворуч від композиції на матовому тлі розміщено написи УКРАЇНА, номінал 5 та графічний символ гривні. Також зазначено рік карбування – 2024, малий Державний Герб України та логотип Банкнотно-монетного двору Національного банку України.", "desc_en": "The reverse of the coin depicts a fragment of the painting “Пробудження” – the image of a girl with a blue-and-yellow ribbon on her head. She stands against the backdrop of the blooming infinity of her native expanses, symbolising the awakening of Ukraine. The obverse of the coin features in the centre of the composition a fragment of the painting “Пробудження”, created by Ivan Marchuk in 1992. The design motif is a circle, associatively reminiscent of the sun, symbolising the source of life, energy and development. To the right of the composition on a matte background are the inscriptions УКРАЇНА, the denomination 5 and the hryvnia graphic symbol. Also marked are the year of issue – 2024, the small State Coat of Arms of Ukraine and the logo of the National Bank of Ukraine Banknote Printing and Minting Works."}, {"id": 40, "uid": "e3c4e884ed", "name": "Країна супергероїв. Дякуємо медикам! (н)", "cat": "Пам'ятні монети", "img": "images/img_40.jpg", "photos": [{"src": "images/img_40.jpg", "label": "Аверс"}, {"src": "images/img_40_b.jpg", "label": "Реверс"}, {"src": "images/img_40_c.jpg", "label": "Аверс"}], "url": "https://coins.bank.gov.ua/krajina-supergerojiv-djakuiemo-medikam-n-/p-1107.html", "price": 161, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "рифлений", "yakist": "спеціальний анциркулейтед", "tyrazh": "50000", "rik": "2024", "seriya": "Безсмертна моя Україно", "nominal": "5", "hud": "Таран Володимир, Харук Сергій, Харук Олександр", "skul": "Атаманчук Володимир", "note": "", "cat_nom": "5 грн", "cat_tir": 75000, "cat_year": 2024, "name_en": "\"Country of Superheroes. Thank You, Medics!\" (nickel silver)", "desc_ua": "На реверсі монети в центрі композиції змодельовано смужки бинта, що перетинаються. Вони ніби ізолюють рану, накриту рукою медика, яка немов зцілює і тамує біль. Це символізує самовідданість та професіоналізм медичних працівників, які борються за життя людей у найскладніших обставинах. На аверсі монети зображено стилізовану смужку бинта, на якій проступила кров у формі абрису території України. Це незагоєна рана в серці кожного українця, яка постійно болить і кривавить. Угорі на дзеркальному тлі викарбувано напис УКРАЇНА, праворуч від напису малий Державний Герб України. Під бинтом унизу праворуч – номінал монети 5, графічний знак гривні та рік карбування монети 2024, унизу ліворуч – логотип Банкнотно-монетного двору Національного банку України.", "desc_en": "The reverse of the coin features in the centre of the composition modelled strips of bandage crossing each other. They seem to isolate a wound covered by a medic's hand that appears to heal and soothe pain. This symbolises the dedication and professionalism of medical workers who fight for people's lives in the most difficult circumstances. The obverse of the coin depicts a stylised strip of bandage on which blood has appeared in the shape of the territory of Ukraine. This is an unhealed wound in the heart of every Ukrainian that constantly aches and bleeds. At the top on a mirror background is the inscription УКРАЇНА, to the right of the inscription the small State Coat of Arms of Ukraine. Under the bandage at the bottom right – the coin denomination 5, the hryvnia graphic sign and the year of issue 2024; at the bottom left – the logo of the National Bank of Ukraine Banknote Printing and Minting Works."}, {"id": 41, "uid": "e6213f8570", "name": "Пам`ятна медаль «Місто героїв - Маріуполь»", "cat": "Пам'ятні медалі", "img": "images/img_41.jpg", "photos": [{"src": "images/img_41.jpg", "label": "Аверс"}, {"src": "images/img_41_b.jpg", "label": "Реверс"}], "url": "https://coins.bank.gov.ua/pam-atna-medal-misto-geroiv-mariupol-/p-835.html", "price": 75, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "гладкий", "yakist": "спеціальний анциркулейтед", "tyrazh": "65000", "rik": "2022", "seriya": "—", "nominal": "—", "hud": "Куц Марина", "skul": "Атаманчук Володимир; програмне моделювання – Лук'янов Юрій", "note": "Пам'ятна медаль", "cat_nom": "—", "cat_tir": 65000, "cat_year": 2022, "name_en": "Commemorative medal \"City of Heroes – Mariupol\"", "desc_ua": "На реверсі медалі на дзеркальному тлі зображено образ відданого Україні воїна, готового захищати державу до останнього; навколо воїна розміщено стилізовані уламки, зброю, перехрестя прицілу та вертикальний напис АЗОВ (угорі ліворуч) СТАЛЬ (унизу праворуч). На аверсі медалі розміщено: угорі напис УКРАЇНА, під яким малий Державний Герб України; композицію, що символізує місто-герой: фасад драматичного театру під прицілом (ліворуч), стилізовані конструкції Азовсталі, на які летять бомби (праворуч); на матовому тлі дзеркальні написи: МІСТО/ МАРІУПОЛЬ/ГЕРОЇВ/2022, у написанні слова “Маріуполь” літеру “і” заміняє свічка як символ пам’яті за загиблими, літеру “о” імітує карта міста, створена з двох профілів – дитячого та дорослого, як символ примусової депортації; унизу на тлі стилізованих хвиль зображено якір – один з геральдичних елементів, що є на гербі Маріуполя, як образ надії на звільнення та відродження українського міста; логотип Банкнотно-монетного двору Національного банку України (унизу праворуч).", "desc_en": "The reverse of the medal depicts on a mirror background the image of a warrior devoted to Ukraine, ready to defend the state to the last; around the warrior are stylised debris, weapons, a crosshair intersection and the vertical inscription АЗОВ (top left) СТАЛЬ (bottom right). The obverse of the medal features: at the top the inscription УКРАЇНА, under which the small State Coat of Arms of Ukraine; a composition symbolising the hero city: the facade of the drama theatre under crosshairs (left), stylised structures of Azovstal with bombs flying at them (right); on the matte background mirror inscriptions: МІСТО/ МАРІУПОЛЬ/ГЕРОЇВ/2022 – in the writing of the word “Маріуполь”, the letter “і” is replaced by a candle as a symbol of remembrance for the fallen, the letter “о” is imitated by a map of the city created from two profiles – a child's and an adult's – as a symbol of forced deportation; at the bottom against the background of stylised waves is an anchor – one of the heraldic elements on the coat of arms of Mariupol – as an image of hope for the liberation and revival of the Ukrainian city; the logo of the National Bank of Ukraine Banknote Printing and Minting Works (bottom right)."}, {"id": 42, "uid": "a99a918d38", "name": "Пам`ятна медаль «Місто героїв - Харків»", "cat": "Пам'ятні медалі", "img": "images/img_42.jpg", "photos": [{"src": "images/img_42.jpg", "label": "Аверс"}, {"src": "images/img_42_b.jpg", "label": "Реверс"}], "url": "https://coins.bank.gov.ua/pam-atna-medal-misto-geroiv-harkiv-/p-836.html", "price": 75, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "гладкий", "yakist": "спеціальний анциркулейтед", "tyrazh": "65000", "rik": "2022", "seriya": "—", "nominal": "—", "hud": "Фандікова Наталія", "skul": "Демяненко Анатолій, Іваненко Святослав; програмне моделювання – Лук'янов Юрій", "note": "Пам'ятна медаль", "cat_nom": "—", "cat_tir": 65000, "cat_year": 2022, "name_en": "Commemorative medal \"City of Heroes – Kharkiv\"", "desc_ua": "Пам`ятна медаль присвячена героїчному, гордому, нескореному Харкову, який з перших днів повномасштабного вторгнення російських військ на територію України зазнає масованого терору: бомбардувань, обстрілів, руйнувань житлових будинків, інфраструктури, людських втрат у місті та всій області, але протистоїть ворогу. Це місто героїв, які довели всьому світу, що вони витримали: під відлуння вибухів народжуються малюки, відбуваються освітні процеси, економіка міста адаптується до військових умов, а багато підприємців змінили свою діяльність і поставили її на військові рейки, культурні діячі, митці, поети, письменники, активісти – кожний бореться на своєму фронті. Блискавичний контрнаступ на Харківщині виконав стратегічну ціль – змінив хід війни та став одним із перших знакових успіхів Збройних Сил України на шляху до повного відновлення територіальної цілісності нашої держави. На реверсі медалі на дзеркальному тлі напис – ХАРКІВ, у якому літеру І подано у формі свічки/МІСТО ГЕРОЇВ, що ділить поле медалі на дві частини, об’єднані спільним задумом: у верхній частині композиції зображено побиті та понівечені снарядами і бомбами будівлі, у нижній – стилізована панорама міста з його історичними пам’ятками та половецькими кам’яними бабами з гори Кременець біля Ізюма – пам’ятки сакрального мистецтва (IX–XIII століть). На аверсі медалі розміщено: угорі написи – 2022/УКРАЇНА, унизу – малий Державний Герб України, у центрі композицію: та тлі стилізованої карти міста рядки з історичного роману Ліни Костенко “Берестечко”: ЧИ СПРАВДІ ВІРИВ Я У ПЕРЕМОГУ/В ТАКІЙ ТЯЖКІЙ НЕРІВНІЙ БОРОТЬБІ?/ТАК, ВІРИВ Я. НАЙПЕРШЕ ВІРИВ – БОГУ./І ВІРИВ ЛЮДЯМ. ЛЮДЯМ І СОБІ./ЛІНА КОСТЕНКО; колаж з визначних пам’яток міста: харківський Кобзар – пам’ятник Тарасові Шевченку, один з найкращих зразків монументального мистецтва (ліворуч), пам’ятка, що входить до світової спадщини ЮНЕСКО, – будівля Держпрому, зведена в 1920-х роках у стилі конструктивізму, альтанка-фонтан “Дзеркальний струмінь” – один із сучасних символів міста; логотип Банкнотно-монетного двору Національного банку України (ліворуч над пам’ятником).", "desc_en": "The commemorative medal is dedicated to heroic, proud, unconquered Kharkiv, which since the first days of the full-scale invasion of Russian troops into Ukraine has been subjected to massive terror: bombings, shelling, destruction of residential buildings, infrastructure, human losses in the city and the entire region, but resists the enemy. This is a city of heroes who have proven to the whole world that they have endured: babies are born to the echoes of explosions, educational processes take place, the city's economy adapts to military conditions, and many entrepreneurs have changed their activities and put them on a military footing; cultural figures, artists, poets, writers, activists – everyone fights on their own front. The lightning-fast counteroffensive in the Kharkiv region achieved its strategic goal – it changed the course of the war and became one of the first significant successes of the Armed Forces of Ukraine on the path to the full restoration of the territorial integrity of our state. The reverse of the medal features on a mirror background the inscription – ХАРКІВ, in which the letter І is presented in the form of a candle/МІСТО ГЕРОЇВ, dividing the medal field into two parts united by a common idea: in the upper part of the composition – buildings battered and mutilated by shells and bombs, in the lower – a stylised panorama of the city with its historical landmarks and Polovtsian stone babas from Mount Kremenets near Izium – monuments of sacred art (9th–13th centuries). The obverse of the medal features: at the top the inscriptions – 2022/УКРАЇНА, at the bottom – the small State Coat of Arms of Ukraine; in the centre a composition: against the background of a stylised city map, lines from Lina Kostenko's historical novel “Берестечко”: ЧИ СПРАВДІ ВІРИВ Я У ПЕРЕМОГУ/В ТАКІЙ ТЯЖКІЙ НЕРІВНІЙ БОРОТЬБІ?/ТАК, ВІРИВ Я. НАЙПЕРШЕ ВІРИВ – БОГУ./І ВІРИВ ЛЮДЯМ. ЛЮДЯМ І СОБІ./ЛІНА КОСТЕНКО; a collage of the city's famous landmarks: the Kharkiv Kobzar – the monument to Taras Shevchenko, one of the finest examples of monumental art (left); the monument included in the UNESCO World Heritage List – the Derzhprom building, built in the 1920s in the constructivist style; the “Mirror Stream” fountain gazebo – one of the modern symbols of the city; the logo of the National Bank of Ukraine Banknote Printing and Minting Works (left, above the monument)."}, {"id": 43, "uid": "6e92cdab80", "name": "Пам`ятна медаль «Київщина. Міста героїв: Буча, Гостомель, Ірпінь»", "cat": "Пам'ятні медалі", "img": "images/img_43.jpg", "photos": [{"src": "images/img_43.jpg", "label": "Аверс"}, {"src": "images/img_43_b.jpg", "label": "Реверс"}], "url": "https://coins.bank.gov.ua/pam-atna-medal-kiivsina-mista-geroiv-buca-gostomel-irpin-/p-834.html", "price": 75, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "гладкий", "yakist": "спеціальний анциркулейтед", "tyrazh": "65000", "rik": "2022", "seriya": "—", "nominal": "—", "hud": "Куц Марина", "skul": "Демяненко Анатолій, Дем'яненко Володимир; програмне моделювання – Лук'янов Юрій", "note": "Пам'ятна медаль", "cat_nom": "—", "cat_tir": 65000, "cat_year": 2022, "name_en": "Commemorative medal \"Kyiv Region. Cities of Heroes: Bucha, Hostomel, Irpin\"", "desc_ua": "На реверсі медалі на дзеркальному тлі зображено дівчинку на гойдалці, у якої під час “польоту” розривається стрічка для волосся, що символізує перерване життя; унизу праворуч – відбитки брудних чобіт ворога, який вторгся в мирне життя українців; ліворуч – птах як символ продовження життя (біля дівчинки); стилізоване місто (угорі); ліс; прострілена “ріка життя” (унизу). Художник – Марина Куц. На аверсі медалі розміщено: угорі: малий Державний Герб України, праворуч від якого написи: 2022/УКРАЇНА; у центрі на дзеркальному тлі – стилізовану композицію, сформовану з мап міст Київщини: Гостомеля, Бучі, Ірпеня, які в поєднанні нагадують форму серця; угорі праворуч від композиції – ворожий десантник з простріленим парашутом; угорі композиції – легендарний літак “Мрія”; у центрі – дзеркальна сльоза; унизу ліворуч – стилізована квітка як символ відродження життя. Ліворуч від центральної композиції – стилізовані вікна будинків, праворуч – кулі, що летять; унизу напис: КИЇВЩИНА/МІСТА ГЕРОЇВ та логотип Банкнотно-монетного двору Національного банку України. Композицію аверсу доповнюють зображення, що символізують рани як свідчення фізичних і моральних страждань, завданих українцям окупантами: дзеркальна (ліворуч над вікнами), “зашита” рана (праворуч над кулями), рана “зашита” елементом національної вишивки (ліворуч під вікнами); унизу праворуч – елемент національної вишивки, що символізує загоєння ран та відновлення.", "desc_en": "The reverse of the medal depicts on a mirror background a girl on a swing whose hair ribbon tears during the “flight”, symbolising an interrupted life; at the bottom right – the imprints of the enemy's dirty boots that invaded the peaceful life of Ukrainians; to the left – a bird as a symbol of the continuation of life (near the girl); a stylised city (at the top); a forest; a shot-through “river of life” (at the bottom). Artist – Maryna Kuts. The obverse of the medal features: at the top: the small State Coat of Arms of Ukraine, to the right of which the inscriptions: 2022/УКРАЇНА; in the centre on a mirror background – a stylised composition formed from the maps of the Kyiv region cities: Hostomel, Bucha, Irpin, which together resemble the shape of a heart; at the top right of the composition – an enemy paratrooper with a pierced parachute; at the top of the composition – the legendary “Mriya” aircraft; in the centre – a mirror tear; at the bottom left – a stylised flower as a symbol of the revival of life. To the left of the central composition – stylised house windows, to the right – flying bullets; at the bottom the inscription: КИЇВЩИНА/МІСТА ГЕРОЇВ and the logo of the National Bank of Ukraine Banknote Printing and Minting Works. The obverse composition is complemented by images symbolising wounds as evidence of the physical and moral suffering inflicted on Ukrainians by the occupiers: a mirror (left above the windows), a “sewn-up” wound (right above the bullets), a wound “stitched” with an element of national embroidery (left under the windows); at the bottom right – an element of national embroidery symbolising the healing of wounds and recovery."}, {"id": 44, "uid": "66cf4427a2", "name": "Пам`ятна медаль «Місто героїв - Охтирка»", "cat": "Пам'ятні медалі", "img": "images/img_44.jpg", "photos": [{"src": "images/img_44.jpg", "label": "Аверс"}, {"src": "images/img_44_b.jpg", "label": "Реверс"}], "url": "https://coins.bank.gov.ua/pam-jatna-medal-misto-gerojiv-ohtirka-/p-872.html", "price": 75, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "гладкий", "yakist": "спеціальний анциркулейтед", "tyrazh": "65000", "rik": "2023", "seriya": "—", "nominal": "—", "hud": "Куц Марина", "skul": "Програмне моделювання – Лук'янов Юрій", "note": "Пам'ятна медаль", "cat_nom": "—", "cat_tir": 65000, "cat_year": 2022, "name_en": "Commemorative medal \"City of Heroes – Okhtyrka\"", "desc_ua": "На реверсі медалі на дзеркальному тлі зображено стилізовану композицію, що символічно представляє сьогодення крізь призму твору уродженця Охтирки Івана Багряного “Тигролови”, у якому утверджується мужність, здатність перемагати: український захисник – новітній мисливець за “хижаками”, над яким сяє сонце, та написи: СМІЛИВІ (ліворуч вертикальний) ЗАВЖДИ (угорі) МАЮТЬ (праворуч) ЩАСТЯ (унизу) - використано шрифт ZERNO, автор О. Ліщук. На аверсі медалі розміщено: угорі, на тлі стилізованого сяючого сонця з блискавками (символізують покарання для агресорів) – малий Державний Герб України, під яким птах як символ звільнення та написи півколом: УКРАЇНА (ліворуч), ОХТИРКА (праворуч); унизу – стилізована композиція: місто, що зазнає ворожих бомбардувань, праворуч – слід від ракети, що влучає в будівлю міської ради, ліворуч – житловий будинок, за яким грається дитина; на тлі композиції написи: 2023/МІСТО/ГЕРОЇВ; логотип Банкнотно-монетного двору Національного банку України (праворуч).", "desc_en": "The reverse of the medal depicts on a mirror background a stylised composition symbolically representing the present through the prism of the work of Okhtyrka native Ivan Bahrianyi “Тигролови”, which affirms courage and the ability to win: a Ukrainian defender – a modern hunter of “predators”, above whom the sun shines, and the inscriptions: СМІЛИВІ (left, vertical) ЗАВЖДИ (top) МАЮТЬ (right) ЩАСТЯ (bottom) – the ZERNO font is used, author O. Lishchuk. The obverse of the medal features: at the top, against the background of a stylised radiant sun with lightning (symbolising punishment for aggressors) – the small State Coat of Arms of Ukraine, under which a bird as a symbol of liberation and the inscriptions in a semicircle: УКРАЇНА (left), ОХТИРКА (right); at the bottom – a stylised composition: a city under enemy bombardment, to the right – a trail of a missile hitting the city council building, to the left – a residential building behind which a child is playing; against the composition background the inscriptions: 2023/МІСТО/ГЕРОЇВ; the logo of the National Bank of Ukraine Banknote Printing and Minting Works (right)."}, {"id": 45, "uid": "fd5b0940b9", "name": "Українська бавовна. Лелека-100 (н)", "cat": "Пам'ятні монети", "img": "images/img_45.jpg", "photos": [{"src": "images/img_45.jpg", "label": "Аверс"}, {"src": "images/img_45_b.jpg", "label": "Реверс"}], "url": "https://coins.bank.gov.ua/ukrajinska-bavovna-leleka-100-n-/p-1105.html", "price": 121, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "рифлений", "yakist": "спеціальний анциркулейтед", "tyrazh": "75000", "rik": "2024", "seriya": "Збройні Сили України", "nominal": "5", "hud": "Таран Володимир, Харук Олександр, Харук Сергій", "skul": "Демяненко Анатолій, Дем'яненко Володимир", "note": "", "cat_nom": "5 грн", "cat_tir": 75000, "cat_year": 2024, "name_en": "\"Ukrainian Cotton. 'Leleka-100'\" (nickel silver)", "desc_ua": "На аверсі монети змодельовано стилізоване зображення з монітора керування польотом безпілотника “Лелека-100”, де на степових дорогах відображені виявлені ворожі цілі – танки. У центрі – абрис планера комплексу, який втілює технологічний прогрес та інноваційний потенціал України. Унизу ліворуч на дзеркальному тлі – малий Державний Герб України, праворуч – номінал монети 5 та графічний знак гривні, під безпілотним комплексом по центру викарбувано напис УКРАЇНА, рік карбування монети 2024 і логотип Банкнотно-монетного двору Національного банку України. На реверсі монети зображено планер розвідувального комплексу в польоті. Над ним – стилізований абрис птаха лелеки, що символізує мир та спокій, які забезпечуються завдяки пильності “Лелеки-100”. У нижній частині композиції – вид земної поверхні з умовною схемою візуального дослідження маршруту прольоту, що віддзеркалює стратегічне бачення та планування. Стилізовані вертикальна і горизонтальна шкали символізують здатність комплексу визначати координати цілей і коригувати вогонь артилерії. Ліворуч унизу паралельно безпілотнику розміщено напис ЛЕЛЕКА-100.", "desc_en": "The obverse of the coin models a stylised image from the flight control monitor of the “Лелека-100” drone, where enemy targets – tanks – are displayed on steppe roads. In the centre – the outline of the complex's glider, which embodies Ukraine's technological progress and innovative potential. At the bottom left on a mirror background – the small State Coat of Arms of Ukraine, to the right – the coin denomination 5 and the hryvnia graphic sign; under the unmanned complex in the centre are engraved the inscription УКРАЇНА, the year of issue 2024 and the logo of the National Bank of Ukraine Banknote Printing and Minting Works. The reverse of the coin depicts the reconnaissance complex's glider in flight. Above it – the stylised outline of a stork, symbolising peace and tranquillity ensured by the vigilance of “Лелека-100”. In the lower part of the composition – a view of the earth's surface with a conditional scheme of visual survey of the flight route, reflecting strategic vision and planning. The stylised vertical and horizontal scales symbolise the complex's ability to determine target coordinates and adjust artillery fire. At the bottom left, parallel to the drone, is the inscription ЛЕЛЕКА-100."}, {"id": 46, "uid": "206459dd9f", "name": "Пам`ятна медаль «Об`єднані заради справедливості»", "cat": "Пам'ятні медалі", "img": "images/img_46.jpg", "photos": [{"src": "images/img_46.jpg", "label": "Аверс"}, {"src": "images/img_46_b.jpg", "label": "Реверс"}], "url": "https://coins.bank.gov.ua/pam-jatna-medal-ob-iednani-zaradi-spravedlivosti-/p-1058.html", "price": 75, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "гладкий", "yakist": "спеціальний анциркулейтед", "tyrazh": "20000", "rik": "2023", "seriya": "—", "nominal": "—", "hud": "Дизайн – Олександра Кучинська", "skul": "—", "note": "Пам'ятна медаль", "cat_nom": "—", "cat_tir": 20000, "cat_year": 2023, "name_en": "Commemorative medal \"United for Justice\"", "desc_ua": "На реверсі медалі на дзеркальному тлі розміщено написи: назву міжнародної конференції – ОБ’ЄДНАНІ ЗАРАДИ СПРАВЕДЛИВОСТІ / UNITED FOR JUSTICE (по колу), місце проведення – ЛЬВІВ • LVIV, хештег – #U4J, рік проведення заходу – 2023 (у центрі). На аверсі медалі розміщено стилізовану композицію, яка символізує те, що справедливість для України означає справедливість та безпеку для всього світу: у центрі композиції – карта України, на якій розміщено щит із зображенням планети Земля, по обидва боки від якого – шальки терезів правосуддя; угорі та внизу – малий Державний Герб України та напис УКРАЇНА, рік карбування 2023.", "desc_en": "The reverse of the medal features on a mirror background the inscriptions: the name of the international conference – ОБ’ЄДНАНІ ЗАРАДИ СПРАВЕДЛИВОСТІ / UNITED FOR JUSTICE (around the circle), the venue – ЛЬВІВ • LVIV, the hashtag – #U4J, the year of the event – 2023 (in the centre). The obverse of the medal features a stylised composition symbolising that justice for Ukraine means justice and security for the whole world: in the centre of the composition – a map of Ukraine on which a shield with the image of planet Earth is placed, on both sides of which – the scales of justice; at the top and bottom – the small State Coat of Arms of Ukraine and the inscription УКРАЇНА, the year of issue 2023."}, {"id": 47, "uid": "b9cbf0a98b", "name": "Орьнек. Кримськотатарський орнамент у сувенірному пакованні (н)", "cat": "Пам'ятні монети", "img": "images/img_47.jpg", "photos": [{"src": "images/img_47.jpg", "label": "Аверс"}, {"src": "images/img_47_b.jpg", "label": "Реверс"}, {"src": "images/img_47_c.jpg", "label": "Реверс"}, {"src": "images/img_47_d.jpg", "label": "Аверс"}], "url": "https://coins.bank.gov.ua/ornek-krimskotatarskij-ornament-u-suvenirnomu-pakovanni-n-/p-1095.html", "price": 165, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "рифлений", "yakist": "спеціальний анциркулейтед", "tyrazh": "50000", "rik": "2024", "seriya": "Українська спадщина", "nominal": "5", "hud": "Автор ескізу – Есма Аджієва. Адаптація дизайну – Олександра Кучинська", "skul": "Атаманчук Володимир, Дем'яненко Володимир", "note": "", "cat_nom": "5 грн", "cat_tir": 50000, "cat_year": 2024, "name_en": "\"Orynek. Crimean Tatar Ornament\" (nickel silver) in souvenir packaging", "desc_ua": "На реверсі монети на дзеркальному тлі рельєфно відтворено орнамент, який уособлює сімейні цінності. У центрі орнаменту розташовані взаємопов’язані елементи, які відображають глибокий символізм родинних зв’язків. Ця сім’я складається зі знаків чоловіка, жінки та їхнього спільного дому. По обидва боки центральної вертикалі розташовані символи дітей. Усі разом вони створюють повноцінний орнамент, що відображає сімейну єдність та гармонію. На аверсі монети у центрі композиції зображено постать кримськотатарської вишивальниці наґишчи, чарівної майстрині, яка схилилася над вишивальним верстатом кергеф (kergef). Її руки, віртуозно орудуючи голкою, вдихають життя в полотно, створюючи на ньому вишукані візерунки орьнека. Від наґишчи в різні боки розквітають паростки орнаменту, що символізує безперервність традиції, її невпинне продовження талановитими нащадками. Угорі розміщено написи УКРАЇНА (півколом), нижче ORNEK / ОРЬНЕК, малий Державний Герб України (по центру між написами), номінал 5 та графічний символ гривні, рік карбування – 2024 (праворуч від майстрині), а також логотип Банкнотно-монетного двору Національного банку України (унизу, праворуч від верстата).", "desc_en": "The reverse of the coin features on a mirror background a relief reproduction of an ornament embodying family values. In the centre of the ornament are interconnected elements reflecting the deep symbolism of family ties. This family consists of the signs of a man, a woman and their common home. On both sides of the central vertical are symbols of children. Together they create a complete ornament reflecting family unity and harmony. The obverse of the coin features in the centre of the composition the figure of a Crimean Tatar embroiderer – a naqishchi, an enchanting craftswoman who bent over the kergef embroidery frame. Her hands, virtuously wielding a needle, breathe life into the canvas, creating exquisite ornek patterns on it. From the naqishchi, ornament sprouts bloom in different directions, symbolising the continuity of tradition and its unceasing continuation by talented descendants. At the top are the inscriptions УКРАЇНА (in a semicircle), below ORNEK / ОРЬНЕК, the small State Coat of Arms of Ukraine (in the centre between the inscriptions), the denomination 5 and the hryvnia graphic symbol, the year of issue – 2024 (to the right of the craftswoman), as well as the logo of the National Bank of Ukraine Banknote Printing and Minting Works (at the bottom, to the right of the frame)."}, {"id": 48, "uid": "c870c69e79", "name": "Пам`ятна медаль «Місто героїв - Херсон»", "cat": "Пам'ятні медалі", "img": "images/img_48.jpg", "photos": [{"src": "images/img_48.jpg", "label": "Аверс"}, {"src": "images/img_48_b.jpg", "label": "Реверс"}], "url": "https://coins.bank.gov.ua/pam-atna-medal-misto-geroiv-herson-/p-837.html", "price": 75, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "гладкий", "yakist": "спеціальний анциркулейтед", "tyrazh": "65000", "rik": "2022", "seriya": "—", "nominal": "—", "hud": "Фандікова Наталія", "skul": "Демяненко Анатолій, Дем'яненко Володимир; програмне моделювання – Лук'янов Юрій", "note": "Пам'ятна медаль", "cat_nom": "—", "cat_tir": 65000, "cat_year": 2022, "name_en": "Commemorative medal \"City of Heroes – Kherson\"", "desc_ua": "На реверсі медалі на дзеркальному тлі напис – ХЕРСОН/МІСТО ГЕРОЇВ, що ділить поле медалі надвоє: у верхній частині дзеркальна композиція, що символізує громадський спротив російському окупанту та радісну зустріч українських воїнів після звільнення, у нижній – стилізована панорама міста з його історичними будівлями, Антонівським мостом, скульптурою з меморіалу парку Слави, пам’ятником першим корабелам тощо. На аверсі медалі розміщено: угорі написи – 2022/УКРАЇНА, унизу – малий Державний Герб України, у центрі композицію: на тлі стилізованої карти міста рядки з історичного роману Ліни Костенко “Берестечко”: НЕ ДОПУСКАЙ ТАКОЇ МИСЛІ,/ЩО БОГ ПОКАЖЕ НАМ НЕЛАСКУ./ЖИТТЯ ЛЮДСЬКОГО СТРОКИ СТИСЛІ./НЕМАЄ ЧАСУ НА ПОРАЗКУ./ЛІНА КОСТЕНКО; ліворуч – портові крани, праворуч – Станіслав-Аджигольський задній маяк – пам’ятку історичної та культурної спадщини, зображення дельфінів і чайок; логотип Банкнотно-монетного двору Національного банку України (ліворуч над кранами).", "desc_en": "The reverse of the medal features on a mirror background the inscription – ХЕРСОН/МІСТО ГЕРОЇВ, dividing the medal field in two: in the upper part a mirror composition symbolising public resistance to the Russian occupier and the joyful meeting of Ukrainian warriors after liberation; in the lower – a stylised panorama of the city with its historical buildings, the Antonivskyi Bridge, a sculpture from the Park of Glory memorial, a monument to the first shipbuilders, etc. The obverse of the medal features: at the top the inscriptions – 2022/УКРАЇНА, at the bottom – the small State Coat of Arms of Ukraine; in the centre a composition: against the background of a stylised city map, lines from Lina Kostenko's historical novel “Берестечко”: НЕ ДОПУСКАЙ ТАКОЇ МИСЛІ,/ЩО БОГ ПОКАЖЕ НАМ НЕЛАСКУ./ЖИТТЯ ЛЮДСЬКОГО СТРОКИ СТИСЛІ./НЕМАЄ ЧАСУ НА ПОРАЗКУ./ЛІНА КОСТЕНКО; to the left – port cranes, to the right – the Stanislav-Adzhigol rear lighthouse – a monument of historical and cultural heritage, images of dolphins and seagulls; the logo of the National Bank of Ukraine Banknote Printing and Minting Works (left, above the cranes)."}, {"id": 49, "uid": "1e59d8b816", "name": "Світло добра і любові (Олена Пчілка 1849 – 1930) (н)", "cat": "Пам'ятні монети", "img": "images/img_49.jpg", "photos": [{"src": "images/img_49.jpg", "label": "Аверс"}, {"src": "images/img_49_b.jpg", "label": "Реверс"}], "url": "https://coins.bank.gov.ua/svitlo-dobra-i-ljubovi-olena-pchilka-1849-1930-n-/p-1101.html", "price": 75, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "31,0", "gurt": "рифлений", "yakist": "спеціальний анциркулейтед", "tyrazh": "30000", "rik": "2024", "seriya": "Видатні особистості України", "nominal": "2", "hud": "Таран Володимир, Харук Олександр, Харук Сергій", "skul": "Атаманчук Володимир", "note": "", "cat_nom": "2 грн", "cat_tir": 30000, "cat_year": 2024, "name_en": "\"The Light of Goodness and Love (Olena Pchilka, 1849–1930)\" (nickel silver)", "desc_ua": "На реверсі монети на дзеркальному тлі зображено стилізований портрет Олени Пчілки. Образ жінки на тлі, абриси якого нагадують корону, вражає своїм глибоким, сповненим мудрості та рішучості поглядом. Здається, що він пронизує час, нагадуючи про вічне значення її творів. Ліворуч і праворуч від портрета розміщено написи ОЛЕНА ПЧІЛКА та ОЛЬГА КОСАЧ, а внизу півколом – “КОРОЛЕВА-МАТИ”, адже саме так з любов’ю називала свою матір Леся Українка. Роки життя поетеси 1849 / 1930 завершують композицію реверсу. На аверсі монети розміщено стилізовану композицію, що символізує педагогічну та виховну діяльність Олени Пчілки. У центрі композиції – шість квіткових горщиків, стилізованих під елементи гадяцького орнаменту. Це не просто деталь, а символ шістьох дітей письменниці, вихованих у дусі українських традицій. Їхнє розташування нагадує мерлони оборонного муру, підкреслюючи непохитну “фортецю української ідентичності”, яка століттями протистоїть ворожим впливам. Праворуч між стилізованими горщиками розміщено логотип Банкнотно-монетного двору Національного банку України, а в нижній частині монети викарбувано напис УКРАЇНА, номінал 2 з графічним символом гривні, малий Державний Герб України та рік карбування – 20 / 24.", "desc_en": "The reverse of the coin features on a mirror background a stylised portrait of Olena Pchilka. The image of a woman against a background whose outlines resemble a crown impresses with its deep, wise and resolute gaze. It seems to pierce time, reminding of the eternal significance of her works. To the left and right of the portrait are the inscriptions ОЛЕНА ПЧІЛКА and ОЛЬГА КОСАЧ, and at the bottom in a semicircle – “КОРОЛЕВА-МАТИ”, for that is how Lesya Ukrainka lovingly called her mother. The poet's years of life 1849 / 1930 complete the reverse composition. The obverse of the coin features a stylised composition symbolising Olena Pchilka's pedagogical and educational activities. In the centre of the composition – six flower pots stylised as elements of the Hadyach ornament. This is not just a detail, but a symbol of the writer's six children, raised in the spirit of Ukrainian traditions. Their arrangement resembles the merlons of a defensive wall, emphasising the unshakable “fortress of Ukrainian identity” that has resisted hostile influences for centuries. To the right between the stylised pots is the logo of the National Bank of Ukraine Banknote Printing and Minting Works, and in the lower part of the coin are engraved the inscription УКРАЇНА, the denomination 2 with the hryvnia graphic symbol, the small State Coat of Arms of Ukraine and the year of issue – 20 / 24."}, {"id": 50, "uid": "fc40ac7ed2", "name": "Крапля життя (н)", "cat": "Пам'ятні монети", "img": "images/img_50.jpg", "photos": [{"src": "images/img_50.jpg", "label": "Аверс"}, {"src": "images/img_50_b.jpg", "label": "Реверс"}], "url": "https://coins.bank.gov.ua/kraplja-zhittja-n-/p-1096.html", "price": 165, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "рифлений", "yakist": "спеціальний анциркулейтед", "tyrazh": "50000", "rik": "2024", "seriya": "Інші монети", "nominal": "5", "hud": "Куц Марина", "skul": "—", "note": "", "cat_nom": "5 грн", "cat_tir": 50000, "cat_year": 2024, "name_en": "\"A Drop of Life\" (nickel silver)", "desc_ua": "На реверсі монети на дзеркальному тлі праворуч розташований напис ЖИТТЯ, який стилізовано під систему для переливання крові з голкою. Цей елемент символізує процес забезпечення кров’ю судин, що зображені внизу ліворуч. Стилізована крапля та напис “життя” гармонійно поєднуються в назву монети – “Крапля життя”. Фактура матового тла, на якому розміщені всі ці елементи, символізує велику потребу в донорстві в умовах війни. На аверсі монети в центрі композиції зображено об’ємну краплю крові, яку оточують схематичні фігури людей, з’єднаних рукостисканнями. Цей образ є свідченням благородної спільної мети – рятувати життя. Від кожної фігури до центру кола рухаються стилізовані краплі крові, які символізують особистий внесок у донорство кожного небайдужого. Угорі по центру розміщено малий Державний Герб України; написи УКРАЇНА (унизу під композицією), номінал 5 та графічний символ гривні (унизу праворуч), рік карбування – 20/24 (унизу ліворуч від фігур), а також логотип Банкнотно-монетного двору Національного банку України (праворуч між фігурами).", "desc_en": "The reverse of the coin features on a mirror background, to the right, the inscription ЖИТТЯ stylised as a blood transfusion system with a needle. This element symbolises the process of supplying blood to the vessels depicted at the bottom left. The stylised drop and the inscription “життя” harmoniously combine into the coin's name – “Крапля життя”. The matte background texture on which all these elements are placed symbolises the great need for donation in wartime. The obverse of the coin features in the centre of the composition a voluminous drop of blood surrounded by schematic figures of people joined by handshakes. This image is a testament to the noble common goal – saving lives. From each figure to the centre of the circle move stylised drops of blood, symbolising the personal contribution to donation of everyone who cares. At the top in the centre is the small State Coat of Arms of Ukraine; the inscriptions УКРАЇНА (at the bottom under the composition), the denomination 5 and the hryvnia graphic symbol (at the bottom right), the year of issue – 20/24 (at the bottom left of the figures), as well as the logo of the National Bank of Ukraine Banknote Printing and Minting Works (to the right between the figures)."}, {"id": 51, "uid": "0fcd409db4", "name": "День Європи (н)", "cat": "Пам'ятні монети", "img": "images/img_51.jpg", "photos": [{"src": "images/img_51.jpg", "label": "Аверс"}, {"src": "images/img_51_b.jpg", "label": "Фото 2"}], "url": "https://coins.bank.gov.ua/den-ievropi-n-/p-1093.html", "price": 121, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "рифлений", "yakist": "спеціальний анциркулейтед", "tyrazh": "50000", "rik": "2024", "seriya": "Інші монети", "nominal": "5", "hud": "Фандікова Наталія", "skul": "Демяненко Анатолій", "note": "", "cat_nom": "5 грн", "cat_tir": 50000, "cat_year": 2024, "name_en": "\"Europe Day\" (nickel silver)", "desc_ua": "На реверсі монети на дзеркальному тлі розміщено абревіатури EU та UA, які, переплітаючись, створюють візуальний символ єдності України та Європи. Дві літери “U” є ніби одним цілим, формуючи образ нового життя, що проростає під егідою Європейського Союзу. Навколо написів ДЕНЬ / ЄВРОПИ / EUROPE / DAY зображено дванадцять зірок, як і на прапорі ЄС, що символізують єдність, цілісність і гармонію народів Європи. На аверсі монети по центру розміщено стилізований тризуб, символ України. Ліворуч від тризуба зображено офіційне гасло Європейського Союзу ЄДНІСТЬ У РІЗНОМАНІТТІ (угорі півколом) та напис УКРАЇНА (поруч із тризубом, вертикально). Унизу монети зазначено номінал 5 з графічним символом гривні, рік карбування – 2024 (вертикально) та малий Державний Герб України. Праворуч від тризуба зображено квітковий орнамент, який символізує процвітання та самобутню культуру держави, а також логотип Банкнотно-монетного двору Національного банку України.", "desc_en": "The reverse of the coin features on a mirror background the abbreviations EU and UA which, intertwining, create a visual symbol of the unity of Ukraine and Europe. The two letters “U” are as if one whole, forming the image of new life sprouting under the aegis of the European Union. Around the inscriptions ДЕНЬ / ЄВРОПИ / EUROPE / DAY are twelve stars, as on the EU flag, symbolising the unity, integrity and harmony of the peoples of Europe. The obverse of the coin features in the centre a stylised tryzub, the symbol of Ukraine. To the left of the tryzub is the official motto of the European Union ЄДНІСТЬ У РІЗНОМАНІТТІ (at the top in a semicircle) and the inscription УКРАЇНА (next to the tryzub, vertically). At the bottom of the coin are the denomination 5 with the hryvnia graphic symbol, the year of issue – 2024 (vertically) and the small State Coat of Arms of Ukraine. To the right of the tryzub is a floral ornament symbolising the prosperity and distinctive culture of the state, as well as the logo of the National Bank of Ukraine Banknote Printing and Minting Works."}, {"id": 52, "uid": "d676bc9fe2", "name": "Чорнобиль. Відродження. Лелека чорний у сувенірному пакованні (н)", "cat": "Пам'ятні монети", "img": "images/img_52.jpg", "photos": [{"src": "images/img_52.jpg", "label": "Аверс"}, {"src": "images/img_52_b.jpg", "label": "Фото 2"}, {"src": "images/img_52_c.jpg", "label": "Реверс"}, {"src": "images/img_52_d.jpg", "label": "Реверс"}], "url": "https://coins.bank.gov.ua/chornobil-vidrodzhennja-leleka-chornij-u-suvenirnomu-pakovanni-n-/p-1091.html", "price": 208, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "рифлений", "yakist": "спеціальний анциркулейтед", "tyrazh": "20000", "rik": "2024", "seriya": "Флора і фауна", "nominal": "5", "hud": "Фандікова Наталія", "skul": "Демяненко Анатолій, Дем'яненко Володимир", "note": "", "cat_nom": "5 грн", "cat_tir": 20000, "cat_year": 2024, "name_en": "\"Chornobyl. Revival. Black Stork\" (nickel silver) in souvenir packaging", "desc_ua": "На реверсі монети на тлі пейзажу зображено лелеку чорного (використано тамподрук), над яким ліворуч на дзеркальному тлі написи: ЛЕЛЕКА / ЧОРНИЙ / CICONIA NIGRA; угорі – пташенята в гнізді. На аверсі монети розміщено: малий Державний Герб України (угорі), написи: УКРАЇНА (під гербом), номінал монети – 5 / ГРИВЕНЬ (праворуч від герба); у центрі – символічне колесо життя, що знаменує відродження природи: стилізований міжнародний знак “Радіаційна загроза”, оповитий листям, навколо якого тварини, популяції яких розвиваються у 30-кілометровій зоні відчуження, що стала своєрідним резерватом для розмноження, зокрема лелеки чорного, коня Пржевальського, рисі, зубра, лося, ведмедя бурого; по колу, на дзеркальному тлі написи: ЧОРНОБИЛЬСЬКИЙ РАДІАЦІЙНО-ЕКОЛОГІЧНИЙ БІОСФЕРНИЙ ЗАПОВІДНИК (ліворуч), CHORNOBYL RADIATION AND ECOLOGICAL BIOSPHERE RESERVE; логотип Банкнотно-монетного двору Національного банку України (угорі); рік карбування – 2024 (унизу).", "desc_en": "The reverse of the coin depicts a black stork against a landscape background (pad printing), above which, to the left on a mirror background, are the inscriptions: ЛЕЛЕКА / ЧОРНИЙ / CICONIA NIGRA; at the top – chicks in a nest. The obverse of the coin features: the small State Coat of Arms of Ukraine (at the top), the inscriptions: УКРАЇНА (under the coat of arms), the coin denomination – 5 / ГРИВЕНЬ (to the right of the coat of arms); in the centre – a symbolic wheel of life signifying the revival of nature: a stylised international “Radiation Hazard” sign entwined with leaves, surrounded by animals whose populations are thriving in the 30-kilometre exclusion zone, which has become a unique reserve for reproduction, in particular of the black stork, Przewalski's horse, lynx, bison, elk and brown bear; around the circle, on a mirror background, the inscriptions: ЧОРНОБИЛЬСЬКИЙ РАДІАЦІЙНО-ЕКОЛОГІЧНИЙ БІОСФЕРНИЙ ЗАПОВІДНИК (left), CHORNOBYL RADIATION AND ECOLOGICAL BIOSPHERE RESERVE; the logo of the National Bank of Ukraine Banknote Printing and Minting Works (at the top); the year of issue – 2024 (at the bottom)."}, {"id": 53, "uid": "909b9ce998", "name": "Українська бавовна. Нептун (н)", "cat": "Пам'ятні монети", "img": "images/img_53.jpg", "photos": [{"src": "images/img_53.jpg", "label": "Аверс"}, {"src": "images/img_53_b.jpg", "label": "Реверс"}], "url": "https://coins.bank.gov.ua/ukrajinska-bavovna-neptun/p-1089.html", "price": 154, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "рифлений", "yakist": "спеціальний анциркулейтед", "tyrazh": "50000", "rik": "2024", "seriya": "Збройні Сили України", "nominal": "5", "hud": "Таран Володимир, Харук Олександр, Харук Сергій", "skul": "Демяненко Анатолій, Дем'яненко Володимир", "note": "", "cat_nom": "5 грн", "cat_tir": 50000, "cat_year": 2024, "name_en": "\"Ukrainian Cotton. 'Neptune'\" (nickel silver)", "desc_ua": "На реверсі монети зображено береговий мобільний ракетний комплекс “Нептун” у момент пуску ракети, прийнятий на озброєння Військово-морських Сил ЗСУ, про що свідчить емблема вгорі ліворуч. Дзеркальне тло відображає стилізований тризуб Нептуна, бога морів, що символізує незламність українського духу, який влучно пронизує ворожі цілі. Праворуч угорі паралельно ракеті розміщено напис NEPTUNE. На аверсі монети стилізовано зображено ракетний крейсер “москва” з пробоїною в корпусі, потоплений завдяки майстерності наших військових протикорабельними ракетами Р-360 “Нептун”. “Невразливий” флагман Чорноморського флоту рф стилізовано під дитячий паперовий кораблик, що особливо підкреслює цей міф, незважаючи на його реальні габарити та озброєння. На рубці корабля зображено абрис кремлівської башти із зубцями кремлівського муру, що розламався, символізуючи крах імперських амбіцій росії. Угорі ліворуч на дзеркальному тлі – номінал монети 5 та графічний знак гривні, рік карбування монети 2024 (вертикально), малий Державний Герб України і напис УКРАЇНА (вертикально); унизу ліворуч – логотип Банкнотно-монетного двору Національного банку України.", "desc_en": "The reverse of the coin depicts the “Нептун” coastal mobile missile system at the moment of missile launch, adopted by the Naval Forces of the Armed Forces of Ukraine, as evidenced by the emblem at the top left. The mirror background reflects the stylised trident of Neptune, the god of the seas, symbolising the indomitable Ukrainian spirit that accurately pierces enemy targets. To the right at the top, parallel to the missile, is the inscription NEPTUNE. The obverse of the coin stylistically depicts the missile cruiser “moskva” with a hole in its hull, sunk thanks to the skill of our military with R-360 “Нептун” anti-ship missiles. The “invulnerable” flagship of the Russian Black Sea Fleet is stylised as a children's paper boat, which particularly emphasises this myth, despite its real dimensions and armament. On the ship's deck is the outline of a Kremlin tower with the battlements of the Kremlin wall, broken apart, symbolising the collapse of Russia's imperial ambitions. At the top left on a mirror background – the coin denomination 5 and the hryvnia graphic sign, the year of issue 2024 (vertically), the small State Coat of Arms of Ukraine and the inscription УКРАЇНА (vertically); at the bottom left – the logo of the National Bank of Ukraine Banknote Printing and Minting Works."}, {"id": 54, "uid": "c7e6ae30d9", "name": "Пам`ятна банкнота «Єдність рятує світ» у сувенірному пакованні", "cat": "Банкноти", "img": "images/img_54.jpg", "photos": [{"src": "images/img_54.jpg", "label": "Аверс"}, {"src": "images/img_54_b.jpg", "label": "Реверс"}, {"src": "images/img_54_c.jpg", "label": "Реверс"}, {"src": "images/img_54_d.jpg", "label": "Аверс"}], "url": "https://coins.bank.gov.ua/pam-jatna-banknota-iednist-rjatuie-svit-u-suvenirnomu-pakovanni/p-1086.html", "price": 245, "qty": 2, "metal": "інша нумізматична продукція", "metal_short": "інша нумізматична продукція", "masa": "—", "diametr": "—", "gurt": "—", "yakist": "—", "tyrazh": "299952", "rik": "2024", "seriya": "—", "nominal": "50", "hud": "Таран Володимир, Харук Олександр, Харук Сергій", "skul": "—", "note": "Пам'ятна банкнота", "cat_nom": "50 грн", "cat_tir": 299952, "cat_year": 2024, "name_en": "Commemorative banknote \"Unity Saves the World\" in souvenir packaging", "desc_ua": "Пам’ятна банкнота “Єдність рятує світ”, присвячена незламності українського народу в боротьбі за свободу та європейські цінності, консолідації українського суспільства для захисту територіальної цілісності, а також єднанню демократичного світу перед обличчям російської агресії.\nПам’ятна банкнота номіналом 50 гривень 2024 року випуску з підписом Голови Національного банку України Андрія Пишного серії ЄС з номерами 0000001–0300000; містить елементи захисту чинного номінального ряду банкнот та додаткові оптично-змінні елементи захисту; тираж – 300 000 шт. [із яких: 299 952 шт. – у сувенірному пакованні, два нерозрізані аркуші (на одному аркуші 24 банкноти)].\n\nНа лицьовому боці пам’ятної банкноти в центральній частині розміщено художньо-образну композицію, яка відображає стилізований абрис України, що асоціюється із серцем, до якого підходять судини. Фонове зображення – образ дівчини у військовому шоломі, яка дивиться в бік Заходу. \nУ нижній частині пам’ятної банкноти, на тлі Земної кулі, розміщено стилізоване зображення Європи, від країн якої ніби відходять судини-маршрути допомоги та підтримки України. Розміщені між судинами-маршрутами стилізовані серця символізують жертовність і співчуття. \nУ верхній частині пам’ятної банкноти в центрі розміщено водяний знак. Праворуч від поля водяного знака розміщено наскрізний елемент – стилізований шеврон Збройних Сил України та спеціальний рельєфний елемент у вигляді кола для людей із послабленим зором. Ліворуч від поля водяного знака розміщено напис УКРАЇНА та зображення малого Державного Герба України. Під полем водяного знака з обох боків розміщено стилізовану композицію із заповнених та контурних квадратів (центральні квадрати – із позначенням номіналу пам’ятної банкноти), напівпрозорої смуги, що наповнена абрисами логотипа Національного банку України. \nПід смугою по центру пам’ятної банкноти розміщено напис ЄДНІСТЬ РЯТУЄ СВІТ та два текстових блоки (ліворуч і праворуч) українською та англійською мовами: ЄДНІСТЬ / І СОЛІДАРНІСТЬ / З УКРАЇНСЬКИМ НАРОДОМ / НАБЛИЖАЮТЬ / ПЕРЕМОГУ УКРАЇНИ / В БОРОТЬБІ ПРОТИ / РОСІЙСЬКОГО АГРЕСОРА / ТА РЯТУЮТЬ СВІТ ВІД ХАОСУ / ТА МОРОКУ НАСИЛЛЯ.; UNITY AND SOLIDARITY / WITH THE UKRAINIAN PEOPLE / ARE BRINGING CLOSER / UKRAINE’S VICTORY / IN THE FIGHT AGAINST / THE RUSSIAN AGGRESSOR, / AND ARE SAVING THE WORLD / FROM THE CHAOS / AND DARKNESS / OF VIOLENCE.; вертикальний напис НАЦІОНАЛЬНИЙ БАНК УКРАЇНИ, підпис Голови Національного банку України та слово ГОЛОВА – у лівій нижній частині; напис П’ЯТДЕСЯТ ГРИВЕНЬ – у центральній нижній частині. Цифрове позначення номіналу розміщено горизонтально в нижній правій частині пам’ятної банкноти.\nДизайн лицьового боку банкноти доповнюють інші елементи, виконані багатоколірним друком.\n\nОсновне зображення зворотного боку пам’ятної банкноти – символічна композиція зі стиснутих рук, що символізує співпрацю, взаємодопомогу, довіру та партнерство на тлі стилізованого тризуба – символу української держави. \nУ верхній частині пам’ятної банкноти розміщено стилізоване зображення цифрового позначення номіналу, утворене захисною сіткою. Напис П’ЯТДЕСЯТ / ГРИВЕНЬ розташовано вертикально у верхній правій частині банкноти та горизонтально в центральній нижній частині. Цифрове позначення номіналу 50 розміщено горизонтально у верхній правій частині банкноти та вертикально (разом з графічним позначенням гривні) у лівій нижній частині пам’ятної банкноти. \nУ верхній частині по центру пам’ятної банкноти розташовано напис ЄДНІСТЬ – СИЛА! У нижній частині пам’ятної банкноти розміщено рік її випуску 2024. \nСерійний номер надруковано двічі. Горизонтальний за напрямком читання номер (зі змінною висотою цифр) нанесений уздовж верхнього краю пам’ятної банкноти фарбою червоного кольору, вертикальний – уздовж лівого краю пам’ятної банкноти фарбою чорного кольору.\nДизайн зворотного боку банкноти доповнюють інші елементи, виконані багатоколірним друком.", "desc_en": "The commemorative banknote “Unity Saves the World”, dedicated to the resilience of the Ukrainian people in the fight for freedom and European values, the consolidation of Ukrainian society to protect territorial integrity, and the unification of the democratic world in the face of Russian aggression.\nThe commemorative banknote has a denomination of 50 hryvnias, 2024 issue, with the signature of the Governor of the National Bank of Ukraine Andrii Pyshnyi, ЄС series with numbers 0000001–0300000; it contains the security features of the current nominal series of banknotes and additional optically variable security features; circulation – 300,000 pcs. [of which: 299,952 pcs. – in souvenir packaging, two uncut sheets (one sheet contains 24 banknotes)].\n\nThe face side of the commemorative banknote in the central part features an artistic composition depicting a stylized outline of Ukraine, which is associated with a heart, to which blood vessels lead. The background image is a girl in a military helmet looking toward the West.\nIn the lower part of the commemorative banknote, against the background of the globe, is a stylized image of Europe, from whose countries vessels – routes of aid and support for Ukraine – seem to emanate. The stylized hearts placed between the vessel-routes symbolize sacrifice and compassion.\nIn the upper part of the commemorative banknote in the centre is the watermark. To the right of the watermark area is the see-through element – a stylized chevron of the Armed Forces of Ukraine and a special relief element in the form of a circle for people with impaired vision. To the left of the watermark area are the inscription УКРАЇНА and the image of the small State Coat of Arms of Ukraine. Under the watermark area on both sides is a stylized composition of filled and outlined squares (the central squares – with the denomination designation of the commemorative banknote), a translucent stripe filled with outlines of the National Bank of Ukraine logo.\nUnder the stripe in the centre of the commemorative banknote are the inscription ЄДНІСТЬ РЯТУЄ СВІТ and two text blocks (on the left and right) in Ukrainian and English: ЄДНІСТЬ / І СОЛІДАРНІСТЬ / З УКРАЇНСЬКИМ НАРОДОМ / НАБЛИЖАЮТЬ / ПЕРЕМОГУ УКРАЇНИ / В БОРОТЬБІ ПРОТИ / РОСІЙСЬКОГО АГРЕСОРА / ТА РЯТУЮТЬ СВІТ ВІД ХАОСУ / ТА МОРОКУ НАСИЛЛЯ.; UNITY AND SOLIDARITY / WITH THE UKRAINIAN PEOPLE / ARE BRINGING CLOSER / UKRAINE’S VICTORY / IN THE FIGHT AGAINST / THE RUSSIAN AGGRESSOR, / AND ARE SAVING THE WORLD / FROM THE CHAOS / AND DARKNESS / OF VIOLENCE.; the vertical inscription НАЦІОНАЛЬНИЙ БАНК УКРАЇНИ, the signature of the Governor of the National Bank of Ukraine, and the word ГОЛОВА – in the lower left part; the inscription П’ЯТДЕСЯТ ГРИВЕНЬ – in the central lower part. The digital denomination designation is placed horizontally in the lower right part of the commemorative banknote.\nThe design of the face side of the banknote is complemented by other elements executed in multicolour printing.\n\nThe main image of the back side of the commemorative banknote is a symbolic composition of clasped hands, symbolizing cooperation, mutual assistance, trust, and partnership against the background of a stylized trident – the symbol of the Ukrainian state.\nIn the upper part of the commemorative banknote is a stylized image of the digital denomination designation formed by a security grid. The inscription П’ЯТДЕСЯТ / ГРИВЕНЬ is placed vertically in the upper right part of the banknote and horizontally in the central lower part. The digital denomination designation 50 is placed horizontally in the upper right part of the banknote and vertically (together with the graphic designation of the hryvnia) in the lower left part of the commemorative banknote.\nIn the upper part, in the centre of the commemorative banknote, is the inscription ЄДНІСТЬ – СИЛА! In the lower part of the commemorative banknote is the year of its issue 2024.\nThe serial number is printed twice. The horizontal reading-direction number (with variable digit height) is applied along the upper edge of the commemorative banknote in red ink, the vertical one – along the left edge of the commemorative banknote in black ink.\nThe design of the back side of the banknote is complemented by other elements executed in multicolour printing."}, {"id": 55, "uid": "c1b69bdca1", "name": "Батьківське щастя у сувенірному пакованні (н)", "cat": "Пам'ятні монети", "img": "images/img_55.jpg", "photos": [{"src": "images/img_55.jpg", "label": "Аверс"}, {"src": "images/img_55_b.jpg", "label": "Аверс"}, {"src": "images/img_55_c.jpg", "label": "Реверс"}, {"src": "images/img_55_d.jpg", "label": "Реверс"}], "url": "https://coins.bank.gov.ua/batkivske-schastja-u-suvenirnomu-pakovanni-n-/p-1087.html", "price": 210, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "рифлений", "yakist": "спеціальний анциркулейтед", "tyrazh": "100000", "rik": "2024", "seriya": "Інші монети", "nominal": "5", "hud": "Яровий Владислав", "skul": "Атаманчук Володимир", "note": "", "cat_nom": "5 грн", "cat_tir": 100000, "cat_year": 2024, "name_en": "\"Parental Happiness\" (nickel silver) in souvenir packaging", "desc_ua": "Пам’ятна монета “Батьківське щастя” присвячена найдорожчому в житті – щастю бути батьками, трепету перших обіймів та безумовній любові до малюка.\n\nНа аверсі монети на дзеркальному тлі розміщено композицію: батьківські руки, які ласкаво тримають ніжки немовляти, що символізує довіру, відчуття захисту та любов, яка єднає сім’ю (по центру); напис УКРАЇНА (угорі по центру), під яким малий Державний Герб України, номінал 5 та графічний символ гривні, логотип Банкнотно-монетного двору Національного банку України (ліворуч від рук) та внизу по центру – рік карбування монети 2024 (нуль зображено у формі серця).\n\nНа реверсі монети на дзеркальному тлі зображено дитя, яке мирно спить на м’яких хмаринках серед іграшок (елемент оздоблення – тамподрук). Брязкальце, що сяє на тлі нічного неба, немов місяць, дарує відчуття спокою та затишку. Воно освітлює шлях дитини у світ мрій та фантазій, даруючи безтурботні сни.", "desc_en": "The commemorative coin “Parental Happiness” is dedicated to the most precious thing in life – the happiness of being parents, the trembling of first embraces, and unconditional love for the baby.\n\nThe obverse of the coin on a mirror background features a composition: parental hands gently holding the feet of a newborn, symbolizing trust, a sense of protection, and love that unites the family (in the centre); the inscription УКРАЇНА (at the top in the centre), under which the small State Coat of Arms of Ukraine, the denomination 5 and the graphic symbol of the hryvnia, the logo of the National Bank of Ukraine Banknote Printing and Minting Works (to the left of the hands), and at the bottom in the centre – the year of issue of the coin 2024 (the zero is depicted in the shape of a heart).\n\nThe reverse of the coin on a mirror background depicts a child peacefully sleeping on soft clouds among toys (decoration element – pad printing). A rattle, shining against the night sky like the moon, gives a sense of calm and comfort. It lights the child's path into a world of dreams and fantasies, giving carefree sleep."}, {"id": 56, "uid": "c0fe3e7e0f", "name": "Кохання у сувенірному пакованні (н)", "cat": "Пам'ятні монети", "img": "images/img_56.jpg", "photos": [{"src": "images/img_56.jpg", "label": "Аверс"}, {"src": "images/img_56_b.jpg", "label": "Реверс"}, {"src": "images/img_56_c.jpg", "label": "Паковання"}, {"src": "images/img_56_d.jpg", "label": "Фото 4"}], "url": "https://coins.bank.gov.ua/kohannja-u-suvenirnomu-pakovanni-n-/p-1082.html", "price": 159, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "рифлений", "yakist": "спеціальний анциркулейтед", "tyrazh": "50000", "rik": "2024", "seriya": "Інші монети", "nominal": "5", "hud": "Таран Володимир, Харук Олександр, Харук Сергій", "skul": "—", "note": "", "cat_nom": "5 грн", "cat_tir": 50000, "cat_year": 2024, "name_en": "\"Love\" (nickel silver) in souvenir packaging", "desc_ua": "Пам’ятна монета “Кохання”, присвячена таємничій симфонії емоцій, яка розквітає в серцях людей. Дивовижному почуттю, яке протягом століть надихало поетів, художників, музикантів та мрійників.\n\nНа аверсі монети на дзеркальному тлі розміщено: стилізовану у вигляді серця троянду, у графічне полотно якої вписано слово “кохання” найпоширенішими мовами світу, що підкреслює універсальність та безмежність цього почуття, яке не знає кордонів та мовних бар’єрів; малий Державний Герб України, напис УКРАЇНА (крапки над літерою “ї” зображено у формі серця), номінал 5 та графічний символ гривні (угорі над трояндою); логотип Банкнотно-монетного двору Національного банку України (над стеблом троянди), напис 20 / 24 (унизу).\n\nНа реверсі монети на дзеркальному тлі рельєфно зображено серце, від якого рівномірно розходяться хвилі. Стилізована композиція є символом щирого та всеосяжного кохання, вібрації якого сягають найпотаємніших глибин душі.", "desc_en": "The commemorative coin \"Кохання\" is dedicated to the mysterious symphony of emotions that blossoms in people's hearts. A wondrous feeling that has inspired poets, artists, musicians and dreamers for centuries.\n\nThe obverse of the coin, on a mirror background, features: a rose stylized as a heart, into whose graphic canvas the word \"love\" is inscribed in the world's most widely spoken languages, underscoring the universality and boundlessness of this feeling, which knows no borders or language barriers; the small State Coat of Arms of Ukraine, the inscription УКРАЇНА (the dots above the letter \"ї\" are shaped as hearts), the denomination 5 and the hryvnia graphic symbol (above the rose); the logo of the National Bank of Ukraine Banknote Printing and Minting Works (above the rose's stem), the inscription 20 / 24 (below).\n\nThe reverse of the coin, on a mirror background, relief-depicts a heart from which waves radiate evenly. The stylized composition is a symbol of sincere and all-encompassing love, whose vibrations reach the most hidden depths of the soul."}, {"id": 57, "uid": "2aac90f9c9", "name": "Управління державної охорони України (н)", "cat": "Пам'ятні монети", "img": "images/img_57.jpg", "photos": [{"src": "images/img_57.jpg", "label": "Аверс"}, {"src": "images/img_57_b.jpg", "label": "Реверс"}], "url": "https://coins.bank.gov.ua/upravlinnja-derzhavnoji-ohoroni-ukrajini-n-/p-1080.html", "price": 121, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "рифлений", "yakist": "спеціальний анциркулейтед", "tyrazh": "40000", "rik": "2024", "seriya": "Інші монети", "nominal": "5", "hud": "Дизайн – Кучинська Олександра", "skul": "Дем'яненко Володимир, Демяненко Анатолій", "note": "", "cat_nom": "5 грн", "cat_tir": 40000, "cat_year": 2024, "name_en": "\"State Protection Department of Ukraine\" (nickel silver)", "desc_ua": "Пам’ятна монета присвячена державному правоохоронному органу спеціального призначення, що посідає особливе місце в системі забезпечення національної безпеки України.\n\nНа аверсі монети розміщено: на дзеркальному тлі емблему Управління державної охорони України (ліворуч), номінал 5 та графічний символ гривні (угорі над емблемою); малий Державний Герб України, написи: УКРАЇНА / 2024, логотип Банкнотно-монетного двору Національного банку України (унизу під емблемою); праворуч на матовому тлі девіз: ДЕРЖАВІ / НАРОДОВІ / ЗАКОНУ.\n\nНа реверсі монети на дзеркальному тлі розміщено стилізовану композицію, що символізує різні історичні періоди становлення України та захист держави українськими воїнами, хоробрість яких крізь покоління залишається незмінною. Ліворуч на композиції зображено стилізований тризуб; у центрі зображено булаву з шаблями, щитом, оздобленим козацьким хрестом, що є символами влади, бойового побратимства та захисту; праворуч – фрагмент об’єктива камери, що символізує сучасні технології в організації процесу охорони та безпеки.", "desc_en": "The commemorative coin is dedicated to the state law enforcement body of special purpose that occupies a special place in the system of ensuring the national security of Ukraine.\n\nThe obverse of the coin features: on a mirror background, the emblem of the State Protection Department of Ukraine (on the left), the denomination 5 and the graphic symbol of the hryvnia (above the emblem); the small State Coat of Arms of Ukraine, the inscriptions: УКРАЇНА / 2024, the logo of the National Bank of Ukraine Banknote Printing and Minting Works (below the emblem); on the right, on a matte background, the motto: ДЕРЖАВІ / НАРОДОВІ / ЗАКОНУ.\n\nThe reverse of the coin, on a mirror background, features a stylized composition symbolizing different historical periods of Ukraine’s formation and the defense of the state by Ukrainian warriors, whose bravery remains unchanged across generations. On the left of the composition is a stylized tryzub; in the center are a mace with sabers and a shield adorned with a Cossack cross, which are symbols of power, military brotherhood, and protection; on the right is a fragment of a camera lens, symbolizing modern technologies in organizing the protection and security process."}, {"id": 58, "uid": "60da376984", "name": "Країна супергероїв. Дякуємо залізничникам! (н)", "cat": "Пам'ятні монети", "img": "images/img_58.jpg", "photos": [{"src": "images/img_58.jpg", "label": "Аверс"}, {"src": "images/img_58_b.jpg", "label": "Реверс"}], "url": "https://coins.bank.gov.ua/krajina-supergerojiv-djakuiemo-zaliznichnikam-n-/p-1076.html", "price": 98, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "рифлений", "yakist": "спеціальний анциркулейтед", "tyrazh": "50000", "rik": "2023", "seriya": "Безсмертна моя Україно", "nominal": "5", "hud": "Таран Володимир, Харук Олександр, Харук Сергій", "skul": "—", "note": "", "cat_nom": "5 грн", "cat_tir": 50000, "cat_year": 2023, "name_en": "\"Country of Superheroes. Thank You, Railway Workers!\" (nickel silver)", "desc_ua": "Пам`ятна монета присвячена працівникам залізничного транспорту України, яких заслужено називають “залізними” людьми. Адже в складні для країни часи українські залізничники довели свою професійність та відданість Україні. З перших днів повномасштабного вторгнення залізниця стала “дорогою життя” для мільйонів українців, змушених евакуюватися до безпечніших регіонів, сталевим шляхом, що з’єднує Україну з європейськими країнами-партнерами, важливою логістичною артерією для перевезення стратегічно важливих для населення і держави вантажів.\n\nНа аверсі монети розміщено стилізований тризуб, контури якого окреслено зображенням залізничних колій. У центрі на дзеркальному тлі – логотип Банкнотно-монетного двору Національного банку України, рік карбування монети 20 / 23; угорі – малий Державний Герб України, номінал монети 5 та графічний знак гривні; напис УКРАЇНА (ліворуч).\n\nНа реверсі монети зображено потяг, стилізований логотипом Укрзалізниці, що виривається з оточення; обабіч потягу – символічна композиція, що містить гострі вістря, спрямовані на нього; угорі напис ДЯКУЄМО ЗАЛІЗНИЧНИКАМ! Мотив реверсу ілюструє реальні події початку повномасштабного вторгнення, коли на межі Херсонської та Запорізької областей українські залізничники, ризикуючи власним життям, рятували людей. Навздогін і напереріз потягу танки агресора намагалися зупинити евакуацію мирного населення.", "desc_en": "The commemorative coin is dedicated to the employees of Ukraine's railway transport, who are deservedly called “iron” people. After all, in difficult times for the country, Ukrainian railway workers proved their professionalism and dedication to Ukraine. From the first days of the full-scale invasion, the railway became a “road of life” for millions of Ukrainians forced to evacuate to safer regions, a steel path connecting Ukraine with European partner countries, an important logistics artery for transporting strategically important cargo for the population and the state.\n\nThe obverse of the coin bears a stylized trident, whose contours are outlined by the image of railway tracks. In the centre on a mirror background – the logo of the National Bank of Ukraine Banknote Printing and Minting Works, the year of issue of the coin 20 / 23; at the top – the small State Coat of Arms of Ukraine, the coin denomination 5 and the graphic sign of the hryvnia; the inscription УКРАЇНА (on the left).\n\nThe reverse of the coin depicts a train stylized as the Ukrzaliznytsia logo, breaking out of encirclement; on both sides of the train – a symbolic composition containing sharp spearheads directed at it; at the top the inscription ДЯКУЄМО ЗАЛІЗНИЧНИКАМ! The reverse motif illustrates the real events of the beginning of the full-scale invasion, when on the border of the Kherson and Zaporizhzhia regions Ukrainian railway workers, risking their own lives, saved people. In pursuit and to cut off the train, the aggressor's tanks tried to stop the evacuation of civilians."}, {"id": 59, "uid": "9aff3157cb", "name": "Країна супергероїв. Дякуємо волонтерам! (н)", "cat": "Пам'ятні монети", "img": "images/img_59.jpg", "photos": [{"src": "images/img_59.jpg", "label": "Аверс"}, {"src": "images/img_59_b.jpg", "label": "Фото 2"}], "url": "https://coins.bank.gov.ua/krajina-su
