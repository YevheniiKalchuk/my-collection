<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Моя нумізматична колекція</title>
<style>
:root{--bg:#121417;--card:#1c1f26;--card2:#23262e;--gold:#c9a227;--gold2:#e8c95a;--txt:#e8e6df;--mut:#9a958a;--line:#2e323b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
header{background:radial-gradient(1200px 300px at 50% -80px,#2a2413,#121417 70%);border-bottom:1px solid var(--line);padding:34px 20px 26px;text-align:center}
h1{font-family:Georgia,'Palatino Linotype',serif;color:var(--gold2);font-size:clamp(24px,4.5vw,40px);margin:0 0 8px;letter-spacing:.5px}
.sub{color:var(--mut);font-size:15px}
.stats{display:flex;gap:26px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.stat b{color:var(--gold2);font-size:20px;display:block}
.stat span{color:var(--mut);font-size:13px}
.toolbar{position:sticky;top:0;z-index:20;background:rgba(18,20,23,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:12px 16px}
.trow{max-width:1200px;margin:0 auto;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=search]{flex:1;min-width:180px;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px 14px;font-size:15px}
select{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px;font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:8px 15px;font-size:14px;cursor:pointer}
.chip.on{background:var(--gold);border-color:var(--gold);color:#191407;font-weight:600}
.count{max-width:1200px;margin:14px auto 0;padding:0 16px;color:var(--mut);font-size:14px}
.grid{max-width:1200px;margin:14px auto 60px;padding:0 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-3px);border-color:var(--gold)}
.ph{aspect-ratio:1/1;background:#0c0d10;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ph img{max-width:92%;max-height:92%;object-fit:contain;filter:drop-shadow(0 8px 14px rgba(0,0,0,.55))}
.info{padding:12px 14px 14px}
.name{font-size:14.5px;line-height:1.35;min-height:58px;font-weight:600}
.meta{color:var(--mut);font-size:13px;margin-top:6px}
.price{color:var(--gold2);font-weight:700;margin-top:8px;font-size:15px}
.price small{color:var(--mut);font-weight:400}
/* modal */
.mback{position:fixed;inset:0;background:rgba(5,6,8,.8);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.mback.open{display:flex}
.modal{background:var(--card2);border:1px solid var(--gold);border-radius:16px;max-width:860px;width:100%;max-height:92vh;overflow:auto;position:relative}
.mclose{position:absolute;top:10px;right:14px;font-size:28px;color:var(--mut);cursor:pointer;background:none;border:none}
.mbody{display:grid;grid-template-columns:1fr 1.2fr;gap:0}
.mphoto{background:#0c0d10;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;min-height:320px}
.mphoto img#mimg{max-width:100%;max-height:60vh;object-fit:contain;filter:drop-shadow(0 10px 20px rgba(0,0,0,.6))}
.thumbs{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;justify-content:center}
.thumbs img{width:56px;height:56px;object-fit:contain;background:#fff;border-radius:6px;cursor:pointer;border:2px solid transparent;padding:2px}
.thumbs img.on{border-color:var(--gold)}
.thwrap{position:relative;display:inline-block}
.mstar{position:absolute;right:2px;bottom:2px;background:rgba(0,0,0,.6);border:1px solid var(--line);color:#888;border-radius:6px;cursor:pointer;font-size:12px;padding:1px 5px;line-height:1.4}
.mstar.on{color:var(--gold2);border-color:var(--gold)}
.viewbtns{display:flex;gap:6px}
.vbtn{background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:16px;line-height:1}
.vbtn.on{color:var(--gold2);border-color:var(--gold)}
.gbtn{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:14px}
.gbtn:hover{border-color:var(--gold)}
.gpanel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;width:100%}
.grow{display:flex;gap:8px;margin-bottom:10px}
.grow input[type=text]{flex:1;min-width:140px;background:#121417;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 10px;font-size:14px}
.glist{display:flex;flex-wrap:wrap}
.gitem{display:flex;align-items:center;gap:8px;background:#121417;border:1px solid var(--line);border-radius:8px;padding:6px 6px 6px 12px;margin:4px;font-size:14px}
.gitem small{color:var(--mut)}
.gitem button{background:none;border:none;color:var(--mut);cursor:pointer;font-size:15px;padding:2px 6px}
.gitem button:hover{color:var(--gold2)}
#grid.list{display:block}
.listrow{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px;cursor:pointer}
.listrow:hover{border-color:var(--gold)}
.listrow img{width:64px;height:64px;object-fit:contain;background:#fff;border-radius:6px;flex:none}
.listrow .lname{font-weight:600}
.listrow .lmeta{color:var(--mut);font-size:13px;margin-top:3px}
.listrow .lprice{margin-left:auto;color:var(--gold2);white-space:nowrap;font-weight:600}
.mgroups{margin:12px 0}
.mgroups .gt{color:var(--mut);font-size:13px;margin-bottom:6px}
.mgroups label{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:5px 12px;margin:3px;cursor:pointer;font-size:13px}
.mgroups input{accent-color:var(--gold)}
.mseries{margin:12px 0}
.mseries .gt{color:var(--mut);font-size:13px;margin-bottom:6px}
.mseries select{background:#121417;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 10px;font-size:14px;max-width:100%}
.minfo{padding:24px}
.minfo h2{font-family:Georgia,serif;color:var(--gold2);font-size:21px;margin:0 0 4px;line-height:1.3}
.mcat{color:var(--mut);font-size:13.5px;margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
td.k{color:var(--mut);width:42%}
.nbu{display:inline-block;margin-top:16px;color:var(--gold2);border:1px solid var(--gold);border-radius:10px;padding:10px 18px;text-decoration:none;font-size:14px}
.nbu:hover{background:var(--gold);color:#191407}
.mprice{margin-top:14px;font-size:16px;color:var(--gold2);font-weight:700}
footer{text-align:center;color:var(--mut);font-size:13px;padding:26px 16px;border-top:1px solid var(--line)}
@media(max-width:680px){.mbody{grid-template-columns:1fr}.name{min-height:0}}
</style>
</head>

<header>
<h1>Моя нумізматична колекція</h1>
<div class="sub">Монети, медалі, банкноти та зливки моєї колекції</div>

<div class="trow" id="hpanelrow" style="margin-top:10px;display:none"><div class="gpanel" id="hpanel"></div></div>

</div></div></div></div>

<div class="meta">${metaLine(d)}</div>
<div class="price">${d.price>0?d.price+' ₴':'ціна —'} <small>× ${d.qty}</small></div></div></div>`).join('');

const mi=document.getElementById('mimg'),th=document.getElementById('mthumbs');

if(d.photos.length>1){th.style.display='flex';

else{th.style.display='none';th.innerHTML='';}

else{mg.style.display='none';mg.innerHTML='';}

function renderHPanel(){
const hs=store.hidden.map(u=>DATA.find(d=>d.uid===u)).filter(d=>d&&!store.deleted.includes(d.uid));
hpanel.innerHTML='<div class="gt" style="color:var(--mut);font-size:13px;margin-bottom:8px">Приховані позиції (не показуються у списку):</div><div class="glist">'
+hs.map(d=>`<div class="gitem"><span>${esc(d.name)}</span><button data-back="${d.uid}">Повернути</button></div>`).join('')+'</div>'
+(hs.length?'':'<div style="color:var(--mut)">Немає прихованих позицій</div>');
hpanel.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{store.hidden=store.hidden.filter(u=>u!==b.dataset.back);save();renderHPanel();render();});}
// --- Серії: перейменування ---
const sbtn=document.getElementById('sbtn'),spanel=document.getElementById('spanel'),spanelrow=document.getElementById('spanelrow');
sbtn.onclick=()=>{const open=spanelrow.style.display==='none';spanelrow.style.display=open?'':'none';if(open)renderSPanel();};
function renderSPanel(){
const ss=allSeries();
spanel.innerHTML='<div style="color:var(--mut);font-size:13px;margin-bottom:8px">Серії колекції (перейменування зберігається в цьому браузері):</div><div class="glist">'
+ss.map(s=>{const n=DATA.filter(d=>effSer(d)===s&&!store.hidden.includes(d.uid)&&!store.deleted.includes(d.uid)).length;
const custom=store.seriesNames[s];
return `<div class="gitem"><span>${esc(custom||s)}${custom?` <small>· ${esc(s)}</small>`:''} <small>· ${n}</small></span><button data-sren="${escA(s)}" title="Перейменувати">✎</button>${custom?`<button data-sreset="${escA(s)}" title="Скинути назву">↺</button>`:''}</div>`;}).join('')+'</div>';
spanel.querySelectorAll('[data-sren]').forEach(b=>b.onclick=()=>{const s=b.dataset.sren;const v=prompt('Нова назва серії',store.seriesNames[s]||s);if(v&&v.trim()&&v.trim()!==s){store.seriesNames[s]=v.trim();save();renderSerSelect();renderSPanel();render();}});
spanel.querySelectorAll('[data-sreset]').forEach(b=>b.onclick=()=>{delete store.seriesNames[b.dataset.sreset];save();renderSerSelect();renderSPanel();render();});}
// --- Експорт / імпорт налаштувань ---
document.getElementById('expbtn').onclick=()=>{const blob=new Blob([JSON.stringify(store)],{type:'application/json'});
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mycollection-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);};
document.getElementById('impfile').onchange=e=>{const f=e.target.files[0];if(!f)return;
const rd=new FileReader();rd.onload=()=>{try{const s=JSON.parse(rd.result);
if(s&&Array.isArray(s.groups)){store=Object.assign({groups:[],ig:{},view:'grid',main:{},hidden:[],deleted:[],seriesNames:{},coinSeries:{}},s);save();gfilter='';
vgrid.classList.toggle('on',store.view!=='list');vlist.classList.toggle('on',store.view==='list');
renderSerSelect();renderGChips();render();}else alert('Невірний файл бекапу');}catch(err){alert('Невірний файл бекапу');}};
rd.readAsText(f);e.target.value='';};
renderGChips();
vgrid.classList.toggle('on',store.view!=='list');vlist.classList.toggle('on',store.view==='list');
render();
</script>
</body></html>
