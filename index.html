<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Моя нумізматична колекція</title>
<style>
:root{--bg:#121417;--card:#1c1f26;--card2:#23262e;--gold:#c9a227;--gold2:#e8c95a;--txt:#e8e6df;--mut:#9a958a;--line:#2e323b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
header{background:radial-gradient(1200px 300px at 50% -80px,#2a2413,#121417 70%);border-bottom:1px solid var(--line);padding:34px 20px 26px;text-align:center}
h1{font-family:Georgia,'Palatino Linotype',serif;color:var(--gold2);font-size:clamp(24px,4.5vw,40px);margin:0 0 8px;letter-spacing:.5px}
.sub{color:var(--mut);font-size:15px}
.stats{display:flex;gap:26px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.stat b{color:var(--gold2);font-size:20px;display:block}
.stat span{color:var(--mut);font-size:13px}
.toolbar{position:sticky;top:0;z-index:20;background:rgba(18,20,23,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:12px 16px}
.trow{max-width:1200px;margin:0 auto;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=search]{flex:1;min-width:180px;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px 14px;font-size:15px}
select{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px;font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:8px 15px;font-size:14px;cursor:pointer}
.chip.on{background:var(--gold);border-color:var(--gold);color:#191407;font-weight:600}
.count{max-width:1200px;margin:14px auto 0;padding:0 16px;color:var(--mut);font-size:14px}
.grid{max-width:1200px;margin:14px auto 60px;padding:0 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-3px);border-color:var(--gold)}
.ph{aspect-ratio:1/1;background:#0c0d10;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ph img{max-width:92%;max-height:92%;object-fit:contain;filter:drop-shadow(0 8px 14px rgba(0,0,0,.55))}
.info{padding:12px 14px 14px}
.name{font-size:14.5px;line-height:1.35;min-height:58px;font-weight:600}
.meta{color:var(--mut);font-size:13px;margin-top:6px}
.price{color:var(--gold2);font-weight:700;margin-top:8px;font-size:15px}
.price small{color:var(--mut);font-weight:400}
/* modal */
.mback{position:fixed;inset:0;background:rgba(5,6,8,.8);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.mback.open{display:flex}
.modal{background:var(--card2);border:1px solid var(--gold);border-radius:16px;max-width:860px;width:100%;max-height:92vh;overflow:auto;position:relative}
.mclose{position:absolute;top:10px;right:14px;font-size:28px;color:var(--mut);cursor:pointer;background:none;border:none}
.mbody{display:grid;grid-template-columns:1fr 1.2fr;gap:0}
.mphoto{background:#0c0d10;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;min-height:320px}
.mphoto img#mimg{max-width:100%;max-height:60vh;object-fit:contain;filter:drop-shadow(0 10px 20px rgba(0,0,0,.6))}
.thumbs{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;justify-content:center}
.thumbs img{width:56px;height:56px;object-fit:contain;background:#fff;border-radius:6px;cursor:pointer;border:2px solid transparent;padding:2px}
.thumbs img.on{border-color:var(--gold)}
.thwrap{position:relative;display:inline-block}
.mstar{position:absolute;right:2px;bottom:2px;background:rgba(0,0,0,.6);border:1px solid var(--line);color:#888;border-radius:6px;cursor:pointer;font-size:12px;padding:1px 5px;line-height:1.4}
.mstar.on{color:var(--gold2);border-color:var(--gold)}
.ebtn{background:none;border:none;color:var(--mut);cursor:pointer;font-size:13px;padding:2px 4px;vertical-align:middle}
.ebtn:hover{color:var(--gold2)}
.viewbtns{display:flex;gap:6px}
.vbtn{background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:16px;line-height:1}
.vbtn.on{color:var(--gold2);border-color:var(--gold)}
.gbtn{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:14px}
.gbtn:hover{border-color:var(--gold)}
.gpanel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;width:100%}
.grow{display:flex;gap:8px;margin-bottom:10px}
.grow input[type=text]{flex:1;min-width:140px;background:#121417;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 10px;font-size:14px}
.glist{display:flex;flex-wrap:wrap}
.gitem{display:flex;align-items:center;gap:8px;background:#121417;border:1px solid var(--line);border-radius:8px;padding:6px 6px 6px 12px;margin:4px;font-size:14px}
.gitem small{color:var(--mut)}
.gitem button{background:none;border:none;color:var(--mut);cursor:pointer;font-size:15px;padding:2px 6px}
.gitem button:hover{color:var(--gold2)}
#grid.list{display:block}
.listrow{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px;cursor:pointer}
.listrow:hover{border-color:var(--gold)}
.listrow img{width:64px;height:64px;object-fit:contain;background:#fff;border-radius:6px;flex:none}
.listrow .lname{font-weight:600}
.listrow .lmeta{color:var(--mut);font-size:13px;margin-top:3px}
.listrow .lprice{margin-left:auto;color:var(--gold2);white-space:nowrap;font-weight:600}
.mgroups{margin:12px 0}
.mgroups .gt{color:var(--mut);font-size:13px;margin-bottom:6px}
.mgroups label{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:5px 12px;margin:3px;cursor:pointer;font-size:13px}
.mgroups input{accent-color:var(--gold)}
.mseries{margin:12px 0}
.mseries .gt{color:var(--mut);font-size:13px;margin-bottom:6px}
.mseries select{background:#121417;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 10px;font-size:14px;max-width:100%}
.minfo{padding:24px}
.minfo h2{font-family:Georgia,serif;color:var(--gold2);font-size:21px;margin:0 0 4px;line-height:1.3}
.mcat{color:var(--mut);font-size:13.5px;margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
td.k{color:var(--mut);width:42%}
.nbu{display:inline-block;margin-top:16px;color:var(--gold2);border:1px solid var(--gold);border-radius:10px;padding:10px 18px;text-decoration:none;font-size:14px}
.nbu:hover{background:var(--gold);color:#191407}
.mprice{margin-top:14px;font-size:16px;color:var(--gold2);font-weight:700}
.mdesc{margin:14px 0}
.mdesc .gt{color:var(--mut);font-size:13px;margin-bottom:6px}
.mdesc .dtx{font-size:14px;line-height:1.55;white-space:pre-line}
.langbtns{display:flex;gap:6px}
footer{text-align:center;color:var(--mut);font-size:13px;padding:26px 16px;border-top:1px solid var(--line)}
@media(max-width:680px){.mbody{grid-template-columns:1fr}.name{min-height:0}}
</style>
</head>
<body>

<script>
const DATA = [{"id": 0, "uid": "302fcbcb65", "name": "«Українські народні казки. \"Кирило Кожум`яка\"» (н) у сувенірному пакованні", "cat": "Пам'ятні монети", "img": "images/img_00.jpg", "photos": [{"src": "images/img_00.jpg", "label": "Аверс"}, {"src": "images/img_00_b.jpg", "label": "Аверс"}, {"src": "images/img_00_c.jpg", "label": "Реверс"}, {"src": "images/img_00_d.jpg", "label": "Реверс"}], "url": "https://coins.bank.gov.ua/-ukrajinski-narodni-kazki-kirilo-kozhum-jaka-n-u-suvenirnomu-pakovanni/p-1207.html", "price": 303, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "рифлений", "yakist": "спеціальний анциркулейтед", "tyrazh": "50000", "rik": "2026", "seriya": "Духовні скарби України", "nominal": "5", "hud": "Аліса Іванова", "skul": "Володимир Дем'яненко, Володимир Атаманчук", "note": "", "cat_nom": "5 грн", "cat_tir": 50000, "cat_year": 2026, "name_en": "\"Ukrainian Folk Tales. \\\"Kyrylo Kozhumyaka\\\"\" (nickel silver) in souvenir packaging", "desc_ua": "На реверсі монети зображено сцену бою Кирила Кожум'яки зі змієм, що втілює протистояння людської сили, волі та справедливості руйнівному злу. На аверсі монети зображено три сюжетні композиції, розділені між собою стилізованими конопляними мотузками. Кожен із цих фрагментів ілюструє ключові епізоди казки: ремесло Кирила Кожум'яки; звернення дітей по допомогу; поневолення князівни змієм. У верхній частині монети розміщено логотип Банкнотно-монетного двору Національного банку України, напис УКРАЇНА і малий Державний Герб України, унизу праворуч – рік карбування – 2026, номінал 5 з графічним знаком гривні, напис КИРИЛО / КОЖУМ'ЯКА.", "desc_en": "The reverse of the coin depicts the battle between Kyrylo Kozhumiaka and the serpent, embodying the confrontation of human strength, will and justice with destructive evil. The obverse features three story compositions separated by stylised hemp ropes. Each fragment illustrates key episodes of the fairy tale: Kyrylo Kozhumiaka's craft; the children appealing for help; the serpent enslaving the princess. At the top of the coin are the logo of the National Bank of Ukraine Banknote Printing and Minting Works, the inscription УКРАЇНА and the small State Coat of Arms of Ukraine; at the bottom right – the year of issue – 2026, the denomination 5 with the hryvnia graphic symbol, and the inscription КИРИЛО / КОЖУМ'ЯКА."}, {"id": 1, "uid": "9501ab0727", "name": "Ролик обігових пам'ятних монет «Ми сильні. Ми разом. Сумська область» (у ролику 25 монет)", "cat": "Ролики обігових монет", "img": "images/img_01.jpg", "photos": [{"src": "images/img_01.jpg", "label": "Аверс"}, {"src": "images/img_01_b.jpg", "label": "Аверс"}, {"src": "images/img_01_c.jpg", "label": "Реверс"}, {"src": "images/img_01_d.jpg", "label": "Реверс"}], "url": "https://coins.bank.gov.ua/rolik-obigovih-pam-jatnih-monet-mi-silni-mi-razom-sumska-oblast-u-roliku-25-monet-/p-1200.html", "price": 459, "qty": 1, "metal": "—", "metal_short": "—", "masa": "—", "diametr": "—", "gurt": "—", "yakist": "анциркулейтед", "tyrazh": "15000", "rik": "2026", "seriya": "—", "nominal": "250", "hud": "Володимир Дем'яненко, адаптація дизайну – Олександра Кучинська", "skul": "Володимир Дем'яненко", "note": "", "cat_nom": "250 грн", "cat_tir": 15000, "cat_year": 2026, "name_en": "Roll of circulating commemorative coins \"We are strong. We are together. Sumy region\" (25 coins per roll)", "desc_ua": "Ролик обігових пам’ятних монет присвячено невід’ємній частині України, визначеній Конституцією України, – Сумській області. Ця монета продовжує випуск обігових пам’ятних монет, присвячених адміністративно-територіальним одиницям України, які в умовах збройної агресії підтверджують важливість єдності та згуртованості нації в боротьбі за свободу і незалежність.\n\nНа сувенірному папері, у який запаковано кожний ролик, розміщено написи: БАНКНОТНО-МОНЕТНИЙ ДВІР НБУ, ОБІГОВА ПАМ’ЯТНА МОНЕТА, МИ СИЛЬНІ. МИ РАЗОМ. СУМСЬКА ОБЛАСТЬ, 25 ШТУК, номінал 250 та графічний знак гривні; логотип Банкнотно-монетного двору Національного банку України. Зверху зображено золоті хрести, що символізують поєднання працелюбності, гостинності та любові до рідної землі з високою духовністю, яка передається від покоління до покоління; унизу – стилізовані суми (гаманці).\n\nНа аверсі монети зображено малий Державний Герб України (угорі); в обрамленні давньоруського орнаменту по центру розміщено написи: УКРАЇНА / 10 / ГРИВЕНЬ (півколом); на тлі орнаменту зазначено рік карбування монети – 2026 (унизу) та логотип Банкнотно-монетного двору Національного банку України (праворуч).\n\nНа реверсі монети на дзеркальному тлі зображено стилізовану мапу України з чітко окресленими адміністративними межами. На мапі на матовому тлі, що контрастує з рештою зображення, виокремлено Сумську область як складову єдиного державного простору. Угорі по колу розміщено напис СУМСЬКА ОБЛАСТЬ, унизу – гасло серії МИ СИЛЬНІ. МИ РАЗОМ.", "desc_en": "A roll of circulating commemorative coins dedicated to an integral part of Ukraine as defined by the Constitution of Ukraine – Sumy Oblast. This coin continues the issuance of circulating commemorative coins dedicated to the administrative and territorial units of Ukraine, which, amid the armed aggression, confirm the importance of unity and solidarity of the nation in the fight for freedom and independence.\n\nOn the souvenir paper in which each roll is wrapped are the inscriptions: БАНКНОТНО-МОНЕТНИЙ ДВІР НБУ, ОБІГОВА ПАМ’ЯТНА МОНЕТА, МИ СИЛЬНІ. МИ РАЗОМ. СУМСЬКА ОБЛАСТЬ, 25 ШТУК, the denomination 250 and the graphic sign of the hryvnia; the logo of the National Bank of Ukraine Banknote Printing and Minting Works. At the top are golden crosses symbolizing the combination of hard work, hospitality, and love for the native land with a high spirituality passed from generation to generation; at the bottom – stylized money bags (sumy).\n\nThe obverse of the coin depicts the small State Coat of Arms of Ukraine (at the top); framed by an Old Rus ornament in the centre are the inscriptions: УКРАЇНА / 10 / ГРИВЕНЬ (in a semicircle); against the ornament background are the year of issue of the coin – 2026 (at the bottom) and the logo of the National Bank of Ukraine Banknote Printing and Minting Works (on the right).\n\nThe reverse of the coin on a mirror background depicts a stylized map of Ukraine with clearly defined administrative boundaries. On the map, on a matte background contrasting with the rest of the image, Sumy Oblast is highlighted as part of a single state space. At the top, along the rim, is the inscription СУМСЬКА ОБЛАСТЬ; at the bottom – the series slogan МИ СИЛЬНІ. МИ РАЗОМ."}, {"id": 2, "uid": "ee0e5bb073", "name": "Ролик обігових пам'ятних монет «Ми сильні. Ми разом. Чернігівська область» (у ролику 25 монет)", "cat": "Ролики обігових монет", "img": "images/img_02.jpg", "photos": [{"src": "images/img_02.jpg", "label": "Аверс"}, {"src": "images/img_02_b.jpg", "label": "Аверс"}, {"src": "images/img_02_c.jpg", "label": "Реверс"}, {"src": "images/img_02_d.jpg", "label": "Реверс"}], "url": "https://coins.bank.gov.ua/rolik-obigovih-pam-jatnih-monet-mi-silni-mi-razom-chernigivska-oblast-u-roliku-25-monet-/p-1201.html", "price": 459, "qty": 1, "metal": "—", "metal_short": "—", "masa": "—", "diametr": "—", "gurt": "—", "yakist": "анциркулейтед", "tyrazh": "15000", "rik": "2026", "seriya": "—", "nominal": "250", "hud": "Володимир Дем'яненко; адаптація дизайну – Олександра Кучинська", "skul": "Володимир Дем'яненко", "note": "", "cat_nom": "250 грн", "cat_tir": 15000, "cat_year": 2026, "name_en": "Roll of circulating commemorative coins \"We are strong. We are together. Chernihiv region\" (25 coins per roll)", "desc_ua": "Ролик обігових пам’ятних монет присвячено невід’ємній частині України, визначеній Конституцією України, – Чернігівській області. Ця монета продовжує випуск обігових пам’ятних монет, присвячених адміністративно-територіальним одиницям України, які в умовах збройної агресії підтверджують важливість єдності та згуртованості нації в боротьбі за свободу і незалежність.\n\nНа сувенірному папері, у який запаковано кожний ролик, розміщено написи: БАНКНОТНО-МОНЕТНИЙ ДВІР НБУ, ОБІГОВА ПАМ’ЯТНА МОНЕТА, МИ СИЛЬНІ. МИ РАЗОМ. ЧЕРНІГІВСЬКА ОБЛАСТЬ, 25 ШТУК, номінал 250 та графічний знак гривні; логотип Банкнотно-монетного двору Національного банку України; зверху зображено патерн зі знаком династії Рюриковичів на синьому тлі; унизу – гармати на зеленому тлі.\n\nНа аверсі монети зображено малий Державний Герб України (угорі); в обрамленні давньоруського орнаменту по центру розміщено написи: \nУКРАЇНА / 10 / ГРИВЕНЬ (півколом); на тлі орнаменту зазначено рік карбування монети – 2026 (унизу) та логотип Банкнотно-монетного двору Національного банку України (праворуч).\n\nНа реверсі монети на дзеркальному тлі зображено стилізовану мапу України з чітко окресленими адміністративними межами. На мапі на матовому тлі, що контрастує з рештою зображення, виокремлено Чернігівську область як складову єдиного державного простору. Угорі по колу розміщено напис ЧЕРНІГІВСЬКА ОБЛАСТЬ, унизу – гасло серії МИ СИЛЬНІ. МИ РАЗОМ.", "desc_en": "The roll of circulating commemorative coins is dedicated to Chernihiv Oblast – an inalienable part of Ukraine as defined by the Constitution of Ukraine. This coin continues the issuance of circulating commemorative coins dedicated to the administrative-territorial units of Ukraine, which, under the conditions of armed aggression, affirm the importance of the nation's unity and cohesion in the fight for freedom and independence.\n\nOn the souvenir paper wrapping each roll are the inscriptions: БАНКНОТНО-МОНЕТНИЙ ДВІР НБУ, ОБІГОВА ПАМ’ЯТНА МОНЕТА, МИ СИЛЬНІ. МИ РАЗОМ. ЧЕРНІГІВСЬКА ОБЛАСТЬ, 25 ШТУК, the denomination 250 and the hryvnia graphic sign; the logo of the National Bank of Ukraine Banknote Printing and Minting Works; at the top – a pattern with the sign of the Rurik dynasty on a blue background; at the bottom – cannons on a green background.\n\nThe obverse of the coin depicts the small State Coat of Arms of Ukraine (at the top); framed by an Old Rus ornament in the centre are the inscriptions:\nУКРАЇНА / 10 / ГРИВЕНЬ (in a semicircle); against the background of the ornament are the coin's year of issue – 2026 (below) and the logo of the National Bank of Ukraine Banknote Printing and Minting Works (on the right).\n\nThe reverse of the coin, on a mirror background, depicts a stylized map of Ukraine with clearly defined administrative boundaries. On the map, against a matte background that contrasts with the rest of the image, Chernihiv Oblast is highlighted as part of the single state space. At the top along the circle is the inscription ЧЕРНІГІВСЬКА ОБЛАСТЬ, and below – the series motto МИ СИЛЬНІ. МИ РАЗОМ."}, {"id": 3, "uid": "7cc3d8bd5a", "name": "«Господарська юстиція України» (н) у сувенірному пакованні", "cat": "Пам'ятні монети", "img": "images/img_03.jpg", "photos": [{"src": "images/img_03.jpg", "label": "Аверс"}, {"src": "images/img_03_b.jpg", "label": "Реверс"}, {"src": "images/img_03_c.jpg", "label": "Аверс"}, {"src": "images/img_03_d.jpg", "label": "Реверс"}], "url": "https://coins.bank.gov.ua/-gospodarska-justicija-ukrajini-n-u-suvenirnomu-pakovanni/p-1199.html", "price": 201, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "рифлений", "yakist": "спеціальний анциркулейтед", "tyrazh": "50000", "rik": "2026", "seriya": "Інші монети", "nominal": "5", "hud": "Дизайн – Тетяна Балута", "skul": "—", "note": "", "cat_nom": "5 грн", "cat_tir": 50000, "cat_year": 2026, "name_en": "\"Commercial Justice of Ukraine\" (nickel silver) in souvenir packaging", "desc_ua": "Пам’ятна монета “Господарська юстиція України”, присвячена 35-річчю становлення в Україні системи спеціалізованих судів, що забезпечують розгляд спорів у сфері господарської діяльності. Господарська юстиція є складовою судової влади України та відіграє важливу роль у формуванні правового середовища для функціонування економіки.\n\nНа аверсі монети головним елементом є геометрична форма квадрата, що символізує юрисдикцію як основу правової системи та уособлює стабільність, рівновагу, порядок і фундаментальність. Додаткові абстрактні елементи формують середовище хаосу та зовнішніх впливів. Уся композиція метафорично ілюструє стабільність у світі постійних змін. Унизу композиції розміщено напис УКРАЇНА, номінал 5 із графічним символом гривні, рік карбування – 2026 та логотип Банкнотно-монетного двору Національного банку України.\n\nНа реверсі зображена архітектурна колона, що уособлює непохитність правової системи. Ліворуч від колони написи: 35 – ювілейна дата та ГОСПОДАРСЬКА ЮСТИЦІЯ УКРАЇНИ. Знизу композиції на матовому тлі розміщено напис ДОСВІД / ДОВІРА / ДІЄВІСТЬ (півколом), що відображає ключові цінності господарської юстиції: професійну спадковість, суспільну довіру та ефективність у вирішенні економічних спорів.", "desc_en": "The commemorative coin “Господарська юстиція України” is dedicated to the 35th anniversary of the establishment in Ukraine of the system of specialized courts that hear disputes in the field of commercial activity. Commercial justice is a component of the judiciary of Ukraine and plays an important role in shaping the legal environment for the functioning of the economy.\n\nThe obverse of the coin is dominated by a geometric square, which symbolizes jurisdiction as the foundation of the legal system and embodies stability, balance, order, and fundamentality. Additional abstract elements form an environment of chaos and external influences. The entire composition metaphorically illustrates stability in a world of constant change. At the bottom of the composition are the inscription УКРАЇНА, the denomination 5 with the graphic symbol of the hryvnia, the year of issue – 2026, and the logo of the National Bank of Ukraine Banknote Printing and Minting Works.\n\nThe reverse depicts an architectural column embodying the unshakeable nature of the legal system. To the left of the column are the inscriptions: 35 – the anniversary date and ГОСПОДАРСЬКА ЮСТИЦІЯ УКРАЇНИ. At the bottom of the composition, on a matte background, is the inscription ДОСВІД / ДОВІРА / ДІЄВІСТЬ (in a semicircle), reflecting the key values of commercial justice: professional continuity, public trust, and effectiveness in resolving economic disputes."}, {"id": 4, "uid": "b0257b754d", "name": "«Розстріляне відродження. Іван Падалка» (н) у сувенірному пакованні", "cat": "Пам'ятні монети", "img": "images/img_04.jpg", "photos": [{"src": "images/img_04.jpg", "label": "Аверс"}, {"src": "images/img_04_b.jpg", "label": "Аверс"}, {"src": "images/img_04_c.jpg", "label": "Реверс"}, {"src": "images/img_04_d.jpg", "label": "Реверс"}], "url": "https://coins.bank.gov.ua/-rozstriljane-vidrodzhennja-ivan-padalka-n-u-suvenirnomu-pakovanni/p-1194.html", "price": 210, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "рифлений", "yakist": "спеціальний анциркулейтед", "tyrazh": "50000", "rik": "2026", "seriya": "Інші монети", "nominal": "5", "hud": "Володимир Таран, Олександр Харук, Сергій Харук", "skul": "Володимир Атаманчук", "note": "", "cat_nom": "5 грн", "cat_tir": 50000, "cat_year": 2026, "name_en": "\"Executed Renaissance. Ivan Padalka\" (nickel silver) in souvenir packaging", "desc_ua": "Пам’ятна монета присвячена поколінню українських митців 1920–1930-х років, яке стало провідником культурного відродження, розвиваючи літературу, театр, кіно, музику й образотворче мистецтво, але було безжально знищене тоталітарним режимом. Одним із ключових осередків мистецького життя став будинок “Слово” в Харкові – місце, де народжувалися ідеї, що змінювали українську культуру, і водночас простір, який став свідком трагічної долі своїх мешканців. Одним із яскравих представників Розстріляного відродження є Іван Падалка – художник-монументаліст, графік і педагог, талановитий учень Михайла Бойчука. Його роботи експонувалися на виставках у Данії, Італії, Німеччині, Норвегії, Польщі, Швейцарії, Франції, Японії. У 1937 році митець був репресований і розстріляний, а його ім’я багато років було під забороною. Ця пам’ятна монета продовжує тему Розстріляного відродження, вшановуючи внесок Івана Падалки та всіх митців, які, попри жорсткий тиск, творили та розвивали українську культуру.\n\nНа аверсі монети розміщено стилізований напис СЛОВО – назву харківського будинку літераторів 30-х років XX століття. У текстурі літер проглядається парость озимої пшениці – образ молодого покоління митців, життя і творчість яких були цинічно зламані тоталітарною владою. Трагізм історичної епохи підкреслює прострелена літера “О”, з якої стікає кров, нагадуючи про болючу рану в історії України та нездійснені мрії талановитих митців. Під текстовою композицією зазначено напис УКРАЇНА, рік карбування – 20 / 26, малий Державний Герб України, номінал 5 з графічним символом гривні та логотип Банкнотно-монетного двору Національного банку України.\n\nНа реверсі монети на дзеркальному тлі зображено стилізований портрет Івана Падалки, образ якого, ніби інвазія чужорідних тіл, захоплює та нищить\nсимвол тодішнього радянського режиму – серп і молот. Ліворуч від портрета вертикально розташовано напис ІВАН / ПАДАЛКА – ім’я митця, викарбуване рельєфно, та зазначено роки його життя – 1894 / 1937.", "desc_en": "The commemorative coin is dedicated to the generation of Ukrainian artists of the 1920s–1930s who led the cultural renaissance, developing literature, theatre, cinema, music, and fine arts, but were mercilessly destroyed by the totalitarian regime. One of the key hubs of artistic life was the “Slovo” building in Kharkiv – a place where ideas that transformed Ukrainian culture were born, and at the same time a space that witnessed the tragic fate of its residents. One of the brightest representatives of the Executed Renaissance is Ivan Padalka – a monumental artist, graphic artist, and teacher, a talented pupil of Mykhailo Boichuk. His works were exhibited in Denmark, Italy, Germany, Norway, Poland, Switzerland, France, and Japan. In 1937 the artist was repressed and executed, and his name was banned for many years. This commemorative coin continues the Executed Renaissance theme, honouring the contribution of Ivan Padalka and all the artists who, despite harsh pressure, created and developed Ukrainian culture.\n\nThe obverse of the coin bears the stylized inscription СЛОВО – the name of the Kharkiv writers' residence of the 1930s. Within the texture of the letters, a sprout of winter wheat can be seen – an image of the young generation of artists whose lives and work were cynically broken by the totalitarian power. The tragedy of the historical era is underscored by the shot-through letter “О”, from which blood drips, reminding of the painful wound in the history of Ukraine and the unfulfilled dreams of talented artists. Below the text composition are the inscription УКРАЇНА, the year of issue – 20 / 26, the small State Coat of Arms of Ukraine, the denomination 5 with the graphic symbol of the hryvnia, and the logo of the National Bank of Ukraine Banknote Printing and Minting Works.\n\nThe reverse of the coin on a mirror background depicts a stylized portrait of Ivan Padalka, whose image, like an invasion of foreign bodies, captures and destroys the symbol of the then Soviet regime – the hammer and sickle. To the left of the portrait, the inscription ІВАН / ПАДАЛКА – the artist's name, minted in relief – is placed vertically, along with the years of his life – 1894 / 1937."}, {"id": 5, "uid": "4de4a8ddbb", "name": "«Розстріляне відродження. Майк Йогансен» (н) у сувенірному пакованні", "cat": "Пам'ятні монети", "img": "images/img_05.jpg", "photos": [{"src": "images/img_05.jpg", "label": "Аверс"}, {"src": "images/img_05_b.jpg", "label": "Аверс"}, {"src": "images/img_05_c.jpg", "label": "Реверс"}, {"src": "images/img_05_d.jpg", "label": "Реверс"}], "url": "https://coins.bank.gov.ua/-rozstriljane-vidrodzhennja-majk-jogansen-n-u-suvenirnomu-pakovanni/p-1195.html", "price": 210, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "рифлений", "yakist": "спеціальний анциркулейтед", "tyrazh": "50000", "rik": "2026", "seriya": "Інші монети", "nominal": "5", "hud": "Володимир Таран, Олександр Харук, Сергій Харук", "skul": "Володимир Атаманчук", "note": "", "cat_nom": "5 грн", "cat_tir": 50000, "cat_year": 2026, "name_en": "\"Executed Renaissance. Mike Johansen\" (nickel silver) in souvenir packaging", "desc_ua": "Пам’ятна монета присвячена поколінню українських митців 1920–1930-х років, яке стало провідником культурного відродження, розвиваючи літературу, театр, кіно, музику й образотворче мистецтво, але було безжально знищене тоталітарним режимом. Одним із ключових осередків мистецького життя став будинок “Слово” в Харкові – місце, де народжувалися ідеї, що змінювали українську культуру, і водночас простір, який став свідком трагічної долі своїх мешканців. Одним із яскравих представників Розстріляного відродження є Майк Йогансен – поет, прозаїк, перекладач, лінгвіст, сценарист і критик. Митець був одним із засновників літературних об’єднань “Гарт”, ВАПЛІТЕ та “Техномистецької групи А”, співредактором “Літературного ярмарку”. У 1937 році Майк Йогансен був репресований і розстріляний, а його ім’я багато років було під забороною. Ця пам’ятна монета продовжує тему Розстріляного відродження, вшановуючи внесок Майка Йогансена та всіх митців, які, попри жорсткий тиск, творили та розвивали українську культуру.\n\nНа аверсі монети розміщено стилізований напис СЛОВО – назву харківського будинку літераторів 30-х років XX століття. У текстурі літер\nпроглядається парость озимої пшениці – образ молодого покоління митців, життя і творчість яких були цинічно зламані тоталітарною владою. Трагізм\nісторичної епохи підкреслює прострелена літера “О”, з якої стікає кров, нагадуючи про болючу рану в історії України та нездійснені мрії талановитих митців. Під текстовою композицією зазначено напис УКРАЇНА, рік карбування – 20 / 26, малий Державний Герб України, номінал 5 з графічним символом гривні та логотип Банкнотно-монетного двору Національного банку України.\n\nНа реверсі монети на дзеркальному тлі зображено стилізований портрет Майка Йогансена, розміщений ніби на титулі книги, з якої виривають сторінку з іменем поета і прозаїка – МАЙК / ЙОГАНСЕН, унизу під портретом зазначено роки життя митця – 1895 / 1937. Ця композиція символізує період 1930-х років, коли намагалися знищити пам’ять про видатних українців: літераторів, драматургів, музикантів, художників.", "desc_en": "This commemorative coin is dedicated to the generation of Ukrainian artists of the 1920s–1930s, who led the cultural revival by developing literature, theatre, film, music and fine arts, but were ruthlessly destroyed by the totalitarian regime. One of the key centres of artistic life was the \"Slovo\" House in Kharkiv – a place where ideas that changed Ukrainian culture were born, and at the same time a space that witnessed the tragic fate of its residents. One of the most prominent representatives of the Executed Renaissance is Mike Johansen – poet, prose writer, translator, linguist, screenwriter and critic. The artist was one of the founders of the literary associations \"Hart\", VAPLITE and the \"Technomystetska Group A\", co-editor of the \"Literaturnyi Yarmarok\". In 1937, Mike Johansen was repressed and executed, and his name was banned for many years. This commemorative coin continues the theme of the Executed Renaissance, honouring the contribution of Mike Johansen and all the artists who, despite severe pressure, created and developed Ukrainian culture.\n\nThe obverse of the coin features the stylized inscription СЛОВО – the name of the Kharkiv house of writers of the 1930s. In the texture of the letters, a shoot of winter wheat can be discerned – the image of a young generation of artists whose life and work were cynically broken by the totalitarian authorities. The tragedy of the historical era is emphasized by the shot-through letter \"О\", from which blood drips, recalling the painful wound in the history of Ukraine and the unfulfilled dreams of talented artists. Beneath the text composition are the inscription УКРАЇНА, the year of issue – 20 / 26, the small State Coat of Arms of Ukraine, the denomination 5 with the hryvnia graphic symbol, and the logo of the National Bank of Ukraine Banknote Printing and Minting Works.\n\nThe reverse of the coin, on a mirror background, depicts a stylized portrait of Mike Johansen, placed as if on the title page of a book from which a page bearing the poet and prose writer's name – МАЙК / ЙОГАНСЕН – is being torn out; below the portrait are the artist's years of life – 1895 / 1937. This composition symbolizes the period of the 1930s, when attempts were made to destroy the memory of outstanding Ukrainians: writers, playwrights, musicians, artists."}, {"id": 6, "uid": "7652a90848", "name": "«Країна супергероїв. Дякуємо зброярам!» (н) у сувенірному пакованні", "cat": "Пам'ятні монети", "img": "images/img_06.jpg", "photos": [{"src": "images/img_06.jpg", "label": "Аверс"}, {"src": "images/img_06_b.jpg", "label": "Аверс"}, {"src": "images/img_06_c.jpg", "label": "Реверс"}, {"src": "images/img_06_d.jpg", "label": "Реверс"}], "url": "https://coins.bank.gov.ua/-krajina-supergerojiv-djakuiemo-zbrojaram-n-u-suvenirnomu-pakovanni/p-1190.html", "price": 199, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "рифлений", "yakist": "спеціальний анциркулейтед", "tyrazh": "50000", "rik": "2026", "seriya": "Безсмертна моя Україно", "nominal": "5", "hud": "Дмитро Чапко", "skul": "—", "note": "", "cat_nom": "5 грн", "cat_tir": 50000, "cat_year": 2026, "name_en": "\"Country of Superheroes. Thank You, Arms Makers!\" (nickel silver) in souvenir packaging", "desc_ua": "Пам’ятна монета присвячена тим, хто зміцнює обороноздатність України. Завдяки впровадженню інноваційних підходів і нестандартних рішень наші зброярі створюють новітні системи озброєння, які захищають українську землю в російсько-українській війні та визначають світові тенденції у військовій промисловості.\n\nНа аверсі монети зображено традиційний орнамент української вишивки, що переходить у \"піксель\". Таке поєднання відображає еволюцію української\nсили – від спадщини минулого до інновацій сьогодення. У верхній частині композиції ліворуч зазначено: малий Державний Герб України, напис УКРАЇНА, номінал 5 та графічний знак гривні, рік карбування монети – 2026. Праворуч розміщено логотип Банкнотно-монетного двору Національного банку України. Унизу монети – напис ДЯКУЄМО ЗБРОЯРАМ!.\n\nНа реверсі монети зображено постать українського зброяра, зосередженого на створенні одного з найефективніших на сьогодні видів озброєння – БпЛА. Це збірний образ українських інженерів, конструкторів та інших технічних спеціалістів, чиї знання, ідеї та інновації перетворюються на інструменти захисту держави. Їхня робота не щодня потрапляє до фронтових хронік, але суттєво впливає на перебіг війни.", "desc_en": "The commemorative coin is dedicated to those who strengthen Ukraine’s defense capability. Thanks to the introduction of innovative approaches and unconventional solutions, our weapons makers create state-of-the-art weapons systems that protect Ukrainian land in the Russo-Ukrainian war and set global trends in the military industry.\n\nThe obverse of the coin depicts a traditional Ukrainian embroidery ornament that transitions into “pixel”. This combination reflects the evolution of Ukrainian strength – from the heritage of the past to the innovations of today. In the upper part of the composition, on the left, are: the small State Coat of Arms of Ukraine, the inscription УКРАЇНА, the denomination 5 and the graphic symbol of the hryvnia, the year of issue of the coin – 2026. On the right is the logo of the National Bank of Ukraine Banknote Printing and Minting Works. At the bottom of the coin is the inscription ДЯКУЄМО ЗБРОЯРАМ!.\n\nThe reverse of the coin depicts a Ukrainian weapons maker focused on creating one of the most effective types of weapons today – the UAV. This is a composite image of Ukrainian engineers, designers, and other technical specialists whose knowledge, ideas, and innovations are transformed into tools for defending the state. Their work does not make the frontline chronicles every day, but it significantly influences the course of the war."}, {"id": 7, "uid": "5b888de4da", "name": "«Чорнобиль. Відродження. Зубр» (н) у сувенірному пакованні", "cat": "Пам'ятні монети", "img": "images/img_07.jpg", "photos": [{"src": "images/img_07.jpg", "label": "Аверс"}, {"src": "images/img_07_b.jpg", "label": "Фото 2"}, {"src": "images/img_07_c.jpg", "label": "Реверс"}, {"src": "images/img_07_d.jpg", "label": "Реверс"}], "url": "https://coins.bank.gov.ua/-chornobil-vidrodzhennja-zubr-n-u-suvenirnomu-pakovanni/p-1192.html", "price": 243, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "рифлений", "yakist": "спеціальний анциркулейтед", "tyrazh": "20000", "rik": "2026", "seriya": "Флора і фауна України", "nominal": "5", "hud": "Фандікова Наталія", "skul": "Демяненко Анатолій, Дем'яненко Володимир", "note": "", "cat_nom": "5 грн", "cat_tir": 20000, "cat_year": 2026, "name_en": "\"Chornobyl. Revival. European Bison\" (nickel silver) in souvenir packaging", "desc_ua": "Пам’ятна монета присвячена зубру – рідкісному виду, занесеному до Червоної книги України ще в 1980 році. У природних екосистемах зубри виконують важливу функцію: зокрема, змінюючи рослинний покрив і поширюючи на інші території насіння, вони сприяють збереженню біорізноманіття. Уперше перебування зубра в Чорнобильській зоні було зафіксовано у квітні 2012 року. У наступні роки фотопастки та дослідники неодноразово підтверджували присутність цих тварин у різних частинах зони відчуження. У 2022 році мав розпочатися унікальний міжнародний проєкт із відновлення популяції виду, однак його реалізацію зупинило повномасштабне вторгнення росії.\n\nНа аверсі монети розміщено: малий Державний Герб України (угорі), написи: УКРАЇНА (під гербом), номінал монети – 5 / ГРИВЕНЬ (праворуч від герба); символічне колесо життя, що знаменує відродження природи: у центрі – стилізований міжнародний знак “Радіаційна загроза”, оповитий листям, навколо якого тварини, популяції яких розвиваються у 30-кілометровій зоні відчуження, що стала своєрідним резерватом для розмноження, зокрема, ведмедя бурого, лося, зубра, рисі, коня Пржевальського, лелеки чорного; по колу на дзеркальному тлі написи: ЧОРНОБИЛЬСЬКИЙ РАДІАЦІЙНО-ЕКОЛОГІЧНИЙ БІОСФЕРНИЙ ЗАПОВІДНИК (ліворуч), CHORNOBYL RADIATION AND ECOLOGICAL BIOSPHERE RESERVE; логотип Банкнотно-монетного двору Національного банку України (угорі); рік карбування – 2026 (унизу).\n\nНа реверсі монети на тлі пейзажу зображено зубра (кольоровий друк), над яким праворуч на дзеркальному тлі написи: ЗУБР / BISON BONASUS; угорі ліворуч – зубр із зубреням.", "desc_en": "This commemorative coin is dedicated to the European bison – a rare species listed in the Red Book of Ukraine back in 1980. In natural ecosystems, bison perform an important function: in particular, by changing the vegetation cover and spreading seeds to other territories, they contribute to the preservation of biodiversity. The presence of bison in the Chornobyl zone was first recorded in April 2012. In subsequent years, camera traps and researchers repeatedly confirmed the presence of these animals in various parts of the exclusion zone. In 2022, a unique international project to restore the species' population was to begin, but its implementation was halted by Russia's full-scale invasion.\n\nThe obverse of the coin features: the small State Coat of Arms of Ukraine (at the top), inscriptions: УКРАЇНА (below the coat of arms), the coin's denomination – 5 / ГРИВЕНЬ (to the right of the coat of arms); a symbolic wheel of life signifying the revival of nature: in the centre – a stylized international \"Radiation Hazard\" sign entwined with leaves, around which are animals whose populations are developing in the 30-kilometre exclusion zone, which has become a kind of reserve for reproduction, in particular the brown bear, moose, European bison, lynx, Przewalski's horse, black stork; along the circle, on a mirror background, inscriptions: ЧОРНОБИЛЬСЬКИЙ РАДІАЦІЙНО-ЕКОЛОГІЧНИЙ БІОСФЕРНИЙ ЗАПОВІДНИК (left), CHORNOBYL RADIATION AND ECOLOGICAL BIOSPHERE RESERVE; the logo of the National Bank of Ukraine Banknote Printing and Minting Works (above); the year of issue – 2026 (below).\n\nThe reverse of the coin, against a landscape background, depicts a European bison (colour printing), above which on the right, on a mirror background, are the inscriptions: ЗУБР / BISON BONASUS; at the top left – a bison with a calf."}, {"id": 8, "uid": "8bd71db3c5", "name": "«Українська бавовна. Ракета-дрон \"Паляниця\"» (н) у сувенірному пакованні", "cat": "Пам'ятні монети", "img": "images/img_08.jpg", "photos": [{"src": "images/img_08.jpg", "label": "Аверс"}, {"src": "images/img_08_b.jpg", "label": "Аверс"}, {"src": "images/img_08_c.jpg", "label": "Реверс"}, {"src": "images/img_08_d.jpg", "label": "Реверс"}], "url": "https://coins.bank.gov.ua/-ukrajinska-bavovna-raketa-dron-paljanicja-n-u-suvenirnomu-pakovanni/p-1184.html", "price": 199, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "рифлений", "yakist": "спеціальний анциркулейтед", "tyrazh": "50000", "rik": "2026", "seriya": "Збройні Сили України", "nominal": "5", "hud": "Володимир Таран, Олександр Харук, Сергій Харук", "skul": "Володимир Атаманчук, Володимир Дем'яненко", "note": "", "cat_nom": "5 грн", "cat_tir": 50000, "cat_year": 2026, "name_en": "\"Ukrainian Cotton. 'Palianytsia' Missile-Drone\" (nickel silver) in souvenir packaging", "desc_ua": "Пам’ятна монета присвячена першій вітчизняній далекобійній системі озброєння з турбореактивним двигуном, що призначена для високоточних ударів Збройних Сил України по стратегічних об’єктах у глибокому тилу противника.\n\nНа аверсі монети зображено стилізований силует ракети-дрона “Паляниця”, що вражає змія. У верхній частині композиції зазначено: напис УКРАЇНА, номінал 5 та графічний знак гривні, рік карбування монети – 2026. Унизу ліворуч розміщено логотип Банкнотно-монетного двору Національного банку України.\n\nНа реверсі монети зображено атаку української далекобійної ракети-дрона на об’єкт паливно-енергетичного комплексу країни-агресора. Угорі – напис ПАЛЯНИЦЯ.", "desc_en": "The commemorative coin is dedicated to the first domestic long-range weapons system with a turbojet engine, designed for high-precision strikes by the Armed Forces of Ukraine on strategic targets deep in the enemy's rear.\n\nThe obverse of the coin depicts a stylized silhouette of the “Palianytsia” missile-drone striking a serpent. In the upper part of the composition: the inscription УКРАЇНА, the denomination 5 and the graphic sign of the hryvnia, the year of issue of the coin – 2026. At the bottom left is the logo of the National Bank of Ukraine Banknote Printing and Minting Works.\n\nThe reverse of the coin depicts an attack by a Ukrainian long-range missile-drone on a fuel-and-energy facility of the aggressor country. At the top – the inscription ПАЛЯНИЦЯ."}, {"id": 9, "uid": "f5c88b1829", "name": "Набір «Монети України 2025» у сувенірному пакованні", "cat": "Набори", "img": "images/img_09.jpg", "photos": [{"src": "images/img_09.jpg", "label": "Аверс"}, {"src": "images/img_09_b.jpg", "label": "Реверс"}, {"src": "images/img_09_c.jpg", "label": "Аверс"}, {"src": "images/img_09_d.jpg", "label": "Аверс"}], "url": "https://coins.bank.gov.ua/nabir-moneti-ukrajini-2025-u-suvenirnomu-pakovanni/p-1182.html", "price": 822, "qty": 1, "metal": "—", "metal_short": "—", "masa": "—", "diametr": "—", "gurt": "—", "yakist": "—", "tyrazh": "20000", "rik": "2025", "seriya": "—", "nominal": "58,50", "hud": "—", "skul": "—", "note": "50 копійок: низьковуглецева сталь з латунним покривом; 1, 2 гривні: низьковуглецева сталь з нікелевим покривом; 5, 10 гривень: сплав на основі цинку з нікелевим покривом", "cat_nom": "58,50 грн", "cat_tir": 20000, "cat_year": 2025, "name_en": "\"Coins of Ukraine 2025\" set in souvenir packaging", "desc_ua": "Колекційний набір містить обігові монети та обігові пам’ятні монети 2025 року карбування.\n\nДо набору входять: розмінна монета номіналом 50 копійок, обігові монети номіналами 1, 2, 5, 10 гривень та обігові пам’ятні монети номіналом 10 гривень – “Національна гвардія України”, “Сили безпілотних систем Збройних Сил України”, “Національна поліція України”, “Державна служба України з надзвичайних ситуацій”.\n\nМонету номіналом 50 копійок виготовлено з низьковуглецевої сталі з латунним покривом, монети номіналами 1, 2 гривні – з низьковуглецевої сталі з нікелевим покривом, монети номіналами 5, 10 гривень – зі сплаву на основі цинку з нікелевим покривом.", "desc_en": "The collector set contains circulation coins and circulating commemorative coins of the 2025 issue.\n\nThe set includes: a 50 kopiyka change coin, circulation coins in denominations of 1, 2, 5, 10 hryvnias, and circulating commemorative coins in the denomination of 10 hryvnias – \"National Guard of Ukraine\", \"Unmanned Systems Forces of the Armed Forces of Ukraine\", \"National Police of Ukraine\", \"State Emergency Service of Ukraine\".\n\nThe 50 kopiyka coin is made of low-carbon steel with a brass plating, the 1 and 2 hryvnia coins – of low-carbon steel with a nickel plating, and the 5 and 10 hryvnia coins – of a zinc-based alloy with a nickel plating."}, {"id": 10, "uid": "82ec3a988b", "name": "«Дипломатія» у сувенірному пакованні (н)", "cat": "Пам'ятні монети", "img": "images/img_10.jpg", "photos": [{"src": "images/img_10.jpg", "label": "Аверс"}, {"src": "images/img_10_b.jpg", "label": "Реверс"}, {"src": "images/img_10_c.jpg", "label": "Аверс"}, {"src": "images/img_10_d.jpg", "label": "Реверс"}], "url": "https://coins.bank.gov.ua/-diplomatija-u-suvenirnomu-pakovanni-n-/p-1180.html", "price": 176, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "рифлений", "yakist": "спеціальний анциркулейтед", "tyrazh": "50000", "rik": "2025", "seriya": "Інші монети", "nominal": "5", "hud": "Володимир Таран, Олександр Харук, Сергій Харук", "skul": "—", "note": "", "cat_nom": "5 грн", "cat_tir": 50000, "cat_year": 2025, "name_en": "\"Diplomacy\" (nickel silver) in souvenir packaging", "desc_ua": "Пам’ятна монета присвячена дипломатії – одній із форм реалізації державних інтересів та зовнішньополітичної позиції держави шляхом діалогу, переговорів і забезпечення відповідального балансу між державницькими принципами та політичними обставинами. Дипломатія є невід’ємною складовою процесу державотворення, що забезпечує позиціонування України в загальній системі міжнародних відносин, сприяє утвердженню її суверенітету, безпеки та міжнародної суб’єктності. Українська дипломатична традиція формувалася впродовж століть – від козацьких посольств і гетьманських універсалів до сучасної багатовекторної дипломатії незалежної держави, ґрунтуючись на тяглості політичної думки, відповідальності за державні рішення та здатності до стратегічної рівноваги.\n\nНа аверсі монети розміщено стилізоване зображення оливкової гілки – найдавнішого символу миру та добросусідства. Під композицією – малий Державний Герб України, номінал 5 з графічним знаком гривні, напис УКРАЇНА, рік карбування – 2025 та логотип Банкнотно-монетного двору Національного банку України.\n\nРеверс монети символічно відображає дипломатію як своєрідне мистецтво рівноваги та взаємодії. Переплетені лінії у верхній частині композиції передають складність міжнародних зв’язків, адже кожне рішення – це синергія діалогу, компромісу та відповідальності сторін. Трикутник візуально підкреслює стійкість основи дипломатичної діяльності. Центральний елемент композиції – прорис відбитка печатки Війська Запорізького 1648–1649 років, що вкотре нагадує нам про історичність української дипломатичної традиції та її глибоке коріння в державотворчій практиці минулого.", "desc_en": "The commemorative coin is dedicated to diplomacy – one of the forms of pursuing state interests and the state’s foreign policy position through dialogue, negotiations, and maintaining a responsible balance between state principles and political circumstances. Diplomacy is an integral component of the state-building process, ensuring Ukraine’s positioning in the overall system of international relations and contributing to the affirmation of its sovereignty, security, and international subjectivity. The Ukrainian diplomatic tradition has been formed over centuries – from Cossack embassies and hetman universals to the modern multi-vector diplomacy of the independent state, grounded in the continuity of political thought, responsibility for state decisions, and the capacity for strategic balance.\n\nThe obverse of the coin features a stylized image of an olive branch – the oldest symbol of peace and good neighborliness. Beneath the composition are the small State Coat of Arms of Ukraine, the denomination 5 with the graphic symbol of the hryvnia, the inscription УКРАЇНА, the year of issue – 2025, and the logo of the National Bank of Ukraine Banknote Printing and Minting Works.\n\nThe reverse of the coin symbolically depicts diplomacy as a kind of art of balance and interaction. The intertwined lines in the upper part of the composition convey the complexity of international relations, as every decision is a synergy of dialogue, compromise, and the responsibility of the parties. The triangle visually emphasizes the stability of the foundation of diplomatic activity. The central element of the composition is a drawn imprint of the seal of the Zaporozhian Host of 1648–1649, once again reminding us of the historicity of the Ukrainian diplomatic tradition and its deep roots in the state-building practice of the past."}, {"id": 11, "uid": "d7ab1e0b09", "name": "«Служба безпеки України. Захищаємо Україну разом!» у сувенірному пакованні (н)", "cat": "Пам'ятні монети", "img": "images/img_11.jpg", "photos": [{"src": "images/img_11.jpg", "label": "Аверс"}, {"src": "images/img_11_b.jpg", "label": "Реверс"}, {"src": "images/img_11_c.jpg", "label": "Аверс"}, {"src": "images/img_11_d.jpg", "label": "Реверс"}], "url": "https://coins.bank.gov.ua/-sluzhba-bezpeki-ukrajini-zahischaiemo-ukrajinu-razom-u-suvenirnomu-pakovanni-n-/p-1179.html", "price": 179, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "рифлений", "yakist": "спеціальний анциркулейтед", "tyrazh": "75000", "rik": "2025", "seriya": "Інші монети", "nominal": "5", "hud": "Олександра Кучинська", "skul": "Володимир Дем'яненко", "note": "", "cat_nom": "5 грн", "cat_tir": 75000, "cat_year": 2025, "name_en": "\"Security Service of Ukraine. Protecting Ukraine Together!\" (nickel silver) in souvenir packaging", "desc_ua": "Пам’ятна монета присвячена діяльності Служби безпеки України (далі – СБУ) та її унікальній спецоперації “Павутина” – важливій складовій системи національної безпеки нашої держави. Операція тривала близько півтора року й завершилася 01 червня 2025 року масованою атакою 117 FPV-дронів по чотирьох військових аеродромах ворога. Унаслідок удару було знищено 41 літак російської стратегічної авіації. Цей результат засвідчив спроможність України здійснювати високотехнологічні операції на великій відстані, підтвердивши витривалість, професіоналізм та інтелектуальну міць українських захисників. Пам’ятна монета вшановує героїзм, винахідливість і технологічну майстерність військовослужбовців СБУ, яка в умовах повномасштабної агресії росії проти України демонструє неперевершену здатність захищати суверенітет і територіальну цілісність держави.\n\nНа аверсі монети в центрі композиції розміщено стилізований образ троянського коня, за яким проглядається силует вантажівки, що перевозила FPV-дрони на бойові позиції. Цей архетип, навіяний давньогрецькою легендою про винахідливість, відображає суть операції “Павутина” – перемогу інтелекту та креативності над грубою силою. У верхній частині монети розміщено малий Державний Герб України, напис УКРАЇНА та рік карбування 2025, номінал 5 з графічним знаком гривні. Нижче – логотип Банкнотно-монетного двору Національного банку України. Ліворуч зображено емблему Служби безпеки України з гаслом СЛУЖБА БЕЗПЕКИ УКРАЇНИ. ЗАХИЩАЄМО УКРАЇНУ РАЗОМ.\n\nНа реверсі монети у верхній частині зображено силует дрона з бойовою частиною. Посередині – напис 117 FPV / ДРОНІВ, що вказує на кількість безпілотників, задіяних у спецоперації. Центральний елемент – дзеркальний силует стратегічного літака, який став однією з головних цілей удару в момент його ураження. Над ним – стилізована павутина, що поєднує чотири уражені аеродроми, ілюструючи мережевий характер операції та її стратегічну злагодженість. Додатковим елементом є тактична шкала з цифрами, що належить до систем керування дронами та забезпечує точність їх наведення оператором. У нижній частині півколом розміщено напис СПЕЦОПЕРАЦІЯ СБУ “ПАВУТИНА”.", "desc_en": "The commemorative coin is dedicated to the activities of the Security Service of Ukraine (SSU) and its unique special operation “Pavutyna” (“Spider's Web”) – an important component of the national security system of our state. The operation lasted about a year and a half and ended on 1 June 2025 with a massive attack by 117 FPV drones on four enemy military airfields. As a result of the strike, 41 aircraft of Russia's strategic aviation were destroyed. This outcome demonstrated Ukraine's ability to conduct high-tech operations over long distances, confirming the endurance, professionalism, and intellectual power of Ukrainian defenders. The commemorative coin honours the heroism, ingenuity, and technological mastery of SSU service members, who, amid Russia's full-scale aggression against Ukraine, demonstrate an unmatched ability to defend the sovereignty and territorial integrity of the state.\n\nThe obverse of the coin at the centre of the composition features a stylized image of the Trojan horse, behind which a silhouette of the truck that transported FPV drones to combat positions can be seen. This archetype, inspired by the ancient Greek legend of ingenuity, reflects the essence of Operation “Pavutyna” – the triumph of intellect and creativity over brute force. In the upper part of the coin are the small State Coat of Arms of Ukraine, the inscription УКРАЇНА, and the year of issue 2025, the denomination 5 with the graphic sign of the hryvnia. Below is the logo of the National Bank of Ukraine Banknote Printing and Minting Works. On the left is the emblem of the Security Service of Ukraine with the motto СЛУЖБА БЕЗПЕКИ УКРАЇНИ. ЗАХИЩАЄМО УКРАЇНУ РАЗОМ.\n\nThe reverse of the coin in the upper part depicts a silhouette of a drone with a warhead. In the middle – the inscription 117 FPV / ДРОНІВ, indicating the number of unmanned aerial vehicles involved in the special operation. The central element is a mirrored silhouette of a strategic aircraft, which became one of the main targets of the strike at the moment of its destruction. Above it is a stylized spider's web connecting the four hit airfields, illustrating the networked nature of the operation and its strategic coherence. An additional element is a tactical scale with numbers, part of drone control systems and ensuring the accuracy of their operator guidance. In the lower part, in a semicircle, is the inscription СПЕЦОПЕРАЦІЯ СБУ “ПАВУТИНА”."}, {"id": 12, "uid": "913f11eeab", "name": "«Українська бавовна. Безпілотний надводний апарат \"Magura\"» у сувенірному пакованні (н)", "cat": "Пам'ятні монети", "img": "images/img_12.jpg", "photos": [{"src": "images/img_12.jpg", "label": "Аверс"}, {"src": "images/img_12_b.jpg", "label": "Реверс"}, {"src": "images/img_12_c.jpg", "label": "Паковання"}, {"src": "images/img_12_d.jpg", "label": "Паковання"}], "url": "https://coins.bank.gov.ua/-ukrajinska-bavovna-bezpilotnij-nadvodnij-aparat-magura-u-suvenirnomu-pakovanni-n-/p-1178.html", "price": 176, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "рифлений", "yakist": "спеціальний анциркулейтед", "tyrazh": "50000", "rik": "2025", "seriya": "Збройні Сили України", "nominal": "5", "hud": "Володимир Таран, Олександр Харук, Сергій Харук", "skul": "Володимир Дем'яненко", "note": "", "cat_nom": "5 грн", "cat_tir": 50000, "cat_year": 2025, "name_en": "\"Ukrainian Cotton. 'Magura' Unmanned Surface Vessel\" (nickel silver) in souvenir packaging", "desc_ua": "Пам’ятна монета присвячена українській інноваційній розробці, що докорінно змінила тактику ведення бойових дій у Чорному морі. Завдяки операціям Головного управління розвідки Міністерства оборони України ці апарати знищили низку кораблів Чорноморського флоту рф, а також уперше в історії уразили повітряні цілі: гелікоптери Мі-8 та винищувачі Су-30. Пам’ятна монета увічнює інженерну майстерність українських розробників і бойову звитягу воїнів, які перетворили морські дрони на один із найефективніших видів зброї в цій війні.\n\nНа аверсі монети на матовому тлі зображено стилізований образ Магури – персонажа праслов’янської міфології, жінки-птаха з розправленими крилами, що тримає меч і щит. Вона уособлює Матір Славу, Перуницю – богиню війни, перемоги та вічного життя, покровительку війська слов’ян-русів. На щиті Магури – малий Державний Герб України. У верхній частині композиції зазначено: напис УКРАЇНА, номінал 5 та графічний знак гривні, а також рік карбування монети – 2025. Унизу ліворуч розміщено логотип Банкнотно-монетного двору Національного банку України.\n\nНа реверсі монети зображено стилізований безпілотний надводний апарат “Magura”, що стрімко рухається по хвилях, демонструючи динаміку й точність. У верхній частині композиції – сцена знищення винищувача Су-30 з елементами вогню та вибуху, що символізує ефективну протидію агресору на морі та в повітрі. Нижче розміщено емблему Головного управління розвідки Міністерства оборони України, що акцентує на ексклюзивному використанні цих морських дронів підрозділом Group 13, та напис MAGURA, виконаний у стилі логотипа виробника, що підкреслює автентичність, національну гордість та визнання досягнень українського оборонно-промислового комплексу.", "desc_en": "This commemorative coin is dedicated to a Ukrainian innovative development that has fundamentally changed the tactics of warfare in the Black Sea. Thanks to the operations of the Defence Intelligence of Ukraine, these vehicles destroyed a number of ships of Russia's Black Sea Fleet and, for the first time in history, hit air targets: Mi-8 helicopters and Su-30 fighter jets. The commemorative coin perpetuates the engineering mastery of Ukrainian developers and the combat valour of the warriors who turned naval drones into one of the most effective weapons in this war.\n\nThe obverse of the coin, on a matte background, depicts the stylized image of Mahura – a figure from Proto-Slavic mythology, a bird-woman with outstretched wings holding a sword and shield. She embodies Mother Slava, Perunytsia – the goddess of war, victory and eternal life, the patroness of the army of the Slavic Rus. On Mahura's shield is the small State Coat of Arms of Ukraine. In the upper part of the composition are: the inscription УКРАЇНА, the denomination 5 and the hryvnia graphic sign, as well as the coin's year of issue – 2025. At the bottom left is the logo of the National Bank of Ukraine Banknote Printing and Minting Works.\n\nThe reverse of the coin depicts a stylized \"Magura\" unmanned surface vehicle moving swiftly across the waves, demonstrating dynamics and precision. In the upper part of the composition – a scene of the destruction of a Su-30 fighter jet with elements of fire and explosion, symbolizing effective counteraction to the aggressor at sea and in the air. Below is the emblem of the Defence Intelligence of Ukraine, emphasizing the exclusive use of these naval drones by the Group 13 unit, and the inscription MAGURA, executed in the style of the manufacturer's logo, underscoring authenticity, national pride and recognition of the achievements of the Ukrainian defence-industrial complex."}, {"id": 13, "uid": "2ed339e946", "name": "Набір обігових пам'ятних монет «Сили безпеки і оборони України» у сувенірному пакованні", "cat": "Набори", "img": "images/img_13.jpg", "photos": [{"src": "images/img_13.jpg", "label": "Аверс"}, {"src": "images/img_13_b.jpg", "label": "Аверс"}, {"src": "images/img_13_c.jpg", "label": "Реверс"}, {"src": "images/img_13_d.jpg", "label": "Фото 4"}, {"src": "images/img_13_e.jpg", "label": "Аверс"}, {"src": "images/img_13_f.jpg", "label": "Аверс"}, {"src": "images/img_13_g.jpg", "label": "Реверс"}, {"src": "images/img_13_h.jpg", "label": "Реверс"}], "url": "https://coins.bank.gov.ua/nabir-obigovih-pam-jatnih-monet-sili-bezpeki-i-oboroni-ukrajini-u-suvenirnomu-pakovanni/p-1174.html", "price": 1286, "qty": 1, "metal": "—", "metal_short": "—", "masa": "—", "diametr": "—", "gurt": "—", "yakist": "анциркулейтед", "tyrazh": "14000", "rik": "2025", "seriya": "—", "nominal": "270", "hud": "—", "skul": "—", "note": "Кожна монета: сплав на основі цинку з нікелевим покривом", "cat_nom": "270 грн", "cat_tir": 14000, "cat_year": 2025, "name_en": "Set of circulating commemorative coins \"Security and Defense Forces of Ukraine\" in souvenir packaging", "desc_ua": "Набір обігових пам’ятних монет “Сили безпеки і оборони України”, присвячений мужнім захисникам України – воїнам Збройних Сил, прикордонникам, гвардійцям, поліцейським, рятувальникам та іншим представникам сил безпеки і оборони, які щодня стоять на варті незалежності, суверенітету та безпеки нашої держави. Кожна монета набору – це символ вдячності за героїзм, самопожертву та незламність духу тих, хто захищає Україну в умовах сучасних викликів.\nЦим набором обігових пам’ятних монет Національний банк України має на меті вшанувати подвиги наших захисників, силу та міць українських оборонних підрозділів.\nДо набору входять 27 обігових пам’ятних монет номіналом 10 гривень, які вводилися в обіг Національним банком України протягом 2018–2025 років: “Захисникам Донецького аеропорту”, “День українського добровольця”, “100-річчя створення Українського військово-морського флоту”, “На варті життя” (присвячується військовим медикам), «КрАЗ-6322 “Солдат”», “Учасникам бойових дій на території інших держав”, “Повітряні Сили Збройних Сил України”, “День пам’яті полеглих захисників України”, “Державна прикордонна служба України”, “Десантно-штурмові війська Збройних Сил України”, “Збройні Сили України”, “Сухопутні війська Збройних Сил України”, “Військово-морські Сили Збройних Сил України”, “Сили спеціальних операцій Збройних Сил України”, “Сили територіальної оборони Збройних Сил України”, “Сили підтримки Збройних Сил України”, “ППО – надійний щит України”, “Антонівський міст”, “Командування об’єднаних сил Збройних Сил України”, “Державна спеціальна служба транспорту”, “Медичні сили Збройних Сил України”, “Війська зв’язку та кібербезпеки Збройних Сил України”, “Сили логістики Збройних Сил України”, “Національна гвардія України”, “Сили безпілотних систем Збройних Сил України”, “Національна поліція України”, “Державна служба України з надзвичайних ситуацій”. Кожна монета виготовлена зі сплаву на основі цинку з нікелевим покривом, категорія якості карбування – “анциркулейтед”, тираж набору – до 14 000 штук.", "desc_en": "The set of circulating commemorative coins “Сили безпеки і оборони України” is dedicated to the courageous defenders of Ukraine – the soldiers of the Armed Forces, border guards, national guardsmen, police officers, rescuers, and other representatives of the security and defense forces who stand guard over the independence, sovereignty, and security of our state every day. Each coin in the set is a symbol of gratitude for the heroism, self-sacrifice, and unbreakable spirit of those who defend Ukraine amid modern challenges.\nWith this set of circulating commemorative coins, the National Bank of Ukraine aims to honor the feats of our defenders, the strength and might of Ukrainian defense units.\nThe set includes 27 circulating commemorative coins with a denomination of 10 hryvnias, put into circulation by the National Bank of Ukraine during 2018–2025: “Захисникам Донецького аеропорту”, “День українського добровольця”, “100-річчя створення Українського військово-морського флоту”, “На варті життя” (dedicated to military medics), «КрАЗ-6322 “Солдат”», “Учасникам бойових дій на території інших держав”, “Повітряні Сили Збройних Сил України”, “День пам’яті полеглих захисників України”, “Державна прикордонна служба України”, “Десантно-штурмові війська Збройних Сил України”, “Збройні Сили України”, “Сухопутні війська Збройних Сил України”, “Військово-морські Сили Збройних Сил України”, “Сили спеціальних операцій Збройних Сил України”, “Сили територіальної оборони Збройних Сил України”, “Сили підтримки Збройних Сил України”, “ППО – надійний щит України”, “Антонівський міст”, “Командування об’єднаних сил Збройних Сил України”, “Державна спеціальна служба транспорту”, “Медичні сили Збройних Сил України”, “Війська зв’язку та кібербезпеки Збройних Сил України”, “Сили логістики Збройних Сил України”, “Національна гвардія України”, “Сили безпілотних систем Збройних Сил України”, “Національна поліція України”, “Державна служба України з надзвичайних ситуацій”. Each coin is made of a zinc-based alloy with a nickel coating, the quality category of minting is “uncirculated”, the mintage of the set is up to 14,000 pieces."}, {"id": 14, "uid": "f65293ed49", "name": "«120 років від дня народження Ніла Хасевича» у сувенірному пакованні (н)", "cat": "Пам'ятні монети", "img": "images/img_14.jpg", "photos": [{"src": "images/img_14.jpg", "label": "Аверс"}, {"src": "images/img_14_b.jpg", "label": "Паковання"}, {"src": "images/img_14_c.jpg", "label": "Паковання"}, {"src": "images/img_14_d.jpg", "label": "Реверс"}], "url": "https://coins.bank.gov.ua/-120-rokiv-vid-dnja-narodzhennja-nila-hasevicha-u-suvenirnomu-pakovanni-n-/p-1171.html", "price": 154, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "31,0", "gurt": "рифлений", "yakist": "спеціальний анциркулейтед", "tyrazh": "50000", "rik": "2025", "seriya": "Видатні особистості України", "nominal": "2", "hud": "Аліса Іванова", "skul": "Володимир Атаманчук", "note": "", "cat_nom": "2 грн", "cat_tir": 50000, "cat_year": 2025, "name_en": "\"120th Anniversary of the Birth of Nil Khasevych\" (nickel silver) in souvenir packaging", "desc_ua": "Пам’ятна монета присвячена легендарній постаті українського підпілля, видатному художнику-графіку, учаснику національно-визвольного руху, який перетворив мистецтво на потужну зброю опору.\n\nНа аверсі монети в центрі композиції розміщено автопортрет Ніла Хасевича, виконаний у характерній для митця техніці деревориту, що вирізняється експресивною графікою, контрастною лінійністю та динамічним штрихуванням. Ліворуч на дзеркальному тлі зображено: малий Державний Герб України, рік карбування 2025, напис УКРАЇНА (вгорі); напис НІЛ / ХАСЕВИЧ (по центру); номінал 2 з графічним знаком гривні та логотип Банкнотно-монетного двору Національного банку України (унизу).\n\nНа реверсі монети зображено символічну композицію з фрагментів деревориту Ніла Хасевича, стилізовану під банкноту в дусі бофонів. Композиція містить елементи графіки митця як символу економічного, ідеологічного та морального ресурсу опору. Угорі на матовому тлі розміщено написи: ДО ВОЛІ / НАРОДІВ І ЛЮДИНИ та 300 КРБ / НА БОЙОВИЙ / ФОНД, що підкреслюють роль бофонів у зборі ресурсів для опору та співзвучні із сьогоднішньою практикою донатів.", "desc_en": "The commemorative coin is dedicated to the legendary figure of the Ukrainian underground, an outstanding graphic artist and participant in the national liberation movement who turned art into a powerful weapon of resistance.\n\nThe obverse of the coin at the centre of the composition features a self-portrait of Nil Khasevych, executed in the artist's characteristic woodcut technique, distinguished by expressive graphics, contrasting linearity, and dynamic hatching. On the left on a mirror background are: the small State Coat of Arms of Ukraine, the year of issue 2025, the inscription УКРАЇНА (at the top); the inscription НІЛ / ХАСЕВИЧ (in the centre); the denomination 2 with the graphic sign of the hryvnia and the logo of the National Bank of Ukraine Banknote Printing and Minting Works (at the bottom).\n\nThe reverse of the coin depicts a symbolic composition of fragments of Nil Khasevych's woodcuts, stylized as a banknote in the spirit of bofons. The composition incorporates elements of the artist's graphics as a symbol of the economic, ideological, and moral resource of resistance. At the top on a matte background are the inscriptions: ДО ВОЛІ / НАРОДІВ І ЛЮДИНИ and 300 КРБ / НА БОЙОВИЙ / ФОНД, emphasizing the role of bofons in raising resources for the resistance and echoing today's practice of donations."}, {"id": 15, "uid": "4f28840095", "name": "«Рік Коня» у сувенірному пакованні (н)", "cat": "Пам'ятні монети", "img": "images/img_15.jpg", "photos": [{"src": "images/img_15.jpg", "label": "Аверс"}, {"src": "images/img_15_b.jpg", "label": "Паковання"}, {"src": "images/img_15_c.jpg", "label": "Паковання"}, {"src": "images/img_15_d.jpg", "label": "Фото 4"}], "url": "https://coins.bank.gov.ua/-rik-konja-u-suvenirnomu-pakovanni-n-/p-1169.html", "price": 182, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "рифлений", "yakist": "спеціальний анциркулейтед", "tyrazh": "80000", "rik": "2025", "seriya": "Східний календар", "nominal": "5", "hud": "Марина Куц", "skul": "Володимир Атаманчук", "note": "", "cat_nom": "5 грн", "cat_tir": 80000, "cat_year": 2025, "name_en": "\"Year of the Horse\" (nickel silver) in souvenir packaging", "desc_ua": "Пам’ятна монета присвячена одній із дванадцяти тварин китайського зодіаку. Кінь – сьомий знак східного календаря, що уособлює активність, життєлюбство, незалежність, витривалість і цілеспрямованість. У традиційній китайській астрології він належить до типу “Ян” та асоціюється зі стихією Вогню, яка символізує динаміку, рішучість і прагнення до свободи. Водночас цьому знаку притаманні імпульсивність, нетерпимість до обмежень і схильність до ризику.\n\nНа аверсі монети розміщено: угорі – малий Державний Герб України, праворуч від якого напис півколом УКРАЇНА; на дзеркальному тлі по колу зображені 12 символів східного календаря, у центрі кола – стилізований годинник зі стрілкою, що вказує на коня – символ року, над стрілкою – 2026; унизу ліворуч напис півколом 5 ГРИВЕНЬ; на матовому тлі зображені стилізовані під українську витинанку символи кожної пори року: сніжинка (угорі), квітка (праворуч), ягода (унизу), листок (ліворуч); логотип Банкнотно-монетного двору Національного банку України (праворуч над символом тигра).\n\nНа реверсі монети в центрі композиції окремо зображено символ 2026 року – стилізованого коня на тлі підкови, що традиційно асоціюється з удачею та захистом. Грива коня передає динаміку руху “за вітром” або “проти вітру” – як метафора внутрішньої сили, спротиву та прагнення до свободи. Під центральним зображенням розміщено три крапки, які символізують продовження боротьби. По колу кінь оточений стилізованими елементами, які характерні кожній порі року: сніжинки (угорі праворуч), квітки (унизу праворуч), плоди (унизу ліворуч), гілки (угорі ліворуч).", "desc_en": "The commemorative coin is dedicated to one of the twelve animals of the Chinese zodiac. The Horse is the seventh sign of the Eastern calendar, embodying activity, love of life, independence, endurance, and purposefulness. In traditional Chinese astrology, it belongs to the “Yang” type and is associated with the element of Fire, which symbolizes dynamism, determination, and the pursuit of freedom. At the same time, this sign is characterized by impulsiveness, intolerance of restrictions, and a tendency to take risks.\n\nThe obverse of the coin features: at the top the small State Coat of Arms of Ukraine, to the right of which is the inscription in a semicircle УКРАЇНА; on a mirror background around the circle are the 12 symbols of the Eastern calendar, at the center of the circle a stylized clock with a hand pointing to the horse – the symbol of the year, above the hand – 2026; at the bottom left the inscription in a semicircle 5 ГРИВЕНЬ; on a matte background, symbols of each season stylized as Ukrainian vytynanka: a snowflake (at the top), a flower (on the right), a berry (at the bottom), a leaf (on the left); the logo of the National Bank of Ukraine Banknote Printing and Minting Works (to the right above the symbol of the tiger).\n\nThe reverse of the coin depicts separately, at the center of the composition, the symbol of 2026 – a stylized horse against a horseshoe, traditionally associated with luck and protection. The horse’s mane conveys the dynamics of movement “with the wind” or “against the wind” – as a metaphor for inner strength, resistance, and the pursuit of freedom. Beneath the central image are three dots symbolizing the continuation of the struggle. Around the circle, the horse is surrounded by stylized elements characteristic of each season: snowflakes (at the top right), flowers (at the bottom right), fruits (at the bottom left), branches (at the top left)."}, {"id": 16, "uid": "e126841ae8", "name": "Набір із двох пам'ятних монет «Мешканці морських глибин» у сувенірному пакованні (н)", "cat": "Набори", "img": "images/img_16.jpg", "photos": [{"src": "images/img_16.jpg", "label": "Аверс"}, {"src": "images/img_16_b.jpg", "label": "Паковання"}, {"src": "images/img_16_c.jpg", "label": "Паковання"}, {"src": "images/img_16_d.jpg", "label": "Реверс"}, {"src": "images/img_16_e.jpg", "label": "Реверс"}, {"src": "images/img_16_f.jpg", "label": "Реверс"}, {"src": "images/img_16_g.jpg", "label": "Фото 7"}, {"src": "images/img_16_h.jpg", "label": "Фото 8"}, {"src": "images/img_16_i.jpg", "label": "Фото 9"}, {"src": "images/img_16_j.jpg", "label": "Фото 10"}], "url": "https://coins.bank.gov.ua/nabir-iz-dvoh-pam-jatnih-monet-meshkanci-morskih-glibin-u-suvenirnomu-pakovanni-n-/p-1168.html", "price": 447, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0 (кожної)", "gurt": "рифлений", "yakist": "спеціальний анциркулейтед", "tyrazh": "50000", "rik": "2025", "seriya": "Флора і фауна України", "nominal": "10", "hud": "Аліса Іванова", "skul": "Анатолій Демяненко, Володимир Атаманчук", "note": "", "cat_nom": "10 грн", "cat_tir": 50000, "cat_year": 2025, "name_en": "Two-coin commemorative set \"Dwellers of the Sea Depths\" (nickel silver) in souvenir packaging", "desc_ua": "Дві пам’ятні монети України “Азовське море. Морський кріт”, “Чорне море. Чорноморський гребінець”, що складають набір “Мешканці морських глибин” (далі – набір), присвячений унікальним представникам морської фауни Чорного та Азовського морів – невід’ємній складовій природної спадщини України. Серед багатьох мешканців цих водойм – чорноморський гребінець (Flexopecten Ponticus) і морський кріт (Upogebia Pusilla) – види, що слугують біоіндикаторами стану морського середовища та є важливими елементами морських екосистем. Цим набором Національний банк України має на меті привернути увагу до проблеми збереження морів, нагадати про відповідальність людства за охорону природних ресурсів і підкреслити значення морської біоти у формуванні екосистеми України.\n\nНа аверсі монети, присвяченої Азовському морю, у центрі композиції розміщено стилізований контур Азовського моря з прилеглою територією України, виконаний у вигляді рельєфних горизонтальних ліній, що імітують морські хвилі. Угорі праворуч розташовано малий Державний Герб України, під яким горизонтально зазначено рік карбування – 2026, а вертикально – напис УКРАЇНА. Унизу монети розміщено номінал 5 з графічним знаком гривні. У нижній частині композиції півколом розміщено написи АЗОВСЬКЕ МОРЕ та THE SEA OF AZOV, між написами – логотип Банкнотно-монетного двору Національного банку України. На реверсі монети зображено двох морських кротів сірого та болотяного кольорів (елемент оздоблення – кольоровий друк) у зостері (морська трава), що є оптимальним життєвим середовищем для цього виду. Угорі півколом зазначено напис UPOGEBIA PUSILLA, а внизу – МОРСЬКИЙ КРІТ.\n\nНа аверсі монети, присвяченої Чорному морю, зображено стилізований абрис Чорного моря з прилеглою територією України, виконаний у вигляді рельєфних горизонтальних ліній різної довжини, що імітують морські хвилі. Угорі праворуч розміщено малий Державний Герб України, під яким зазначено напис УКРАЇНА. Унизу по центру розташовано номінал 5 з графічним знаком гривні, рік карбування монети – 2026. У нижній частині композиції півколом розміщено написи ЧОРНЕ МОРЕ та THE BLACK SEA, між написами – логотип Банкнотно-монетного двору Національного банку України. На реверсі монети зображено три чорноморських гребінці жовто-синього, помаранчевого та білого кольорів (елемент оздоблення – кольоровий друк) у типовому біотопі – піщаних заглибленнях. Угорі півколом розміщено напис FLEXOPECTEN PONTICUS, унизу – ЧОРНОМОРСЬКИЙ ГРЕБІНЕЦЬ.", "desc_en": "Two commemorative coins of Ukraine – “Азовське море. Морський кріт” and “Чорне море. Чорноморський гребінець”, which make up the set “Мешканці морських глибин” (hereinafter – the set) – are dedicated to unique representatives of the marine fauna of the Black and Azov Seas, an integral part of Ukraine's natural heritage. Among the many inhabitants of these waters are the Black Sea scallop (Flexopecten Ponticus) and the sea mole (Upogebia Pusilla) – species that serve as bioindicators of the state of the marine environment and are important elements of marine ecosystems. With this set, the National Bank of Ukraine aims to draw attention to the problem of preserving the seas, remind people of humanity's responsibility for protecting natural resources, and emphasize the importance of marine biota in shaping Ukraine's ecosystem.\n\nThe obverse of the coin dedicated to the Sea of Azov features, in the centre of the composition, a stylized outline of the Sea of Azov with the adjacent territory of Ukraine, executed in the form of relief horizontal lines imitating sea waves. At the top right is the small State Coat of Arms of Ukraine, beneath which horizontally is the year of issue – 2026, and vertically – the inscription УКРАЇНА. At the bottom of the coin is the denomination 5 with the hryvnia graphic sign. In the lower part of the composition, in a semicircle, are the inscriptions АЗОВСЬКЕ МОРЕ and THE SEA OF AZOV, with the logo of the National Bank of Ukraine Banknote Printing and Minting Works between the inscriptions. The reverse of the coin depicts two sea moles in grey and marsh colours (a decorative element – colour printing) in zostera (sea grass), the optimal habitat for this species. At the top, in a semicircle, is the inscription UPOGEBIA PUSILLA, and at the bottom – МОРСЬКИЙ КРІТ.\n\nThe obverse of the coin dedicated to the Black Sea features a stylized outline of the Black Sea with the adjacent territory of Ukraine, executed in the form of relief horizontal lines of varying length imitating sea waves. At the top right is the small State Coat of Arms of Ukraine, beneath which is the inscription УКРАЇНА. At the bottom centre is the denomination 5 with
