 the hryvnia graphic sign and the coin's year of issue – 2026. In the lower part of the composition, in a semicircle, are the inscriptions ЧОРНЕ МОРЕ and THE BLACK SEA, with the logo of the National Bank of Ukraine Banknote Printing and Minting Works between the inscriptions. The reverse of the coin depicts three Black Sea scallops in yellow-blue, orange and white colours (a decorative element – colour printing) in their typical biotope – sandy depressions. At the top, in a semicircle, is the inscription FLEXOPECTEN PONTICUS, and at the bottom – ЧОРНОМОРСЬКИЙ ГРЕБІНЕЦЬ."}, {"id": 17, "uid": "d3cae1b405", "name": "«150 років від дня народження Олександра Кошиця» у сувенірному пакованні (н)", "cat": "Пам'ятні монети", "img": "images/img_17.jpg", "photos": [{"src": "images/img_17.jpg", "label": "Аверс"}, {"src": "images/img_17_b.jpg", "label": "Аверс"}, {"src": "images/img_17_c.jpg", "label": "Реверс"}, {"src": "images/img_17_d.jpg", "label": "Реверс"}], "url": "https://coins.bank.gov.ua/-150-rokiv-vid-dnja-narodzhennja-oleksandra-koshicja-u-suvenirnomu-pakovanni/p-1163.html", "price": 155, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "31,0", "gurt": "рифлений", "yakist": "спеціальний анциркулейтед", "tyrazh": "50000", "rik": "2025", "seriya": "Видатні особистості України", "nominal": "2", "hud": "Володимир Таран, Олександр Харук, Сергій Харук", "skul": "Володимир Атаманчук", "note": "", "cat_nom": "2 грн", "cat_tir": 50000, "cat_year": 2025, "name_en": "\"150th Anniversary of the Birth of Oleksandr Koshyts\" (nickel silver) in souvenir packaging", "desc_ua": "Пам’ятна монета присвячена видатному українському хоровому диригенту, композитору, етнографу та педагогу Олександру Кошицю (1875–1944), який відіграв ключову роль у популяризації української музичної культури на міжнародній арені. Пам’ятна монета вшановує творчу спадщину митця, який на запрошення голови Директорії УНР Симона Петлюри очолив Українську республіканську капелу. Упродовж 1919–1924 років під керівництвом Олександра Кошиця капела здійснила гастрольне турне 17 країнами світу, давши понад 600 концертів. Саме тоді світ уперше почув “Щедрика” Миколи Леонтовича – твір, що згодом став всесвітньо відомим різдвяним хітом “Carol of the Bells”.\n\nНа аверсі монети розміщено композицію, що символізує гастрольну діяльність Української республіканської капели під орудою Олександра Кошиця. На матовому тлі відтворено стилізовану карту гастрольного маршруту, на якій позначено назви міст, де виступала капела. Між назвами міст зображено силуети ластівок – метафора духовного польоту, вільного руху та поширення українського мистецтва у світі. На дзеркальному тлі розміщено: напис УКРАЇНА, рік карбування 20 / 25, малий Державний Герб України, номінал 2 з графічним знаком гривні. Унизу ліворуч зазначено логотип Банкнотно-монетного двору Національного банку України.\n\nНа реверсі монети в центрі композиції зображено стилізований портрет Олександра Кошиця у фраку. Особливу увагу зосереджено на зображенні рук митця – головного “інструмента” диригента та засобу емоційного вираження. Тлом слугує хвиляста, динамічна поверхня, що розходиться від герба Української Народної Республіки, символізуючи поширення української культури світом завдяки гастрольному турне капели. Ліворуч на дзеркальному тлі розміщено написи: ОЛЕКСАНДР / КОШИЦЬ та роки його життя 1875 / 1944.", "desc_en": "The commemorative coin is dedicated to the outstanding Ukrainian choral conductor, composer, ethnographer, and teacher Oleksandr Koshyts (1875–1944), who played a key role in popularizing Ukrainian musical culture on the international stage. The commemorative coin honors the creative legacy of the artist who, at the invitation of the head of the UNR Directory Symon Petliura, headed the Ukrainian Republican Capella. During 1919–1924, under the leadership of Oleksandr Koshyts, the capella made a concert tour of 17 countries of the world, giving more than 600 concerts. It was then that the world first heard “Щедрик” by Mykola Leontovych – the work that later became the world-famous Christmas hit “Carol of the Bells”.\n\nThe obverse of the coin features a composition symbolizing the touring activity of the Ukrainian Republican Capella under the direction of Oleksandr Koshyts. On a matte background, a stylized map of the tour route is reproduced, marking the names of the cities where the capella performed. Between the city names are silhouettes of swallows – a metaphor for spiritual flight, free movement, and the spread of Ukrainian art in the world. On a mirror background are: the inscription УКРАЇНА, the year of issue 20 / 25, the small State Coat of Arms of Ukraine, the denomination 2 with the graphic symbol of the hryvnia. At the bottom left is the logo of the National Bank of Ukraine Banknote Printing and Minting Works.\n\nThe reverse of the coin depicts at the center of the composition a stylized portrait of Oleksandr Koshyts in a tailcoat. Special attention is focused on the depiction of the artist’s hands – the conductor’s main “instrument” and means of emotional expression. The background is a wavy, dynamic surface emanating from the coat of arms of the Ukrainian People’s Republic, symbolizing the spread of Ukrainian culture throughout the world thanks to the capella’s concert tour. On the left, on a mirror background, are the inscriptions: ОЛЕКСАНДР / КОШИЦЬ and the years of his life 1875 / 1944."}, {"id": 18, "uid": "b4a2d24efa", "name": "«130 років від дня народження Василя Вишиваного» у сувенірному пакованні (н)", "cat": "Пам'ятні монети", "img": "images/img_18.jpg", "photos": [{"src": "images/img_18.jpg", "label": "Аверс"}, {"src": "images/img_18_b.jpg", "label": "Реверс"}, {"src": "images/img_18_c.jpg", "label": "Паковання"}, {"src": "images/img_18_d.jpg", "label": "Паковання"}], "url": "https://coins.bank.gov.ua/-130-rokiv-vid-dnja-narodzhennja-vasilja-vishivanogo-u-suvenirnomu-pakovanni-n-/p-1162.html", "price": 154, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "31,0", "gurt": "рифлений", "yakist": "спеціальний анциркулейтед", "tyrazh": "50000", "rik": "2025", "seriya": "Видатні особистості України", "nominal": "2", "hud": "Іваненко Святослав", "skul": "Демяненко Анатолій, Атаманчук Володимир", "note": "", "cat_nom": "2 грн", "cat_tir": 50000, "cat_year": 2025, "name_en": "\"130th Anniversary of the Birth of Vasyl Vyshyvanyi\" (nickel silver) in souvenir packaging", "desc_ua": "Пам’ятна монета присвячена Вільгельму Францу фон Габсбурґу-Лотрінґену (1895–1948) – представнику європейської аристократії, який увійшов в історію України під псевдонімом Василь Вишиваний. Ерцгерцог австрійський, полковник легіону Українських січових стрільців, поет, дипломат, державний діяч – він був яскравим і непересічним учасником українських визвольних змагань початку ХХ століття. Займаючи визначне місце як на військовому фронті, так і в міжнародних дипломатичних колах, Василь Вишиваний усією своєю діяльністю утверджував ідеали незалежної, соборної України. Завдяки його активній участі Австро-Угорська імперія стала однією з перших країн, що офіційно визнала Українську Народну Республіку.\n\nНа аверсі монети зображено стилізовану композицію, що містить елемент кокарди легіону Українських січових стрільців – геральдичного галицького лева, який спирається на кам’яну брилу з написом У.С.С. 1914 (рік заснування легіону). На дзеркальному тлі розміщено: напис УКРАЇНА та факсиміле підпису Василя Вишиваного (угорі); рік карбування 2025, малий Державний Герб України, номінал 2 з графічним знаком гривні, стилізоване перо – символ його поетичної та дипломатичної діяльності, логотип Банкнотно-монетного двору Національного банку України та напис ВІЛЬГЕЛЬМ ФОН ГАБСБУРҐ (внизу).\n\nНа реверсі монети на дзеркальному тлі зображено стилізований портрет Василя Вишиваного у вишиванці та кожусі – елементах одягу, що стали частиною його особистої ідентичності. Ліворуч – декоративний орнамент з листям конюшини, який був талісманом військової удачі для воїнів УСС і прикрашав обкладинку його поетичної збірки “Минають дні…”, присвяченої борцям за волю України. Угорі над композицією зазначено півколом напис ВАСИЛЬ ВИШИВАНИЙ, а праворуч – роки його життя 1895–1948.", "desc_en": "The commemorative coin is dedicated to Wilhelm Franz von Habsburg-Lothringen (1895–1948) – a representative of the European aristocracy who entered the history of Ukraine under the pseudonym Vasyl Vyshyvanyi. An Austrian archduke, colonel of the Ukrainian Sich Riflemen Legion, poet, diplomat, and statesman – he was a bright and extraordinary participant in Ukraine's liberation struggles of the early twentieth century. Holding a prominent place both on the military front and in international diplomatic circles, Vasyl Vyshyvanyi through all his activities affirmed the ideals of an independent, united Ukraine. Thanks to his active involvement, the Austro-Hungarian Empire became one of the first countries to officially recognize the Ukrainian People's Republic.\n\nThe obverse of the coin depicts a stylized composition containing an element of the Ukrainian Sich Riflemen Legion's cockade – the heraldic Galician lion leaning on a stone block with the inscription У.С.С. 1914 (the year the legion was founded). On a mirror background are: the inscription УКРАЇНА and the facsimile signature of Vasyl Vyshyvanyi (at the top); the year of issue 2025, the small State Coat of Arms of Ukraine, the denomination 2 with the graphic sign of the hryvnia, a stylized quill – a symbol of his poetic and diplomatic activity, the logo of the National Bank of Ukraine Banknote Printing and Minting Works, and the inscription ВІЛЬГЕЛЬМ ФОН ГАБСБУРҐ (at the bottom).\n\nThe reverse of the coin on a mirror background depicts a stylized portrait of Vasyl Vyshyvanyi in an embroidered shirt and sheepskin coat – elements of clothing that became part of his personal identity. On the left is a decorative ornament with clover leaves, which was a talisman of military luck for the USS soldiers and adorned the cover of his poetry collection “Mynaiut dni…” (“Days Pass…”), dedicated to the fighters for Ukraine's freedom. Above the composition in a semicircle is the inscription ВАСИЛЬ ВИШИВАНИЙ, and on the right – the years of his life 1895–1948."}, {"id": 19, "uid": "65dc4f7594", "name": "«Адміністративне судочинство України» у сувенірному пакованні (н)", "cat": "Пам'ятні монети", "img": "images/img_19.jpg", "photos": [{"src": "images/img_19.jpg", "label": "Аверс"}, {"src": "images/img_19_b.jpg", "label": "Паковання"}, {"src": "images/img_19_c.jpg", "label": "Паковання"}, {"src": "images/img_19_d.jpg", "label": "Реверс"}], "url": "https://coins.bank.gov.ua/-administrativne-sudochinstvo-ukrajini-u-suvenirnomu-pakovanni-n-/p-1157.html", "price": 179, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "рифлений", "yakist": "спеціальний анциркулейтед", "tyrazh": "50000", "rik": "2025", "seriya": "Інші монети", "nominal": "5", "hud": "Олександра Кучинська", "skul": "—", "note": "", "cat_nom": "5 грн", "cat_tir": 50000, "cat_year": 2025, "name_en": "\"Administrative Justice of Ukraine\" (nickel silver) in souvenir packaging", "desc_ua": "Пам’ятна монета присвячена 20-річчю запровадження в Україні адміністративного судочинства – ключового інституту судової влади, який забезпечує незалежний судовий контроль за діяльністю публічної влади та ефективний захист прав і свобод громадян. Ухвалення 06 липня 2005 року Кодексу адміністративного судочинства України стало поворотним моментом у формуванні демократичного правопорядку держави. Цей нормативно-правовий акт започаткував окрему галузь судочинства, покликану забезпечити справедливість у сфері публічно-правових відносин. Пам’ятна монета є символом вдячності органам судової влади, правникам і всім, хто долучився до становлення та розвитку цієї важливої інституції.\n\nНа аверсі монети вгорі півколом розміщено напис АДМІНІСТРАТИВНЕ СУДОЧИНСТВО УКРАЇНИ, під яким зображено малий Державний Герб України. Центральне місце композиції займає стилізоване зображення розгорнутої книги, що символізує знання, законність і Кодекс адміністративного судочинства України як базову засаду функціонування адміністративної юстиції. Зліва у лавровому вінку зазначено напис 20 / РОКІВ, який акцентує увагу на ювілейній даті. Унизу під композицією – напис УКРАЇНА, рік карбування 2025, номінал 5 та графічний символ гривні, а також логотип Банкнотно-монетного двору Національного банку України.\n\nНа реверсі монети на дзеркальному тлі розміщено напис ВЕРХОВЕНСТВО ПРАВА, що відображає головний принцип діяльності органів публічної влади в демократичній правовій державі. Нижче зображено композицію з колоною – символом стійкості, непорушності й правопорядку, що завершується терезами справедливості. Канелюри колони зображено у вигляді стилізованого тризуба, в який інтегровано меч, що символізує силу закону, правди й захисту. По колу монети на матовому тлі розміщено написи СПРАВЕДЛИВІСТЬ і НЕУПЕРЕДЖЕНІСТЬ – фундаментальні принципи адміністративного судочинства. Написи розділені стилізованими декоративними елементами у формі кіл.", "desc_en": "This commemorative coin is dedicated to the 20th anniversary of the introduction of administrative justice in Ukraine – a key institution of the judiciary that ensures independent judicial oversight of public authorities and the effective protection of citizens' rights and freedoms. The adoption of the Code of Administrative Justice of Ukraine on 6 July 2005 was a turning point in the formation of the democratic legal order of the state. This normative legal act established a separate branch of justice designed to ensure fairness in the sphere of public-law relations. The commemorative coin is a symbol of gratitude to the judicial authorities, lawyers and all who contributed to the establishment and development of this important institution.\n\nThe obverse of the coin, at the top in a semicircle, bears the inscription АДМІНІСТРАТИВНЕ СУДОЧИНСТВО УКРАЇНИ, beneath which is the small State Coat of Arms of Ukraine. The central place of the composition is occupied by a stylized image of an open book, symbolizing knowledge, legality and the Code of Administrative Justice of Ukraine as the fundamental basis for the functioning of administrative justice. On the left, in a laurel wreath, is the inscription 20 / РОКІВ, emphasizing the anniversary date. At the bottom, beneath the composition – the inscription УКРАЇНА, the year of issue 2025, the denomination 5 and the hryvnia graphic symbol, as well as the logo of the National Bank of Ukraine Banknote Printing and Minting Works.\n\nThe reverse of the coin, on a mirror background, bears the inscription ВЕРХОВЕНСТВО ПРАВА, reflecting the main principle of the activities of public authorities in a democratic state governed by the rule of law. Below is a composition with a column – a symbol of stability, inviolability and law and order – topped with the scales of justice. The column's flutes are depicted as a stylized trident with an integrated sword, symbolizing the strength of law, truth and protection. Around the coin, on a matte background, are the inscriptions СПРАВЕДЛИВІСТЬ and НЕУПЕРЕДЖЕНІСТЬ – the fundamental principles of administrative justice. The inscriptions are separated by stylized decorative elements in the form of circles."}, {"id": 20, "uid": "41d3ff2a92", "name": "«Українська бавовна. БПЛА \"Vampire\"» у сувенірному пакованні (н)", "cat": "Пам'ятні монети", "img": "images/img_20.jpg", "photos": [{"src": "images/img_20.jpg", "label": "Аверс"}, {"src": "images/img_20_b.jpg", "label": "Паковання"}, {"src": "images/img_20_c.jpg", "label": "Паковання"}, {"src": "images/img_20_d.jpg", "label": "Фото 4"}], "url": "https://coins.bank.gov.ua/-ukrajinska-bavovna-bpla-vampire-u-suvenirnomu-pakovanni-n-/p-1159.html", "price": 178, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "рифлений", "yakist": "спеціальний анциркулейтед", "tyrazh": "50000", "rik": "2025", "seriya": "Збройні Сили України", "nominal": "5", "hud": "Володимир Таран, Олександр Харук, Сергій Харук", "skul": "Володимир Атаманчук, Анатолій Демяненко", "note": "", "cat_nom": "5 грн", "cat_tir": 50000, "cat_year": 2025, "name_en": "\"Ukrainian Cotton. 'Vampire' UAV\" (nickel silver) in souvenir packaging", "desc_ua": "Пам’ятна монета присвячена потужному гексакоптеру “Vampire” – символу технологічної переваги, винахідливості та сили українського спротиву. Розроблений у 2022 році багатоцільовий дрон “Vampire” зарекомендував себе як високоефективний засіб точкового ураження, дистанційного мінування та гуманітарної допомоги. Його активно використовують провідні підрозділи сектору безпеки й оборони України, а понад мільйон проведених операцій засвідчують його ефективність та бойову надійність. Ця пам’ятна монета вшановує внесок українських інженерів, розробників військових та технологічних рішень, що змінюють хід сучасної війни, посилюючи обороноздатність держави.\n\nНа аверсі монети на матовому тлі зображено понівечену поверхню землі з характерними кратерами, які відображають сліди розривів вибухових пристроїв. У лівій частині композиції розміщено шанці, що підкреслюють оборонний характер спротиву. Праворуч зображено підбитий ворожий танк, що палає, символізуючи успішне знищення ворожої техніки. Над цією динамічною картиною поля бою в польоті завис силует дрона “Vampire”. \nУ центральній частині композиції розміщено малий Державний Герб України; нижче зазначено написи: УКРАЇНА, номінал 5 та графічний знак гривні, а також рік карбування монети – 2025. Унизу по центру розміщено логотип Банкнотно-монетного двору Національного банку України.\n\nНа реверсі монети зображено гексакоптер “Vampire” у ключовий момент виконання бойового завдання – у польоті під час скидання боєприпасу. Фоном для центрального елемента слугує стилізована хмара, з якої викрешуються блискавки, що символізують міць, швидкість та невідворотність ударів, завдаваних цим безпілотником. У верхній частині монети – напис VAMPIRE.", "desc_en": "The commemorative coin is dedicated to the powerful “Vampire” hexacopter – a symbol of technological superiority, ingenuity, and the strength of Ukrainian resistance. Developed in 2022, the multi-purpose “Vampire” drone has proven itself as a highly effective means of precision strikes, remote mining, and humanitarian assistance. It is actively used by leading units of Ukraine’s security and defense sector, and more than a million operations carried out attest to its effectiveness and combat reliability. This commemorative coin honors the contribution of Ukrainian engineers, developers of military and technological solutions that are changing the course of modern warfare, strengthening the state’s defense capability.\n\nThe obverse of the coin, on a matte background, depicts the mangled surface of the earth with characteristic craters reflecting traces of explosive device detonations. In the left part of the composition are trenches, emphasizing the defensive nature of the resistance. On the right is a burning destroyed enemy tank, symbolizing the successful destruction of enemy equipment. Above this dynamic picture of the battlefield hovers the silhouette of the “Vampire” drone in flight. \nIn the central part of the composition is the small State Coat of Arms of Ukraine; below are the inscriptions: УКРАЇНА, the denomination 5 and the graphic symbol of the hryvnia, as well as the year of issue of the coin – 2025. At the bottom center is the logo of the National Bank of Ukraine Banknote Printing and Minting Works.\n\nThe reverse of the coin depicts the “Vampire” hexacopter at a key moment of carrying out a combat mission – in flight while dropping a munition. The background for the central element is a stylized cloud from which lightning bolts are struck, symbolizing the power, speed, and inevitability of the strikes delivered by this drone. In the upper part of the coin is the inscription VAMPIRE."}, {"id": 21, "uid": "4b27c485f3", "name": "«Українська бавовна. САУ \"Богдана\"» у сувенірному пакованні (н)", "cat": "Пам'ятні монети", "img": "images/img_21.jpg", "photos": [{"src": "images/img_21.jpg", "label": "Аверс"}, {"src": "images/img_21_b.jpg", "label": "Реверс"}, {"src": "images/img_21_c.jpg", "label": "Паковання"}, {"src": "images/img_21_d.jpg", "label": "Паковання"}], "url": "https://coins.bank.gov.ua/-ukrajinska-bavovna-sau-bogdana-u-suvenirnomu-pakovanni-n-/p-1156.html", "price": 176, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "рифлений", "yakist": "спеціальний анциркулейтед", "tyrazh": "50000", "rik": "2025", "seriya": "Збройні Сили України", "nominal": "5", "hud": "Володимир Таран, Олександр Харук, Сергій Харук", "skul": "Володимир Дем'яненко", "note": "", "cat_nom": "5 грн", "cat_tir": 50000, "cat_year": 2025, "name_en": "\"Ukrainian Cotton. 'Bohdana' Self-Propelled Howitzer\" (nickel silver) in souvenir packaging", "desc_ua": "Пам’ятна монета присвячена самохідній артилерійській установці “Богдана” – знаковому символу військової потужності та інженерної майстерності України. Ця 155-мм гаубиця на колісному шасі, розроблена з урахуванням передових технологічних рішень, стала ключовим елементом артилерійського потенціалу Збройних Сил України. Завдяки високоточному ураженню цілей вона демонструє стратегічну місію українського оборонно-промислового комплексу.\n\nНа аверсі монети на дзеркальному тлі зображено абрис острова Зміїний, який було успішно звільнено за підтримки САУ “Богдана”. Поблизу острова – стилізовані змії, які залишають територію, як символ відступу ворога. Угорі монети – малий Державний Герб України; ліворуч на блискавкоподібних зигзагах, що уособлюють потужність ударів артилерії, розташовані написи: УКРАЇНА (вертикально), рік карбування монети – 2025, а також номінал 5 та графічний знак гривні. Унизу по центру зазначено логотип Банкнотно-монетного двору Національного банку України.\n\nНа реверсі монети зображено самохідну артилерійську установку “Богдана” у момент бойового розгортання на степовому ландшафті, що підкреслює її мобільність та пристосованість до різних умов ведення бою. У динаміці пострілу передано міць української артилерії, а на тлі монети – силует портрета Богдана Хмельницького, що символізує незламний дух українського воїнства та історичну вісь, яка об’єднує минуле і сьогодення в боротьбі за незалежність. У нижній частині монети – напис САУ “БОГДАНА”.", "desc_en": "The commemorative coin is dedicated to the “Bohdana” self-propelled artillery unit – a landmark symbol of Ukraine's military power and engineering skill. This 155-mm wheeled howitzer, developed with advanced technological solutions, has become a key element of the artillery potential of the Armed Forces of Ukraine. Thanks to high-precision target engagement, it demonstrates the strategic mission of the Ukrainian defence-industrial complex.\n\nThe obverse of the coin on a mirror background depicts the outline of Zmiinyi (Snake) Island, which was successfully liberated with the support of the “Bohdana” self-propelled artillery units. Near the island – stylized snakes leaving the territory as a symbol of the enemy's retreat. At the top of the coin – the small State Coat of Arms of Ukraine; on the left, on lightning-like zigzags embodying the power of artillery strikes, are the inscriptions: УКРАЇНА (vertically), the year of issue of the coin – 2025, as well as the denomination 5 and the graphic sign of the hryvnia. At the bottom centre is the logo of the National Bank of Ukraine Banknote Printing and Minting Works.\n\nThe reverse of the coin depicts the “Bohdana” self-propelled artillery unit at the moment of combat deployment on a steppe landscape, emphasizing its mobility and adaptability to various combat conditions. The dynamics of the shot convey the power of Ukrainian artillery, and in the background of the coin – the silhouette of a portrait of Bohdan Khmelnytsky, symbolizing the indomitable spirit of Ukrainian warriors and the historical axis uniting the past and the present in the fight for independence. In the lower part of the coin – the inscription САУ “БОГДАНА”."}, {"id": 22, "uid": "807c54f6d5", "name": "«Розстріляне відродження. Микола Хвильовий» у сувенірному пакованні (н)", "cat": "Пам'ятні монети", "img": "images/img_22.jpg", "photos": [{"src": "images/img_22.jpg", "label": "Аверс"}, {"src": "images/img_22_b.jpg", "label": "Паковання"}, {"src": "images/img_22_c.jpg", "label": "Паковання"}, {"src": "images/img_22_d.jpg", "label": "Реверс"}], "url": "https://coins.bank.gov.ua/-rozstriljane-vidrodzhennja-mikola-hvilovij-u-suvenirnomu-pakovanni-n-/p-1153.html", "price": 177, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "рифлений", "yakist": "спеціальний анциркулейтед", "tyrazh": "50000", "rik": "2025", "seriya": "Інші монети", "nominal": "5", "hud": "Володимир Таран, Олександр Харук, Сергій Харук", "skul": "Анатолій Демяненко, Володимир Атаманчук", "note": "", "cat_nom": "5 грн", "cat_tir": 50000, "cat_year": 2025, "name_en": "\"Executed Renaissance. Mykola Khvylovy\" (nickel silver) in souvenir packaging", "desc_ua": "Пам’ятна монета присвячена літературно-мистецькому поколінню України 20-х – початку 30-х років XX століття, яке дало потужний імпульс для розвитку української культури, проте було нещадно репресоване тоталітарним режимом. Важливим культурним центром того періоду став будинок “Слово” в Харкові – осередок творчості та місце трагічних подій, де зароджувалися новаторські погляди, спалахували запеклі інтелектуальні дискусії та народжувалися нові мистецькі течії. Микола Хвильовий (справжнє прізвище Фітільов) – ключова постать культурного відродження, один із засновників української пореволюційної прози, поет і публіцист. Його діяльність сприяла утвердженню україноцентризму й інтеграції національної культури у світовий контекст. Передчасна загибель митця стала символом краху ідеалів українського націонал-комунізму та завершенням епохи українського національного відродження 1920–1930-х років. Ця пам’ятна монета розпочинає тему Розстріляного відродження, вшановуючи внесок Миколи Хвильового та всіх митців, які, попри жорсткий тиск, відважно творили та розвивали українську культуру.\n\nНа аверсі монети розміщено стилізований напис СЛОВО – назву харківського будинку літераторів 30-х років XX століття. У текстурі літер проглядається парость озимої пшениці – образ молодого покоління митців, життя і творчість яких були безжально знищені тоталітарною владою. Трагізм історичної епохи підкреслює прострелена літера “О”, з якої стікає кров, нагадуючи про болючу рану в історії України та нездійснені мрії талановитих митців. Під текстовою композицією зазначено напис УКРАЇНА, рік карбування – 20 / 25, малий Державний Герб України, номінал 5 з графічним символом гривні та логотип Банкнотно-монетного двору Національного банку України.\n\nНа реверсі монети на дзеркальному тлі зображено стилізований портрет Миколи Хвильового. Символічна композиція передає глибокий зміст: обличчя письменника ніби ув’язнене серед кам’яних плит неправильної форми, що відображають спроби тоталітарного режиму знищити пам’ять про митця. Праворуч від портрета вертикально розташовані написи: МИКОЛА / ФІТІЛЬОВ – справжнє ім’я митця, викарбуване рельєфно, та МИКОЛА / ХВИЛЬОВИЙ – псевдонім, виконаний дзеркально. Ліворуч зазначені роки життя митця – 1893 / 1933.", "desc_en": "The commemorative coin is dedicated to the literary and artistic generation of Ukraine of the 1920s and early 1930s, which gave a powerful impetus to the development of Ukrainian culture but was mercilessly repressed by the totalitarian regime. An important cultural centre of that period was the “Slovo” building in Kharkiv – a hub of creativity and a place of tragic events, where innovative views were born, fierce intellectual debates flared, and new artistic movements emerged. Mykola Khvylovy (real surname Fitilov) is a key figure of the cultural renaissance, one of the founders of Ukrainian post-revolutionary prose, a poet and publicist. His activities helped establish Ukrainocentrism and integrate national culture into the global context. The artist's premature death became a symbol of the collapse of the ideals of Ukrainian national communism and the end of the era of the Ukrainian national renaissance of the 1920s–1930s. This commemorative coin begins the Executed Renaissance theme, honouring the contribution of Mykola Khvylovy and all the artists who, despite harsh pressure, courageously created and developed Ukrainian culture.\n\nThe obverse of the coin bears the stylized inscription СЛОВО – the name of the Kharkiv writers' residence of the 1930s. Within the texture of the letters, a sprout of winter wheat can be seen – an image of the young generation of artists whose lives and work were ruthlessly destroyed by the totalitarian power. The tragedy of the historical era is underscored by the shot-through letter “О”, from which blood drips, reminding of the painful wound in the history of Ukraine and the unfulfilled dreams of talented artists. Below the text composition are the inscription УКРАЇНА, the year of issue – 20 / 25, the small State Coat of Arms of Ukraine, the denomination 5 with the graphic symbol of the hryvnia, and the logo of the National Bank of Ukraine Banknote Printing and Minting Works.\n\nThe reverse of the coin on a mirror background depicts a stylized portrait of Mykola Khvylovy. The symbolic composition conveys a deep meaning: the writer's face seems imprisoned among irregularly shaped stone slabs, reflecting the totalitarian regime's attempts to erase the memory of the artist. To the right of the portrait, the inscriptions are placed vertically: МИКОЛА / ФІТІЛЬОВ – the artist's real name, minted in relief, and МИКОЛА / ХВИЛЬОВИЙ – the pseudonym, executed in mirror image. On the left are the years of the artist's life – 1893 / 1933."}, {"id": 23, "uid": "9bad5ae0fd", "name": "«Розстріляне відродження. Юліан Шпол» у сувенірному пакованні (н)", "cat": "Пам'ятні монети", "img": "images/img_23.jpg", "photos": [{"src": "images/img_23.jpg", "label": "Аверс"}, {"src": "images/img_23_b.jpg", "label": "Паковання"}, {"src": "images/img_23_c.jpg", "label": "Паковання"}, {"src": "images/img_23_d.jpg", "label": "Аверс"}], "url": "https://coins.bank.gov.ua/-rozstriljane-vidrodzhennja-julian-shpol-u-suvenirnomu-pakovanni-n-/p-1154.html", "price": 176, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "рифлений", "yakist": "спеціальний анциркулейтед", "tyrazh": "50000", "rik": "2025", "seriya": "Інші монети", "nominal": "5", "hud": "Володимир Таран, Олександр Харук, Сергій Харук", "skul": "Анатолій Демяненко, Володимир Атаманчук", "note": "", "cat_nom": "5 грн", "cat_tir": 50000, "cat_year": 2025, "name_en": "\"Executed Renaissance. Yulian Shpol\" (nickel silver) in souvenir packaging", "desc_ua": "Пам’ятна монета присвячена поколінню українських митців 1920–1930-х років, яке стало рушієм культурних змін, розвиваючи літературу, театр, кіно, музику й образотворче мистецтво, але було безжально знищене тоталітарним режимом. Важливим культурним осередком цієї доби став будинок “Слово” в Харкові – символ творчого життя й водночас місце трагічних подій. Одним із яскравих представників Розстріляного відродження був Юліан Шпол (справжнє ім’я – Михайло Яловий) – поет, прозаїк, драматург і кіносценарист. Він належав до провідних діячів літературного процесу в Україні, очолював ВАПЛІТЕ (Вільну академію пролетарської літератури) та написав перший український формалістичний роман “Золоті лисенята” (1929). Разом із Миколою Хвильовим та іншими творчими особистостями він формував нову українську культуру, вільну від догм та обмежень. У 1933 році поет став однією з жертв режиму, а його ім’я було викреслене з української літератури на десятиліття. Ця пам’ятна монета продовжує тему Розстріляного відродження, вшановуючи внесок Юліана Шпола та всіх митців, які, попри жорсткий тиск, відважно творили та розвивали українську культуру.\n\nНа аверсі монети розміщено стилізований напис СЛОВО – назву харківського будинку літераторів 30-х років XX століття. У текстурі літер проглядається парость озимої пшениці – образ молодого покоління митців, життя і творчість яких були цинічно зламані тоталітарною владою. Трагізм історичної епохи підкреслює прострелена літера “О”, з якої стікає кров, нагадуючи про болючу рану в історії України та нездійснені мрії талановитих митців. Під текстовою композицією зазначено напис УКРАЇНА, рік карбування – 20 / 25, малий Державний Герб України, номінал 5 з графічним символом гривні та логотип Банкнотно-монетного двору Національного банку України.\n\nНа реверсі монети на дзеркальному тлі зображено стилізований портрет Юліана Шпола, побитий плямами корозії, забуття, але не втрачений остаточно. Праворуч від портрета вертикально розташовані написи: МИХАЙЛО / ЯЛОВИЙ – справжнє ім’я митця, викарбуване рельєфно, та ЮЛІАН / ШПОЛ – псевдонім, виконаний дзеркально. Ліворуч зазначені роки життя митця – 1895 / 1937.", "desc_en": "This commemorative coin is dedicated to the generation of Ukrainian artists of the 1920s–1930s, who became the driving force of cultural change by developing literature, theatre, film, music and fine arts, but were ruthlessly destroyed by the totalitarian regime. An important cultural centre of this era was the \"Slovo\" House in Kharkiv – a symbol of creative life and at the same time a place of tragic events. One of the most prominent representatives of the Executed Renaissance was Yulian Shpol (real name – Mykhailo Yalovyi) – poet, prose writer, playwright and screenwriter. He was one of the leading figures of the literary process in Ukraine, headed VAPLITE (the Free Academy of Proletarian Literature) and wrote the first Ukrainian formalist novel \"Золоті лисенята\" (1929). Together with Mykola Khvylovyi and other creative personalities, he shaped a new Ukrainian culture, free of dogmas and restrictions. In 1933, the poet became one of the victims of the regime, and his name was erased from Ukrainian literature for decades. This commemorative coin continues the theme of the Executed Renaissance, honouring the contribution of Yulian Shpol and all the artists who, despite severe pressure, courageously created and developed Ukrainian culture.\n\nThe obverse of the coin features the stylized inscription СЛОВО – the name of the Kharkiv house of writers of the 1930s. In the texture of the letters, a shoot of winter wheat can be discerned – the image of a young generation of artists whose life and work were cynically broken by the totalitarian authorities. The tragedy of the historical era is emphasized by the shot-through letter \"О\", from which blood drips, recalling the painful wound in the history of Ukraine and the unfulfilled dreams of talented artists. Beneath the text composition are the inscription УКРАЇНА, the year of issue – 20 / 25, the small State Coat of Arms of Ukraine, the denomination 5 with the hryvnia graphic symbol, and the logo of the National Bank of Ukraine Banknote Printing and Minting Works.\n\nThe reverse of the coin, on a mirror background, depicts a stylized portrait of Yulian Shpol, scarred by the stains of corrosion and oblivion, but not lost forever. To the right of the portrait are vertically arranged inscriptions: МИХАЙЛО / ЯЛОВИЙ – the artist's real name, struck in relief, and ЮЛІАН / ШПОЛ – the pseudonym, executed as a mirror image. On the left are the artist's years of life – 1895 / 1937."}, {"id": 24, "uid": "377326e6c2", "name": "«Чорнобиль. Відродження. Лось європейський» у сувенірному пакованні (н)", "cat": "Пам'ятні монети", "img": "images/img_24.jpg", "photos": [{"src": "images/img_24.jpg", "label": "Аверс"}, {"src": "images/img_24_b.jpg", "label": "Аверс"}, {"src": "images/img_24_c.jpg", "label": "Реверс"}, {"src": "images/img_24_d.jpg", "label": "Реверс"}], "url": "https://coins.bank.gov.ua/-chornobil-vidrodzhennja-los-ievropejskij-u-suvenirnomu-pakovanni-n-/p-1147.html", "price": 198, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "рифлений", "yakist": "спеціальний анциркулейтед", "tyrazh": "20000", "rik": "2025", "seriya": "Флора і фауна України", "nominal": "5", "hud": "Наталія Фандікова", "skul": "Анатолій Демяненко, Володимир Дем'яненко", "note": "", "cat_nom": "5 грн", "cat_tir": 20000, "cat_year": 2025, "name_en": "\"Chornobyl. Revival. European Elk\" (nickel silver) in souvenir packaging", "desc_ua": "Пам’ятна монета “Чорнобиль. Відродження. Лось європейський” присвячена найбільшому представнику родини оленевих в Україні – лосю європейському (Alces alces), який став символом відновлення природних екосистем Чорнобильського радіаційно-екологічного біосферного заповідника. Чорнобильський заповідник – найбільший природоохоронний об’єкт України площею 226 269,5 га. Він має ключове значення для збереження природних процесів у зонах радіаційного впливу та є притулком для багатьох рідкісних видів рослин і тварин. Лось європейський, занесений до Червоної книги України у 2017 році, уособлює силу природи, яка здатна відновлюватися навіть після найтяжчих випробувань. Його присутність у заповіднику підкреслює важливість збереження біорізноманіття та відповідального ставлення до навколишнього середовища.\n\nНа аверсі монети розміщено: малий Державний Герб України (угорі), написи: УКРАЇНА (під гербом), номінал монети – 5 / ГРИВЕНЬ (праворуч від герба); у центрі – символічне колесо життя, що знаменує відродження природи: стилізований міжнародний знак “Радіаційна загроза”, оповитий листям, навколо якого тварини, популяції яких розвиваються у 30-кілометровій зоні відчуження, що стала своєрідним резерватом для розмноження, зокрема лелеки чорного, коня Пржевальського, рисі, зубра, лося, ведмедя бурого; по колу, на дзеркальному тлі написи: ЧОРНОБИЛЬСЬКИЙ РАДІАЦІЙНО-ЕКОЛОГІЧНИЙ БІОСФЕРНИЙ ЗАПОВІДНИК (ліворуч), CHORNOBYL RADIATION AND ECOLOGICAL BIOSPHERE RESERVE; логотип Банкнотно-монетного двору Національного банку України (угорі); рік карбування – 2025 (унизу).\n\nНа реверсі монети на тлі пейзажу зображено лося європейського (елемент оздоблення – тамподрук), над яким на дзеркальному тлі написи: ЛОСЬ / ЄВРОПЕЙСЬКИЙ / ALCES ALCES; угорі – лосиця з малям.", "desc_en": "The commemorative coin “Чорнобиль. Відродження. Лось європейський” is dedicated to the largest representative of the deer family in Ukraine – the Eurasian elk (Alces alces), which has become a symbol of the restoration of the natural ecosystems of the Chornobyl Radiation and Ecological Biosphere Reserve. The Chornobyl Reserve is the largest nature conservation object in Ukraine, with an area of 226,269.5 ha. It is of key importance for preserving natural processes in radiation-affected zones and is a refuge for many rare species of plants and animals. The Eurasian elk, listed in the Red Book of Ukraine in 2017, embodies the power of nature, which is capable of recovering even after the most severe trials. Its presence in the reserve underscores the importance of preserving biodiversity and a responsible attitude toward the environment.\n\nThe obverse of the coin features: the small State Coat of Arms of Ukraine (at the top), inscriptions: УКРАЇНА (below the coat of arms), the coin's denomination – 5 / ГРИВЕНЬ (to the right of the coat of arms); in the centre – a symbolic wheel of life signifying the revival of nature: a stylized international \"Radiation Hazard\" sign entwined with leaves, around which are animals whose populations are developing in the 30-kilometre exclusion zone, which has become a kind of reserve for reproduction, in particular the black stork, Przewalski's horse, lynx, European bison, moose, brown bear; along the circle, on a mirror background, inscriptions: ЧОРНОБИЛЬСЬКИЙ РАДІАЦІЙНО-ЕКОЛОГІЧНИЙ БІОСФЕРНИЙ ЗАПОВІДНИК (left), CHORNOBYL RADIATION AND ECOLOGICAL BIOSPHERE RESERVE; the logo of the National Bank of Ukraine Banknote Printing and Minting Works (above); the year of issue – 2025 (below).\n\nThe reverse of the coin, against a landscape background, depicts a Eurasian elk (a decorative element – pad printing), above which, on a mirror background, are the inscriptions: ЛОСЬ / ЄВРОПЕЙСЬКИЙ / ALCES ALCES; above – a cow elk with a calf."}, {"id": 25, "uid": "21129c6db9", "name": "Чорнобиль. Відродження. Лось європейський (н)", "cat": "Пам'ятні монети", "img": "images/img_25.jpg", "photos": [{"src": "images/img_25.jpg", "label": "Аверс"}, {"src": "images/img_25_b.jpg", "label": "Реверс"}], "url": "https://coins.bank.gov.ua/chornobil-vidrodzhennja-los-ievropejskij-n-/p-1148.html", "price": 152, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "рифлений", "yakist": "спеціальний анциркулейтед", "tyrazh": "20000", "rik": "2025", "seriya": "Флора і фауна України", "nominal": "5", "hud": "Наталія Фандікова", "skul": "Анатолій Демяненко, Володимир Дем'яненко", "note": "", "cat_nom": "5 грн", "cat_tir": 20000, "cat_year": 2025, "name_en": "\"Chornobyl. Revival. European Elk\" (nickel silver)", "desc_ua": "Пам’ятна монета “Чорнобиль. Відродження. Лось європейський” присвячена найбільшому представнику родини оленевих в Україні – лосю європейському (Alces alces), який став символом відновлення природних екосистем Чорнобильського радіаційно-екологічного біосферного заповідника. Чорнобильський заповідник – найбільший природоохоронний об’єкт України площею 226 269,5 га. Він має ключове значення для збереження природних процесів у зонах радіаційного впливу та є притулком для багатьох рідкісних видів рослин і тварин. Лось європейський, занесений до Червоної книги України у 2017 році, уособлює силу природи, яка здатна відновлюватися навіть після найтяжчих випробувань. Його присутність у заповіднику підкреслює важливість збереження біорізноманіття та відповідального ставлення до навколишнього середовища.\n\nНа аверсі монети розміщено: малий Державний Герб України (угорі), написи: УКРАЇНА (під гербом), номінал монети – 5 / ГРИВЕНЬ (праворуч від герба); у центрі – символічне колесо життя, що знаменує відродження природи: стилізований міжнародний знак “Радіаційна загроза”, оповитий листям, навколо якого тварини, популяції яких розвиваються у 30-кілометровій зоні відчуження, що стала своєрідним резерватом для розмноження, зокрема лелеки чорного, коня Пржевальського, рисі, зубра, лося, ведмедя бурого; по колу, на дзеркальному тлі написи: ЧОРНОБИЛЬСЬКИЙ РАДІАЦІЙНО-ЕКОЛОГІЧНИЙ БІОСФЕРНИЙ ЗАПОВІДНИК (ліворуч), CHORNOBYL RADIATION AND ECOLOGICAL BIOSPHERE RESERVE; логотип Банкнотно-монетного двору Національного банку України (угорі); рік карбування – 2025 (унизу).\n\nНа реверсі монети на тлі пейзажу зображено лося європейського (елемент оздоблення – тамподрук), над яким на дзеркальному тлі написи: ЛОСЬ / ЄВРОПЕЙСЬКИЙ / ALCES ALCES; угорі – лосиця з малям.", "desc_en": "The commemorative coin “Чорнобиль. Відродження. Лось європейський” is dedicated to the largest representative of the deer family in Ukraine – the Eurasian elk (Alces alces), which has become a symbol of the restoration of the natural ecosystems of the Chornobyl Radiation and Ecological Biosphere Reserve. The Chornobyl Reserve is Ukraine’s largest nature conservation area, covering 226,269.5 hectares. It is of key importance for preserving natural processes in radiation-affected zones and is a refuge for many rare species of plants and animals. The Eurasian elk, listed in the Red Book of Ukraine in 2017, embodies the power of nature, which is capable of recovering even after the most severe trials. Its presence in the reserve underscores the importance of preserving biodiversity and a responsible attitude toward the environment.\n\nThe obverse of the coin features: the small State Coat of Arms of Ukraine (at the top), the inscriptions: УКРАЇНА (beneath the coat of arms), the denomination of the coin – 5 / ГРИВЕНЬ (to the right of the coat of arms); in the center a symbolic wheel of life marking the revival of nature: a stylized international “Radiation Hazard” sign entwined with leaves, around which are animals whose populations are developing in the 30-kilometer Exclusion Zone, which has become a kind of breeding reserve, including the black stork, Przewalski’s horse, lynx, bison, elk, and brown bear; around the circle, on a mirror background, the inscriptions: ЧОРНОБИЛЬСЬКИЙ РАДІАЦІЙНО-ЕКОЛОГІЧНИЙ БІОСФЕРНИЙ ЗАПОВІДНИК (on the left), CHORNOBYL RADIATION AND ECOLOGICAL BIOSPHERE RESERVE; the logo of the National Bank of Ukraine Banknote Printing and Minting Works (at the top); the year of issue – 2025 (at the bottom).\n\nThe reverse of the coin depicts a Eurasian elk against a landscape background (a decorative element – pad printing), above which on a mirror background are the inscriptions: ЛОСЬ / ЄВРОПЕЙСЬКИЙ / ALCES ALCES; at the top – a female elk with a calf."}, {"id": 26, "uid": "6a086aca6f", "name": "Пам'ятна медаль «Національне агентство з питань запобігання корупції» у сувенірному пакованні", "cat": "Пам'ятні медалі", "img": "images/img_26.jpg", "photos": [{"src": "images/img_26.jpg", "label": "Аверс"}, {"src": "images/img_26_b.jpg", "label": "Реверс"}, {"src": "images/img_26_c.jpg", "label": "Реверс"}, {"src": "images/img_26_d.jpg", "label": "Аверс"}], "url": "https://coins.bank.gov.ua/pam-jatna-medal-nacionalne-agentstvo-z-pitan-zapobigannja-korupciji-u-suvenirnomu-pakovanni/p-1143.html", "price": 172, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "—", "yakist": "спеціальний анциркулейтед", "tyrazh": "30000", "rik": "2025", "seriya": "—", "nominal": "—", "hud": "Дизайн аверсу – Олександра Кучинська; дизайн реверсу – Ірина Россохач", "skul": "—", "note": "Пам'ятна медаль", "cat_nom": "—", "cat_tir": 30000, "cat_year": 2025, "name_en": "Commemorative medal \"National Agency on Corruption Prevention\" in souvenir packaging", "desc_ua": "Пам’ятна медаль присвячена десятиріччю створення цього антикорупційного органу. Національне агентство з питань запобігання корупції (НАЗК) – центральний орган виконавчої влади України зі спеціальним статусом, який відповідає за формування антикорупційної політики та запобігання корупції в Україні. Орган створено в 2015 році як частину антикорупційної інфраструктури держави. Пам’ятна медаль є символом визнання важливості роботи НАЗК у сфері протидії та запобігання корупції в Україні й присвячена його досягненням за десять років роботи\n\nНа аверсі медалі в центрі композиції розміщено стилізоване дерево, яке складається з елементів мікросхеми, що символізує дані, які збирає, аналізує та адмініструє НАЗК за допомогою своїх порталів та реєстрів, а також розвиток, зростання, цифровізацію, сучасні технології та інноваційність у роботі НАЗК. Під зображенням дерева міститься напис 10 РОКІВ, що свідчить про десятиріччя з часу створення НАЗК. Навколо центральної композиції зображено: зірки, які відображають епоху активної інтеграції України з Європейським Союзом та роль НАЗК у наближенні законодавства України до міжнародних стандартів; стилізований індикатор “від темряви до світла”, що символізує динаміку зниження рівня корупції в країні та суспільстві; напис НАЦІОНАЛЬНЕ АГЕНТСТВО З ПИТАНЬ ЗАПОБІГАННЯ КОРУПЦІЇ (півколом). У верхній частині аверсу, над композицією, розміщено напис УКРАЇНА, малий Державний Герб України та рік карбування медалі – 2025. Праворуч від головної композиції зазначено логотип Банкнотно-монетного двору Національного банку України.\n\nНа реверсі медалі зображено емблему НАЗК, у центрі якої – стилізована зіниця ока, що символізує головне завдання агентства з виявлення корупційних ризиків у різних сферах функціонування держави та здійснення контролю за статками посадовців. Від облямівки до центру спрямовано двадцять білих променів, які відображають основні напрями діяльності НАЗК: формування антикорупційної політики, декларування та перевірка декларацій, моніторинг способу життя публічних службовців, запобігання конфлікту інтересів, перевірка звітів політичних партій, проведення антикорупційної експертизи проєктів законодавчих актів, аналіз корупційних ризиків у найбільш вразливих до корупції сферах, розбудова інституту викривання тощо.", "desc_en": "The commemorative medal is dedicated to the tenth anniversary of the creation of this anti-corruption body. The National Agency on Corruption Prevention (NACP) is a central executive authority of Ukraine with special status, responsible for shaping anti-corruption policy and preventing corruption in Ukraine. The agency was established in 2015 as part of the state’s anti-corruption infrastructure. The commemorative medal is a symbol of recognition of the importance of the NACP’s work in countering and preventing corruption in Ukraine and is dedicated to its achievements over ten years of work.\n\nThe obverse of the medal features at the center of the composition a stylized tree composed of microchip elements, symbolizing the data that the NACP collects, analyzes, and administers through its portals and registers, as well as the development, growth, digitalization, modern technologies, and innovation in the NACP’s work. Beneath the image of the tree is the inscription 10 РОКІВ, marking the decade since the creation of the NACP. Around the central composition are depicted: stars reflecting the era of Ukraine’s active integration with the European Union and the NACP’s role in aligning Ukrainian legislation with international standards; a stylized “from darkness to light” indicator symbolizing the dynamics of the declining level of corruption in the country and society; the inscription НАЦІОНАЛЬНЕ АГЕНТСТВО З ПИТАНЬ ЗАПОБІГАННЯ КОРУПЦІЇ (in a semicircle). In the upper part of the obverse, above the composition, are the inscription УКРАЇНА, the small State Coat of Arms of Ukraine, and the year of issue of the medal – 2025. To the right of the main composition is the logo of the National Bank of Ukraine Banknote Printing and Minting Works.\n\nThe reverse of the medal depicts the NACP emblem, at the center of which is a stylized pupil of an eye, symbolizing the agency’s main task of identifying corruption risks in various spheres of the state’s functioning and monitoring the assets of officials. Twenty white rays extend from the border to the center, reflecting the main areas of the NACP’s activity: shaping anti-corruption policy, declaration and verification of declarations, monitoring the lifestyle of public servants, preventing conflicts of interest, verifying reports of political parties, conducting anti-corruption examinations of draft legislative acts, analyzing corruption risks in the areas most vulnerable to corruption, developing the whistleblowing institute, etc."}, {"id": 27, "uid": "e70890ef83", "name": "Зодіак (c)", "cat": "Пам'ятні монети", "img": "images/img_27.jpg", "photos": [{"src": "images/img_27.jpg", "label": "Аверс"}, {"src": "images/img_27_b.jpg", "label": "Аверс"}, {"src": "images/img_27_c.jpg", "label": "Реверс"}, {"src": "images/img_27_d.jpg", "label": "Реверс"}], "url": "https://coins.bank.gov.ua/zodiak-c-/p-1141.html", "price": 5322, "qty": 1, "metal": "срібло (Ag 925)", "metal_short": "срібло", "masa": "31,1 (у чистоті)", "diametr": "38,6", "gurt": "гладкий із заглибленими написами", "yakist": "спеціальний анциркулейтед", "tyrazh": "5000", "rik": "2025", "seriya": "Знаки зодіаку", "nominal": "10", "hud": "Сагач Андрій", "skul": "Атаманчук Володимир", "note": "", "cat_nom": "10 грн", "cat_tir": 5000, "cat_year": 2025, "name_en": "\"Zodiac\" (silver)", "desc_ua": "На реверсі монети зображено мальовниче українське село під зоряним небом. Хлопчик, сидячи на невеликому пагорбі, захоплено спостерігає за сузір’ями, символізуючи мрійливість, прагнення до знань і зв’язок із рідним домом. На задньому тлі – вечірній пейзаж із хатами, садами й вітряком, що створюють атмосферу спокою та гармонії, нагадуючи про теплі моменти дитинства. На аверсі монети на дзеркальному тлі зображені зодіакальні сузір’я, об’єднані колом і розділені на дванадцять рівних секторів, астрологічні знаки і написи: ОВЕН, ТЕЛЕЦЬ, БЛИЗНЮКИ, РАК, ЛЕВ, ДІВА, ТЕРЕЗИ, СКОРПІОН, СТРІЛЕЦЬ, КОЗЕРІГ, ВОДОЛІЙ і РИБИ. Знаки зодіаку розміщені в порядку проти годинникової стрілки відповідно до руху земної осі, що символізує безперервний рух небесних тіл та циклічність часу. У центрі композиції розташовано номінал 10 та графічний символ гривні, а також напис УКРАЇНА, рік карбування монети 2025 і малий Державний Герб України, об’єднані сузір’ям.", "desc_en": "The reverse of the coin depicts a picturesque Ukrainian village under a starry sky. A boy, sitting on a small hill, watches the constellations with fascination, symbolising dreaminess, the thirst for knowledge and the connection with his native home. In the background – an evening landscape with cottages, gardens and a windmill, creating an atmosphere of calm and harmony reminiscent of warm childhood moments. The obverse features the zodiacal constellations on a mirror background, united by a circle and divided into twelve equal sectors, astrological signs and the inscriptions: ОВЕН, ТЕЛЕЦЬ, БЛИЗНЮКИ, РАК, ЛЕВ, ДІВА, ТЕРЕЗИ, СКОРПІОН, СТРІЛЕЦЬ, КОЗЕРІГ, ВОДОЛІЙ and РИБИ. The zodiac signs are arranged counter-clockwise in accordance with the movement of the earth's axis, symbolising the continuous movement of celestial bodies and the cyclicality of time. In the centre of the composition are the denomination 10 and the hryvnia graphic symbol, as well as the inscription УКРАЇНА, the year of issue 2025 and the small State Coat of Arms of Ukraine, united by a constellation."}, {"id": 28, "uid": "605aa6e374", "name": "100 років від дня народження Ігоря Шамо у сувенірному пакованні (н)", "cat": "Пам'ятні монети", "img": "images/img_28.jpg", "photos": [{"src": "images/img_28.jpg", "label": "Аверс"}, {"src": "images/img_28_b.jpg", "label": "Реверс"}, {"src": "images/img_28_c.jpg", "label": "Реверс"}, {"src": "images/img_28_d.jpg", "label": "Аверс"}], "url": "https://coins.bank.gov.ua/100-rokiv-vid-dnja-narodzhennja-igorja-shamo-u-suvenirnomu-pakovanni-n-/p-1139.html", "price": 153, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "31,0", "gurt": "рифлений", "yakist": "спеціальний анциркулейтед", "tyrazh": "50000", "rik": "2025", "seriya": "Видатні особистості України", "nominal": "2", "hud": "Таран Володимир, Харук Олександр, Харук Сергій", "skul": "Демяненко Анатолій, Атаманчук Володимир", "note": "", "cat_nom": "2 грн", "cat_tir": 50000, "cat_year": 2025, "name_en": "\"100th Anniversary of the Birth of Ihor Shamo\" (nickel silver) in souvenir packaging", "desc_ua": "На реверсі монети зображено стилізований портрет Ігоря Шамо, який розмірковує над створенням нового музичного шедевра. Під портретом розміщено нотний стан, що символізує музичну спадщину композитора. Ліворуч від портрета вертикально зазначено написи ІГОР / ШАМО та роки життя митця 1925–1982. Композицію реверсу завершують зображення та силуети листя каштанів, які підкреслюють нерозривний зв’язок маестро з Києвом. На аверсі монети зображено стилізовану композицію мальовничих краєвидів, знакових будівель та пам’ятників міста Києва, обрамлених листям каштанів – символічною візитівкою столиці. Нижче на дзеркальному тлі розміщено: нотний стан із записом музичного твору Ігоря Шамо, номінал 2 з графічним символом гривні та рік карбування – 2025. У центрі вгорі розташовано малий Державний Герб України та напис УКРАЇНА (крапки над літерою “ї” зображено у формі сердець). Унизу праворуч зазначено логотип Банкнотно-монетного двору Національного банку України.", "desc_en": "The reverse of the coin features a stylised portrait of Ihor Shamo pondering the creation of a new musical masterpiece. Below the portrait is a musical staff symbolising the composer's musical heritage. To the left of the portrait, the inscriptions ІГОР / ШАМО and the artist's years of life 1925–1982 are placed vertically. The reverse composition is completed with images and silhouettes of chestnut leaves, emphasising the maestro's inseparable bond with Kyiv. The obverse of the coin depicts a stylised composition of picturesque landscapes, landmark buildings and monuments of Kyiv, framed by chestnut leaves – the symbolic calling card of the capital. Below, on a mirror background: a musical staff with a notation of a musical work by Ihor Shamo, the denomination 2 with the hryvnia graphic symbol and the year of issue – 2025. In the centre at the top are the small State Coat of Arms of Ukraine and the inscription УКРАЇНА (the dots above the letter “ї” are shaped as hearts). At the bottom right is the logo of the National Bank of Ukraine Banknote Printing and Minting Works."}, {"id": 29, "uid": "8edfa57f65", "name": "Тримаймо стрій! у сувенірному пакованні (н)", "cat": "Пам'ятні монети", "img": "images/img_29.jpg", "photos": [{"src": "images/img_29.jpg", "label": "Аверс"}, {"src": "images/img_29_b.jpg", "label": "Фото 2"}, {"src": "images/img_29_c.jpg", "label": "Паковання"}, {"src": "images/img_29_d.jpg", "label": "Паковання"}], "url": "https://coins.bank.gov.ua/trimajmo-strij-u-suvenirnomu-pakovanni-n-/p-1140.html", "price": 176, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "рифлений", "yakist": "спеціальний анциркулейтед", "tyrazh": "50000", "rik": "2025", "seriya": "Інші монети", "nominal": "5", "hud": "Сагач Андрій", "skul": "Атаманчук Володимир, Демяненко Анатолій", "note": "", "cat_nom": "5 грн", "cat_tir": 50000, "cat_year": 2025, "name_en": "\"Let's Hold the Line!\" (nickel silver) in souvenir packaging", "desc_ua": "На реверсі монети продовжено тематику аверсу – зображені воїни, які впевнено йдуть уперед. У верхній частині монети півколом розміщено напис ТРИМАЙМО СТРІЙ та стилізовані зображення військового гелікоптера, літака і безпілотника, що уособлюють силу та міць українського війська. За спинами воїнів – надійний тил, представлений силуетами цивільних людей, які щоденно працюють, допомагають і донатять заради спільної перемоги. На аверсі монети на дзеркальному тлі зображено українських захисників, які поєднали руки в колективному рукостисканні в колі єдності. Ця композиція підкреслює згуртованість перед боєм, готовність до захисту рідної землі. На задньому тлі схематично зображено топографічну мапу місцевості з позначеними на ній лініями оборони і напрямками бойових дій, що візуально нагадують тризуб. Праворуч розміщено напис УКРАЇНА, номінал 5 та графічний символ гривні, рік карбування 2025 і малий Державний Герб України. Ліворуч зазначено логотип Банкнотно-монетного двору Національного банку України.", "desc_en": "The reverse of the coin continues the obverse theme – depicting warriors confidently marching forward. In the upper part of the coin, the inscription ТРИМАЙМО СТРІЙ is placed in a semicircle, along with stylised images of a military helicopter, an aircraft and a drone, embodying the strength and might of the Ukrainian army. Behind the warriors is a reliable home front, represented by silhouettes of civilians who work, help and donate daily for the sake of common victory. The obverse of the coin depicts Ukrainian defenders on a mirror background joining hands in a collective handshake in a circle of unity. This composition emphasises cohesion before battle and readiness to defend the native land. In the background, a topographic map of the area is schematically depicted with marked defence lines and directions of hostilities, visually reminiscent of a tryzub. To the right are the inscription УКРАЇНА, the denomination 5 and the hryvnia graphic symbol, the year of issue 2025 and the small State Coat of Arms of Ukraine. To the left is the logo of the National Bank of Ukraine Banknote Printing and Minting Works."}, {"id": 30, "uid": "a8de5364d7", "name": "Служба зовнішньої розвідки України у сувенірному пакованні (н)", "cat": "Пам'ятні монети", "img": "images/img_30.jpg", "photos": [{"src": "images/img_30.jpg", "label": "Аверс"}, {"src": "images/img_30_b.jpg", "label": "Реверс"}, {"src": "images/img_30_c.jpg", "label": "Паковання"}, {"src": "images/img_30_d.jpg", "label": "Паковання"}], "url": "https://coins.bank.gov.ua/sluzhba-zovnishnoji-rozvidki-ukrajini-u-suvenirnomu-pakovanni-n-/p-1136.html", "price": 176, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "рифлений", "yakist": "спеціальний анциркулейтед", "tyrazh": "75000", "rik": "2025", "seriya": "Інші монети", "nominal": "5", "hud": "Автор ідеї – Ладний Юрій. Художник – Бєляєв Сергій. Адаптація дизайну – Балута Тетяна", "skul": "Дем'яненко Володимир", "note": "", "cat_nom": "5 грн", "cat_tir": 75000, "cat_year": 2025, "name_en": "\"Foreign Intelligence Service of Ukraine\" (nickel silver) in souvenir packaging", "desc_ua": "На реверсі монети зображено стилізований тризуб, навколо якого цифрами зашифровані слова одного з відомих українських політичних діячів. Для кодування використано шифр Української Повстанської Армії та кодове слово, обране Службою зовнішньої розвідки України. З дня введення в обіг пам’ятної монети СЗРУ оголосить конкурс серед фахівців із дешифрування. Протягом визначеного періоду вони матимуть змогу розшифрувати закодоване послання. Текст розшифрованого повідомлення буде опубліковано в описі монети через шість місяців з дати введення її в обіг. З умовами, термінами проведення конкурсу та його результатами можна буде ознайомитися на офіційному сайті СЗРУ. На аверсі монети вгорі розміщено малий Державний Герб України. По периметру кола азбукою Морзе закодовано перші три слова назви відомства, яку продубльовано в нижній частині: СЛУЖБА ЗОВНІШНЬОЇ РОЗВІДКИ УКРАЇНИ. У центрі монети зображено хрест, який є основним елементом нової символіки та відомчих заохочувальних відзнак Служби зовнішньої розвідки України. У центрі хреста – Знак Княжої Держави Володимира Великого (тризуб), обрамлений гаслом служби латиницею: OMNIA VINCIT VERITAS (“Істина перемагає все”). Контури мапи з континентами навколо центру символізують просторовий розмах розвідувальної діяльності служби. У нижній лівій частині монети зазначено логотип Банкнотно-монетного двору Національного банку України, номінал 5 і графічний символ гривні. У правій нижній частині – напис УКРАЇНА і рік карбування 2025.", "desc_en": "The reverse of the coin depicts a stylised tryzub around which words of a famous Ukrainian political figure are encrypted in numerals. The Ukrainian Insurgent Army cipher and a code word chosen by the Foreign Intelligence Service of Ukraine were used for encoding. From the date the commemorative coin is put into circulation, the Foreign Intelligence Service of Ukraine will announce a competition among decryption specialists. During a specified period, they will have the opportunity to decipher the encoded message. The text of the decrypted message will be published in the coin's description six months after the date it is put into circulation. The terms, deadlines and results of the competition can be found on the official website of the Foreign Intelligence Service of Ukraine. The obverse of the coin features the small State Coat of Arms of Ukraine at the top. Around the perimeter of the circle, the first three words of the agency's name are encoded in Morse code, duplicated in the lower part: СЛУЖБА ЗОВНІШНЬОЇ РОЗВІДКИ УКРАЇНИ. In the centre of the coin is a cross, the main element of the new symbolism and departmental awards of the Foreign Intelligence Service of Ukraine. In the centre of the cross is the Sign of the Princely State of Volodymyr the Great (tryzub), framed by the service's motto in Latin: OMNIA VINCIT VERITAS (“Істина перемагає все”). The contours of the map with continents around the centre symbolise the spatial scope of the service's intelligence activities. In the lower left part of the coin is the logo of the National Bank of Ukraine Banknote Printing and Minting Works, the denomination 5 and the hryvnia graphic symbol. In the lower right part – the inscription УКРАЇНА and the year of issue 2025."}, {"id": 31, "uid": "9b82fb41ec", "name": "Надання статусу країни-кандидата на членство в ЄС у сувенірній упаковці (н)", "cat": "Пам'ятні монети", "img": "images/img_31.jpg", "photos": [{"src": "images/img_31.jpg", "label": "Аверс"}, {"src": "images/img_31_b.jpg", "label": "Реверс"}, {"src": "images/img_31_c.jpg", "label": "Реверс"}, {"src": "images/img_31_d.jpg", "label": "Фото 4"}], "url": "https://coins.bank.gov.ua/nadannja-statusu-krajini-kandidata-na-chlenstvo-v-ies-u-suvenirnij-upakovci-n-/p-848.html", "price": 160, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "рифлений", "yakist": "спеціальний анциркулейтед", "tyrazh": "75000", "rik": "2022", "seriya": "Інші монети", "nominal": "5", "hud": "Таран Володимир, Харук Олександр, Харук Сергій", "skul": "Дем'яненко Володимир; програмне моделювання: Лук'янов Юрій", "note": "", "cat_nom": "5 грн", "cat_tir": 75000, "cat_year": 2022, "name_en": "\"Granting Ukraine the Status of EU Membership Candidate Country\" (nickel silver) in souvenir packaging", "desc_ua": "На реверсі монети на тлі стилізованих тризубів розміщено карту України, оздоблену стилізованим національним орнаментом вишивки, обрамлену дванадцятьма зірками, що символізують народи Європи в єдності; по колу напис: НАДАННЯ СТАТУСУ КРАЇНИ-КАНДИДАТА НА ЧЛЕНСТВО В ЄС. На аверсі монети на дзеркальному тлі розміщено: стилізоване зображення європейського континенту, ліворуч від якого декоративний елемент у вигляді мозаїчного декору, що символізує різноманіття народів, культур, свободу вибору власної долі, відсутність формальних кордонів; на європейському континенті виділено контури України, яка, ніби пазл, доповнює цілісність Європи та “повертається” додому, де завжди опосередковано була присутня, починаючи з династичних зв’язків Київської держави; праворуч: малий Державний Герб України та напис УКРАЇНА (півколом); номінал – 5 та графічний символ гривні (на обох монетах); рік карбування монет – 2022 та напис – ПОВЕРНЕННЯ ДОДОМУ (унизу); логотип Банкнотно-монетного двору Національного банку України (під картою України).", "desc_en": "The reverse of the coin features, against a background of stylised tryzubs, a map of Ukraine adorned with a stylised national embroidery ornament, framed by twelve stars symbolising the peoples of Europe in unity; around the circle the inscription: НАДАННЯ СТАТУСУ КРАЇНИ-КАНДИДАТА НА ЧЛЕНСТВО В ЄС. The obverse of the coin features on a mirror background: a stylised image of the European continent, to the left of which a decorative element in the form of mosaic decor symbolising the diversity of peoples, cultures, freedom to choose one's own destiny and the absence of formal borders; on the European continent, the contours of Ukraine are highlighted, which, like a puzzle, completes the integrity of Europe and “returns” home, where it has always been indirectly present, starting with the dynastic ties of the Kyivan state; to the right: the small State Coat of Arms of Ukraine and the inscription УКРАЇНА (in a semicircle); the denomination – 5 and the hryvnia graphic symbol (on both coins); the year of issue – 2022 and the inscription – ПОВЕРНЕННЯ ДОДОМУ (at the bottom); the logo of the National Bank of Ukraine Banknote Printing and Minting Works (under the map of Ukraine)."}, {"id": 32, "uid": "5734472f1c", "name": "Новорічна іграшка (c)", "cat": "Пам'ятні монети", "img": "images/img_32.jpg", "photos": [{"src": "images/img_32.jpg", "label": "Аверс"}, {"src": "images/img_32_b.jpg", "label": "Паковання"}, {"src": "images/img_32_c.jpg", "label": "Паковання"}, {"src": "images/img_32_d.jpg", "label": "Реверс"}], "url": "https://coins.bank.gov.ua/novorichna-igrashka-c-/p-1131.html", "price": 8598, "qty": 1, "metal": "срібло (Ag 925)", "metal_short": "срібло", "masa": "31,1 (у чистоті)", "diametr": "38,6", "gurt": "гладкий із заглибленими написами", "yakist": "спеціальний анциркулейтед", "tyrazh": "7500", "rik": "2024", "seriya": "Інші монети", "nominal": "10", "hud": "Володимир Таран, Олександр Харук, Сергій Харук", "skul": "—", "note": "", "cat_nom": "10 грн", "cat_tir": 7500, "cat_year": 2024, "name_en": "\"New Year Toy\" (silver)", "desc_ua": "На аверсі монети розміщено витончений декоративний витинанковий мотив у вигляді сніжинок, які традиційно використовуються для прикрашання зимових вікон. У верхній частині монети, між сніжинками, зображено малий Державний Герб України, номінал 10 та графічний символ гривні, а також написи УКРАЇНА / 2025. На реверсі монети художньо представлено авторську різдвяну композицію із персонажами вертепу, що включає сучасні інтерпретації дійства. У центрі розташована ялинка з головним символом Різдва – “Вифлеємською зіркою” (елемент оздоблення – локальна позолота). Навколо ялинки зображені стилізовані колядники, які співають різдвяні пісні, даруючи радість і тепло кожному дому. Серед персонажів вертепу також зображено символічний образ воїна, що уособлює сучасних захисників, які прагнуть повернутися додому, зустрівши свята в колі рідних.", "desc_en": "The obverse of the coin features an exquisite decorative vytynanka motif in the form of snowflakes, traditionally used to decorate winter windows. In the upper part of the coin, between the snowflakes, are the small State Coat of Arms of Ukraine, the denomination 10 and the hryvnia graphic symbol, as well as the inscriptions УКРАЇНА / 2025. The reverse of the coin artistically presents an original Christmas composition with nativity scene characters, including modern interpretations of the performance. In the centre is a Christmas tree with the main symbol of Christmas – the “Star of Bethlehem” (a local gilding decorative element). Around the tree are stylised carolers singing Christmas songs, bringing joy and warmth to every home. Among the nativity characters is also a symbolic image of a warrior, embodying modern defenders who long to return home to celebrate the holidays with their families."}, {"id": 33, "uid": "de4a329317", "name": "Безбар’єрність у сувенірному пакованні (н)", "cat": "Пам'ятні монети", "img": "images/img_33.jpg", "photos": [{"src": "images/img_33.jpg", "label": "Аверс"}, {"src": "images/img_33_b.jpg", "label": "Паковання"}, {"src": "images/img_33_c.jpg", "label": "Реверс"}, {"src": "images/img_33_d.jpg", "label": "Реверс"}], "url": "https://coins.bank.gov.ua/bezbar-iernist-u-suvenirnomu-pakovanni-n-/p-1133.html", "price": 163, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "рифлений", "yakist": "спеціальний анциркулейтед", "tyrazh": "30000", "rik": "2024", "seriya": "Інші монети", "nominal": "5", "hud": "Дегтярьова Ольга", "skul": "Демяненко Анатолій", "note": "", "cat_nom": "5 грн", "cat_tir": 30000, "cat_year": 2024, "name_en": "\"Barrier-Free\" (nickel silver) in souvenir packaging", "desc_ua": "На реверсі монети розміщено стилізоване зображення людей різних соціальних груп, які об’єднані колом: батьки, діти, літні люди, люди, які користуються кріслом колісним, люди з протезуванням, власники тварин. Ця композиція символізує різноманіття та безбар’єрність, що підкреслює єдність та інклюзивність суспільства. На аверсі монети по центру розміщено стилізований образ птаха зі штучним механічним крилом (протезом), який символізує свободу, незламність духу та можливість долати простір без перешкод. Угорі монети зазначено номінал 5 ГРИВЕНЬ, а під композицією унизу – логотип Банкнотно-монетного двору Національного банку України і напис УКРАЇНА (півколом). Праворуч від птаха розташований малий Державний Герб України.", "desc_en": "The reverse of the coin features a stylised image of people of different social groups united by a circle: parents, children, elderly people, people using wheelchairs, people with prosthetics, pet owners. This composition symbolises diversity and barrier-freeness, emphasising the unity and inclusiveness of society. The obverse of the coin features in the centre a stylised image of a bird with an artificial mechanical wing (prosthesis), symbolising freedom, indomitable spirit and the ability to overcome space without obstacles. At the top of the coin is the denomination 5 ГРИВЕНЬ, and under the composition at the bottom – the logo of the National Bank of Ukraine Banknote Printing and Minting Works and the inscription УКРАЇНА (in a semicircle). To the right of the bird is the small State Coat of Arms of Ukraine."}, {"id": 34, "uid": "119ecc5927", "name": "Ні куля, ні шабля! у сувенірному пакованні (н)", "cat": "Пам'ятні монети", "img": "images/img_34.jpg", "photos": [{"src": "images/img_34.jpg", "label": "Аверс"}, {"src": "images/img_34_b.jpg", "label": "Реверс"}, {"src": "images/img_34_c.jpg", "label": "Аверс"}, {"src": "images/img_34_d.jpg", "label": "Реверс"}], "url": "https://coins.bank.gov.ua/ni-kulja-ni-shablja-u-suvenirnomu-pakovanni-n-/p-1128.html", "price": 161, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "рифлений", "yakist": "спеціальний анциркулейтед", "tyrazh": "75000", "rik": "2024", "seriya": "Збройні Сили України", "nominal": "5", "hud": "Володимир Таран, Олександр Харук, Сергій Харук", "skul": "Володимир Атаманчук, Анатолій Демяненко", "note": "", "cat_nom": "5 грн", "cat_tir": 75000, "cat_year": 2024, "name_en": "\"Neither Bullet nor Sabre!\" (nickel silver) in souvenir packaging", "desc_ua": "На реверсі монети на дзеркальному тлі зображено стилізований образ козака-характерника, який оберігає птаха – символ волі, що візуально нагадує тризуб. Композиція відображає зв’язок між сучасною війною та українським духом часів козаччини. На матовому тлі – зламані ворожі шаблі, що безсилі перед незламною любов’ю до рідної землі та прагненням до волі. На аверсі монети в центрі композиції зображено стилізовану постать військового, який обережно тримає в руках і захищає малий Державний Герб України – символ свободи та незалежності. Композиція символізує споконвічне прагнення українського народу жити у власній суверенній державі. На матовому тлі – ворожі кулі, що відбиваються від військового, так і не вразивши “української душі”. Під гербом написи УКРАЇНА, номінал 5, графічний символ гривні та рік карбування – 2024, ліворуч біля військового – логотип Банкнотно-монетного двору Національного банку України.", "desc_en": "The reverse of the coin depicts on a mirror background a stylised image of a Cossack kharakternyk (sorcerer-warrior) protecting a bird – a symbol of freedom that visually resembles a tryzub. The composition reflects the connection between the modern war and the Ukrainian spirit of the Cossack era. On the matte background – broken enemy sabres, powerless before the unbreakable love for the native land and the aspiration for freedom. The obverse of the coin features in the centre of the composition a stylised figure of a soldier who carefully holds in his hands and protects the small State Coat of Arms of Ukraine – a symbol of freedom and independence. The composition symbolises the age-old aspiration of the Ukrainian people to live in their own sovereign state. On the matte background – enemy bullets bouncing off the soldier, never striking the “Ukrainian soul”. Under the coat of arms are the inscriptions УКРАЇНА, the denomination 5, the hryvnia graphic symbol and the year of issue – 2024; to the left of the soldier – the logo of the National Bank of Ukraine Banknote Printing and Minting Works."}, {"id": 35, "uid": "72c3a44163", "name": "Українська бавовна. БТР-4Е «Буцефал» у сувенірному пакованні (н)", "cat": "Пам'ятні монети", "img": "images/img_35.jpg", "photos": [{"src": "images/img_35.jpg", "label": "Аверс"}, {"src": "images/img_35_b.jpg", "label": "Аверс"}, {"src": "images/img_35_c.jpg", "label": "Реверс"}, {"src": "images/img_35_d.jpg", "label": "Реверс"}], "url": "https://coins.bank.gov.ua/ukrajinska-bavovna-btr-4e-bucephal-u-suvenirnomu-pakovanni-n-/p-1125.html", "price": 163, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "рифлений", "yakist": "спеціальний анциркулейтед", "tyrazh": "75000", "rik": "2024", "seriya": "Збройні Сили України", "nominal": "5", "hud": "Таран Володимир, Харук Олександр, Харук Сергій", "skul": "Атаманчук Володимир, Дем'яненко Володимир", "note": "", "cat_nom": "5 грн", "cat_tir": 75000, "cat_year": 2024, "name_en": "\"Ukrainian Cotton. BTR-4E 'Bucephalus'\" (nickel silver) in souvenir packaging", "desc_ua": "На реверсі монети зображено сучасний український бронетранспортер під час ведення вогню з бойового модуля, що є на озброєнні БТР-4. Угорі напис БТР-4, виконаний у стилі аверсу монети, де склепані пластини утворюють літери і цифру. На аверсі монети на дзеркальному тлі стилізовано зображено здибленого коня, змодельованого з броньованих пластин, склепаних між собою. Образ коня створює асоціативну паралель з легендарним Буцефалом Олександра Македонського, символізує вірність, нестримну волю та безстрашність перед ворогом. Праворуч на матовому тлі розташовано малий Державний Герб України, під ним напис УКРАЇНА, номінал монети 5 та графічний знак гривні, рік карбування монети – 2024. Унизу по центру – логотип Банкнотномонетного двору Національного банку України.", "desc_en": "The reverse of the coin depicts a modern Ukrainian armoured personnel carrier firing from the combat module mounted on the BTR-4. At the top is the inscription БТР-4, executed in the style of the coin's obverse, where riveted plates form the letters and numeral. The obverse of the coin features on a mirror background a stylised rearing horse modelled from armoured plates riveted together. The image of the horse creates an associative parallel with the legendary Bucephalus of Alexander the Great, symbolising loyalty, unbridled will and fearlessness before the enemy. To the right on the matte background is the small State Coat of Arms of Ukraine, under it the inscription УКРАЇНА, the coin denomination 5 and the hryvnia graphic sign, the year of issue – 2024. At the bottom centre – the logo of the National Bank of Ukraine Banknote Printing and Minting Works."}, {"id": 36, "uid": "0df310307f", "name": "Рік Змії у сувенірному пакованні (н)", "cat": "Пам'ятні монети", "img": "images/img_36.jpg", "photos": [{"src": "images/img_36.jpg", "label": "Аверс"}, {"src": "images/img_36_b.jpg", "label": "Фото 2"}, {"src": "images/img_36_c.jpg", "label": "Реверс"}, {"src": "images/img_36_d.jpg", "label": "Реверс"}], "url": "https://coins.bank.gov.ua/rik-zmiji-u-suvenirnomu-pakovanni-n-/p-1124.html", "price": 161, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "рифлений", "yakist": "спеціальний анциркулейтед", "tyrazh": "80000", "rik": "2024", "seriya": "Східний календар", "nominal": "5", "hud": "Куц Марина", "skul": "Демяненко Анатолій", "note": "", "cat_nom": "5 грн", "cat_tir": 80000, "cat_year": 2024, "name_en": "\"Year of the Snake\" (nickel silver) in souvenir packaging", "desc_ua": "На реверсі монети в центрі композиції зображено символ східного календаря 2025 року – загадкову змію, що додатково означає небезпеку для ворога. Образ закомпонований у шестикутник, що виражає динаміку та внутрішню силу, а в поєднанні з агресивним зображенням голови – ворожість та непередбачуваність для нападника. Хвіст змії химерно закручений та нагадує шаблю, що символізує готовність до боро
