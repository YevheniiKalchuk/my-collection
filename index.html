pergerojiv-djakuiemo-volonteram-n-/p-1075.html", "price": 98, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "рифлений", "yakist": "спеціальний анциркулейтед", "tyrazh": "50000", "rik": "2023", "seriya": "Безсмертна моя Україно", "nominal": "5", "hud": "Резніков Олександр", "skul": "Атаманчук Володимир, Дем'яненко Володимир", "note": "", "cat_nom": "5 грн", "cat_tir": 50000, "cat_year": 2023, "name_en": "\"Country of Superheroes. Thank You, Volunteers!\" (nickel silver)", "desc_ua": "Пам`ятна монета присвячена українським волонтерам. Вони донатять, організовують збори коштів, здобувають і доставляють техніку, спорядження, продукти, ліки, шукають і знаходять шляхи для вирішення найнагальніших потреб захисників та захисниць України. Своєю залученістю, турботою, наполегливістю і просто щирою посмішкою вони посилюють наше військо, допомагають чинити гідний опір ворогу. Натхненні серця, що не знають втоми, справжні супергерої – волонтери.\n\nНа аверсі монети розміщено: у центрі на дзеркальному тлі – стилізоване зображення рук під час плетіння маскувальної сітки, що символічно розкриває волонтерство як одну з багатьох форм допомоги, всебічної підтримки та є втіленням сили і єдності нації в часи надважких випробувань; угорі – малий Державний Герб України; написи півколом: рік карбування монети 2023, УКРАЇНА (унизу ліворуч), П’ЯТЬ ГРИВЕНЬ (унизу праворуч); логотип Банкнотно-монетного двору Національного банку України.\n\nНа реверсі монети розміщено стилізовану карту України у вигляді маскувальної сітки як символу об’єднаної країни, що “переплетена” та згуртована задля досягнення спільної мети – Перемоги.", "desc_en": "This commemorative coin is dedicated to Ukrainian volunteers. They donate, organize fundraisers, procure and deliver equipment, gear, food, medicine, and find ways to meet the most urgent needs of Ukraine's male and female defenders. Through their involvement, care, perseverance and simply a sincere smile, they strengthen our army and help put up a worthy resistance to the enemy. Inspired hearts that know no fatigue, true superheroes – the volunteers.\n\nThe obverse of the coin features: in the centre, on a mirror background – a stylized image of hands weaving a camouflage net, which symbolically reveals volunteering as one of many forms of aid, comprehensive support, and embodies the strength and unity of the nation in times of extremely difficult trials; at the top – the small State Coat of Arms of Ukraine; inscriptions in a semicircle: the coin's year of issue 2023, УКРАЇНА (below left), П’ЯТЬ ГРИВЕНЬ (below right); the logo of the National Bank of Ukraine Banknote Printing and Minting Works.\n\nThe reverse of the coin features a stylized map of Ukraine in the form of a camouflage net as a symbol of a united country that is \"interwoven\" and rallied to achieve a common goal – Victory."}, {"id": 60, "uid": "5777093462", "name": "Українська мова у сувенірному пакованні (н)", "cat": "Пам'ятні монети", "img": "images/img_60.jpg", "photos": [{"src": "images/img_60.jpg", "label": "Аверс"}, {"src": "images/img_60_b.jpg", "label": "Фото 2"}, {"src": "images/img_60_c.jpg", "label": "Реверс"}, {"src": "images/img_60_d.jpg", "label": "Фото 4"}], "url": "https://coins.bank.gov.ua/ukrajinska-mova-u-suvenirnomu-pakovanni-n-/p-1073.html", "price": 135, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "рифлений", "yakist": "спеціальний анциркулейтед", "tyrazh": "75000", "rik": "2023", "seriya": "Духовні скарби України", "nominal": "5", "hud": "Таран Володимир, Харук Олександр, Харук Сергій", "skul": "Дем'яненко Володимир", "note": "", "cat_nom": "5 грн", "cat_tir": 75000, "cat_year": 2023, "name_en": "\"The Ukrainian Language\" (nickel silver) in souvenir packaging", "desc_ua": "Пам`ятна монета присвячена українській мові. Мова – не лише засіб спілкування, але й носій багатої культурної спадщини, це частина нашого генетичного коду. Саме мова в надскладний момент історії України стала фундаментом нашого єднання, нашою зброєю. Сьогодні українською мовою промовляє дух свободи, який вражає весь світ.\n\nНа аверсі монети розміщено: стилізовану літеру Ї із соловейком, що символізує мелодійність та співучість української мови, у центрі літери – малий Державний Герб України; на дзеркальному тлі монети розміщено текстуру із контурів літер української абетки, що асоціативно нагадує гніздо, яке є символом дому та оберегом родини; унизу – напис УКРАЇНА, номінал монети 5 та графічний знак гривні, рік карбування монети – 2023 та логотип Банкнотно-монетного двору Національного банку України.\n\nНа реверсі монети розміщено стилізовану композицію, що складається з літер української абетки; у композиції виділені літери Ґ, Ї, Є, І, що вирізняють українську мову фонетично і графічно серед культур, що послуговуються кирилицею. Серед фактурних літер композиції вирізняються літери У, К, Р, А, Ї, Н, И, що в поєднанні зі словами НАША МОВА утворюють вислів “наша мова України”. Елементи композиції реверсу підкреслюють інтеграцію мови в сучасні гаджети, цифрові пристрої, інформаційні мережі.", "desc_en": "This commemorative coin is dedicated to the Ukrainian language. Language is not only a means of communication, but also a carrier of rich cultural heritage; it is part of our genetic code. It was language, in the most difficult moment of Ukraine's history, that became the foundation of our unity, our weapon. Today, the spirit of freedom, which amazes the whole world, speaks in Ukrainian.\n\nThe obverse of the coin features: a stylized letter Ї with a nightingale, symbolizing the melodiousness and musicality of the Ukrainian language, with the small State Coat of Arms of Ukraine in the centre of the letter; on the mirror background of the coin – a texture of the outlines of the letters of the Ukrainian alphabet, which associatively recalls a nest, a symbol of home and a family talisman; below – the inscription УКРАЇНА, the coin's denomination 5 and the hryvnia graphic sign, the coin's year of issue – 2023, and the logo of the National Bank of Ukraine Banknote Printing and Minting Works.\n\nThe reverse of the coin features a stylized composition consisting of letters of the Ukrainian alphabet; in the composition, the letters Ґ, Ї, Є, І are highlighted, which distinguish the Ukrainian language phonetically and graphically among cultures that use the Cyrillic script. Among the textured letters of the composition, the letters У, К, Р, А, Ї, Н, И stand out, which together with the words НАША МОВА form the phrase “наша мова України”. The elements of the reverse composition emphasize the integration of language into modern gadgets, digital devices, information networks."}, {"id": 61, "uid": "1c704660f0", "name": "Пам`ятна медаль «Сержантський корпус»", "cat": "Пам'ятні медалі", "img": "images/img_61.jpg", "photos": [{"src": "images/img_61.jpg", "label": "Аверс"}, {"src": "images/img_61_b.jpg", "label": "Реверс"}], "url": "https://coins.bank.gov.ua/pam-jatna-medal-serzhantskij-korpus-/p-1071.html", "price": 75, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "гладкий", "yakist": "спеціальний анциркулейтед", "tyrazh": "65000", "rik": "2023", "seriya": "—", "nominal": "—", "hud": "Косинський Олександр (автор ідеї), Руденко Олексій (автор ескізу); Балута Тетяна, Кучинська Олександра (дизайн)", "skul": "Дем'яненко Володимир", "note": "Пам'ятна медаль", "cat_nom": "—", "cat_tir": 65000, "cat_year": 2023, "name_en": "Commemorative medal \"Sergeant Corps\"", "desc_ua": "Пам’ятна медаль присвячена сержантському і старшинському складу Збройних Сил України, який засвідчив свою ефективність та важливість протягом російсько-української війни, що триває з 2014 року, був і є одним із факторів успішних дій українського війська з надання відсічі окупаційним силам російської федерації з початку повномасштабного вторгнення 24 лютого 2022 року й дотепер, відзначення їх подвигу та героїзму.\n\nНа аверсі медалі: на дзеркальному тлі розміщено гасло сержантів і старшин Збройних Сил України СЛІДУЙ ЗА МНОЮ! РОБИ ЯК Я!, в центрі зображено українського сержанта-лідера, який веде за собою солдатів у бій, угорі – малий Державний Герб України та напис УКРАЇНА, рік карбування 2023, логотип Банкнотно-монетного двору Національного банку України (ліворуч від зображення сержанта).\n\nНа реверсі медалі розміщено написи: СЕРЖАНТСЬКИЙ КОРПУС ЗБРОЙНИХ СИЛ УКРАЇНИ, девіз сержантського і старшинського складу Збройних Сил України – ЧЕСТЬ, ВІДДАНІСТЬ, ВІДПОВІДАЛЬНІСТЬ, ПРОФЕСІОНАЛІЗМ (по колу), у центрі на дзеркальному тлі зображено символіку Сержантського корпусу Збройних Сил України та стилізований тризуб, що використовується Збройними Силами України.", "desc_en": "The commemorative medal is dedicated to the sergeant and senior enlisted corps of the Armed Forces of Ukraine, which proved its effectiveness and importance during the ongoing Russo-Ukrainian war since 2014, has been and remains one of the factors in the successful actions of the Ukrainian military in repelling the occupation forces of the Russian Federation from the beginning of the full-scale invasion on 24 February 2022 to this day, and to honoring their feats and heroism.\n\nThe obverse of the medal: on a mirror background is the motto of the sergeants and senior enlisted personnel of the Armed Forces of Ukraine СЛІДУЙ ЗА МНОЮ! РОБИ ЯК Я!, in the center is a Ukrainian sergeant-leader leading soldiers into battle, at the top are the small State Coat of Arms of Ukraine and the inscription УКРАЇНА, the year of issue 2023, the logo of the National Bank of Ukraine Banknote Printing and Minting Works (to the left of the sergeant’s image).\n\nThe reverse of the medal features the inscriptions: СЕРЖАНТСЬКИЙ КОРПУС ЗБРОЙНИХ СИЛ УКРАЇНИ, the motto of the sergeant and senior enlisted corps of the Armed Forces of Ukraine – ЧЕСТЬ, ВІДДАНІСТЬ, ВІДПОВІДАЛЬНІСТЬ, ПРОФЕСІОНАЛІЗМ (in a circle), and in the center, on a mirror background, the insignia of the Sergeant Corps of the Armed Forces of Ukraine and a stylized tryzub used by the Armed Forces of Ukraine."}, {"id": 62, "uid": "4280ef8a7f", "name": "Рік Дракона у сувенірному пакованні (н)", "cat": "Пам'ятні монети", "img": "images/img_62.jpg", "photos": [{"src": "images/img_62.jpg", "label": "Аверс"}, {"src": "images/img_62_b.jpg", "label": "Паковання"}, {"src": "images/img_62_c.jpg", "label": "Паковання"}, {"src": "images/img_62_d.jpg", "label": "Реверс"}], "url": "https://coins.bank.gov.ua/rik-drakona-u-suvenirnomu-pakovanni-n-/p-1072.html", "price": 131, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "рифлений", "yakist": "спеціальний анциркулейтед", "tyrazh": "80000", "rik": "2023", "seriya": "Східний календар", "nominal": "5", "hud": "Куц Марина", "skul": "Дем'яненко Володимир", "note": "", "cat_nom": "5 грн", "cat_tir": 80000, "cat_year": 2023, "name_en": "\"Year of the Dragon\" (nickel silver) in souvenir packaging", "desc_ua": "Присвячена одній із тварин дванадцятирічного східного календаря.\n\nНа аверсі монети розміщено: угорі – малий Державний Герб України, праворуч від якого напис півколом УКРАЇНА; на дзеркальному тлі по колу зображені 12 символів східного календаря, у центрі кола – стилізований годинник зі стрілкою, що вказує на дракона – символ року, під стрілкою – 2024; унизу ліворуч напис півколом 5 ГРИВЕНЬ; на матовому тлі зображені стилізовані під українську витинанку символи кожної пори року: сніжинка (угорі), квітка (праворуч), ягода (унизу), листок (ліворуч); логотип Банкнотно-монетного двору Національного банку України (праворуч над символом тигра).\n\nНа реверсі монети зображено стилізований символ східного календаря 2024 року – дракона, закомпонованого в трикутник, що є символом чоловічого начала та стихії вогню; праворуч на драконі – шеврон Збройних Сил України як символ мужності та сили українських захисників. Дракона оточують по колу стилізовані символи, притаманні кожній порі року: сніжинки (угорі праворуч), квітки (унизу праворуч), плоди (унизу ліворуч), гілки (угорі ліворуч).", "desc_en": "Dedicated to one of the animals of the twelve-year Eastern calendar.\n\nThe obverse of the coin features: at the top the small State Coat of Arms of Ukraine, to the right of which is the inscription in a semicircle УКРАЇНА; on a mirror background around the circle are the 12 symbols of the Eastern calendar, at the center of the circle a stylized clock with a hand pointing to the dragon – the symbol of the year, beneath the hand – 2024; at the bottom left the inscription in a semicircle 5 ГРИВЕНЬ; on a matte background, symbols of each season stylized as Ukrainian vytynanka: a snowflake (at the top), a flower (on the right), a berry (at the bottom), a leaf (on the left); the logo of the National Bank of Ukraine Banknote Printing and Minting Works (to the right above the symbol of the tiger).\n\nThe reverse of the coin depicts the stylized symbol of the 2024 Eastern calendar – a dragon composed within a triangle, which is a symbol of the masculine principle and the element of fire; on the right of the dragon is the chevron of the Armed Forces of Ukraine as a symbol of the courage and strength of Ukrainian defenders. The dragon is surrounded around the circle by stylized symbols characteristic of each season: snowflakes (at the top right), flowers (at the bottom right), fruits (at the bottom left), branches (at the top left)."}, {"id": 63, "uid": "2892a8d284", "name": "Захисниці у сувенірній упаковці (н)", "cat": "Пам'ятні монети", "img": "images/img_63.jpg", "photos": [{"src": "images/img_63.jpg", "label": "Аверс"}, {"src": "images/img_63_b.jpg", "label": "Реверс"}, {"src": "images/img_63_c.jpg", "label": "Реверс"}, {"src": "images/img_63_d.jpg", "label": "Аверс"}], "url": "https://coins.bank.gov.ua/zahisnici-u-suvenirnij-upakovci-n-/p-1060.html", "price": 135, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "рифлений", "yakist": "спеціальний анциркулейтед", "tyrazh": "50000", "rik": "2023", "seriya": "Безсмертна моя Україно", "nominal": "5", "hud": "Куц Марина", "skul": "Демяненко Анатолій", "note": "", "cat_nom": "5 грн", "cat_tir": 50000, "cat_year": 2023, "name_en": "\"Women Defenders\" (nickel silver) in souvenir packaging", "desc_ua": "Пам’ятна монета присвячена українським жінкам. Вони руйнують стереотипи, тримають оборону на фронті та в тилу: воюють, працюють, годують, волонтерять, моляться, чекають, кохають та захищають наші родини, свою Батьківщину, наближаючи всіх нас до Перемоги.\n\nНа аверсі монети на дзеркальному тлі розміщено: символічну композицію, що демонструє відважність та волелюбність, щирість та водночас ніжність, дбайливість українських жінок, втілених в образах матері та захисниці, які під час війни взяли на себе величезну відповідальність – бути на захисті Батьківщини та водночас залишатися дружиною, господинею і матір’ю (у центрі); угорі напис УКРАЇНА (півколом), ліворуч від якого зображено логотип Банкнотно-монетного двору Національного банку України, оздоблений стилізованими орнаментами української вишивки, номінал – 5 та графічний символ гривні; праворуч – малий Державний Герб України, оздоблений стилізованими орнаментами української вишивки, та рік карбування монети 2023.\n\nНа реверсі монети на дзеркальному тлі розміщено композицію, що символізує жіночність українок-захисниць: ліворуч стилізовані хвилі жіночого волосся, заплетеного у косу, як символ накопичення життєвої сили, необхідної для здоров’я і духовного розвитку; праворуч зображено абриси жіночої фігури в плахті як символ жіночої ініціації (елемент оздоблення – тамподрук).", "desc_en": "The commemorative coin is dedicated to Ukrainian women. They break stereotypes, hold the defence at the front and in the rear: they fight, work, feed, volunteer, pray, wait, love, and protect our families, their Homeland, bringing all of us closer to Victory.\n\nThe obverse of the coin on a mirror background features: a symbolic composition demonstrating the courage and freedom-loving spirit, sincerity and at the same time tenderness and care of Ukrainian women, embodied in the images of mother and defender, who during the war took on huge responsibility – to defend the Homeland and at the same time remain wife, housekeeper, and mother (in the centre); at the top the inscription УКРАЇНА (in a semicircle), to the left of which is the logo of the National Bank of Ukraine Banknote Printing and Minting Works, decorated with stylized ornaments of Ukrainian embroidery, the denomination – 5 and the graphic symbol of the hryvnia; to the right – the small State Coat of Arms of Ukraine, decorated with stylized ornaments of Ukrainian embroidery, and the year of issue of the coin 2023.\n\nThe reverse of the coin on a mirror background features a composition symbolizing the femininity of Ukrainian women-defenders: on the left, stylized waves of women's hair braided into a plait, as a symbol of the accumulation of vital energy necessary for health and spiritual development; on the right, the outlines of a female figure in a plakhta as a symbol of female initiation (decoration element – pad printing)."}, {"id": 64, "uid": "398d0c4a40", "name": "100 років Національному науковому центру «Інститут судових експертиз ім. Засл. проф. М. С. Бокаріуса» (н)", "cat": "Пам'ятні монети", "img": "images/img_64.jpg", "photos": [{"src": "images/img_64.jpg", "label": "Аверс"}, {"src": "images/img_64_b.jpg", "label": "Реверс"}], "url": "https://coins.bank.gov.ua/100-rokiv-nacionalnomu-naukovomu-centru-institut-sudovih-ekspertiz-im-zasl-proph-m-s-bokariusa-n-/p-1059.html", "price": 98, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "рифлений", "yakist": "спеціальний анциркулейтед", "tyrazh": "30000", "rik": "2023", "seriya": "Інші монети", "nominal": "5", "hud": "Автори дизайну: Балута Тетяна, Іваненко Святослав", "skul": "Атаманчук Володимир", "note": "", "cat_nom": "5 грн", "cat_tir": 30000, "cat_year": 2023, "name_en": "\"100th Anniversary of the National Scientific Center 'Hon. Prof. M. S. Bokarius Institute of Forensic Examinations'\" (nickel silver)", "desc_ua": "Пам’ятна монета присвячена одній з найстаріших державних експертних установ України, що розпочала свою діяльність у 1923 році як Кабінет науково-судової експертизи, – Національному науковому центру “Інститут судових експертиз ім. Засл. проф. М. С. Бокаріуса”. Зараз цей науковий і дослідницький центр виконує надзвичайно важливу місію у сфері забезпечення правосуддя в державі та здійснює вагомий внесок у розвиток наукових досліджень та експертизи. Зокрема, працюючи над збиранням доказів злочинів, заподіяних країною-агресором проти українського цивільного населення, а саме експертизою зруйнованих об’єктів, встановленням розміру збитків, генетичними дослідженнями тощо, він забезпечує свою частку в нашу спільну Перемогу.\n\nНа аверсі монети розміщено: малий Державний Герб України, написи: УКРАЇНА та рік карбування монети 2023 (угорі); ліворуч – зображення у вигляді відбитка пальця і бінарного коду навколо нього, що символізує цифрову обробку інформації та пошуку даних під час проведення судово-медичних досліджень, унизу під ним – логотип Банкнотно-монетного двору Національного банку України та напис СУМЛІННЕ СЛУЖІННЯ ІСТИНІ; праворуч зображено портрет М. С. Бокаріуса – одного із засновників судової медицини і криміналістики в нашій країні, унизу під яким – номінал монети 5 та графічний символ гривні.\n\nНа реверсі монети розміщено логотип установи, написи: НАЦІОНАЛЬНИЙ НАУКОВИЙ ЦЕНТР / ІНСТИТУТ СУДОВИХ ЕКСПЕРТИЗ (по колу), ІМ. ЗАСЛ. ПРОФ. / М. С. БОКАРІУСА, 100 / РОКІВ / ЗАСНУВАННЯ (у центрі праворуч).", "desc_en": "This commemorative coin is dedicated to one of the oldest state expert institutions of Ukraine, which began its activity in 1923 as the Office of Scientific Forensic Examination – the National Scientific Centre “Hon. Prof. M. S. Bokarius Institute of Forensic Examination”. Today, this scientific and research centre performs an extremely important mission in the sphere of ensuring justice in the state and makes a significant contribution to the development of scientific research and expertise. In particular, working on collecting evidence of crimes committed by the aggressor country against the Ukrainian civilian population – namely, the examination of destroyed facilities, determining the extent of damage, genetic research, etc. – it ensures its share in our common Victory.\n\nThe obverse of the coin features: the small State Coat of Arms of Ukraine, inscriptions: УКРАЇНА and the coin's year of issue 2023 (at the top); on the left – an image in the form of a fingerprint and a binary code around it, symbolizing digital information processing and data search during forensic medical research, beneath it – the logo of the National Bank of Ukraine Banknote Printing and Minting Works and the inscription СУМЛІННЕ СЛУЖІННЯ ІСТИНІ; on the right is a portrait of M. S. Bokarius – one of the founders of forensic medicine and criminalistics in our country, beneath which – the coin's denomination 5 and the hryvnia graphic symbol.\n\nThe reverse of the coin features the institution's logo, inscriptions: НАЦІОНАЛЬНИЙ НАУКОВИЙ ЦЕНТР / ІНСТИТУТ СУДОВИХ ЕКСПЕРТИЗ (along the circle), ІМ. ЗАСЛ. ПРОФ. / М. С. БОКАРІУСА, 100 / РОКІВ / ЗАСНУВАННЯ (in the centre, right)."}, {"id": 65, "uid": "15eb3de79e", "name": "Український борщ у сувенірній упаковці (н)", "cat": "Пам'ятні монети", "img": "images/img_65.jpg", "photos": [{"src": "images/img_65.jpg", "label": "Аверс"}, {"src": "images/img_65_b.jpg", "label": "Реверс"}, {"src": "images/img_65_c.jpg", "label": "Реверс"}, {"src": "images/img_65_d.jpg", "label": "Аверс"}], "url": "https://coins.bank.gov.ua/ukrajinskij-borsch-u-suvenirnij-upakovci-n-/p-1063.html", "price": 162, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "рифлений", "yakist": "спеціальний анциркулейтед", "tyrazh": "75000", "rik": "2023", "seriya": "Українська спадщина", "nominal": "5", "hud": "Кочубей Миколай", "skul": "Атаманчук Володимир", "note": "", "cat_nom": "5 грн", "cat_tir": 75000, "cat_year": 2023, "name_en": "\"Ukrainian Borscht\" (nickel silver) in souvenir packaging", "desc_ua": "Світ наповнений кулінарними шедеврами, та самобутньою стравою, що найповніше передає смак і багатовікову культуру України, є український борщ. Для українців борщ – це більше, ніж просто страва. З плином часу український борщ отримав визнання в усьому світі, ставши символом української кухні і втіленням української традиції. Борщ шанують усюди, а рецепт приготування передають із покоління в покоління.  \nУ 2022 році ЮНЕСКО внесла український борщ до переліку об’єктів нематеріальної культурної спадщини, яка потребує охорони, що покликано поширювати знання про культурні та гастрономічні традиції України по всьому світу.\n\nНа аверсі монети розміщено: угорі малий Державний Герб України, ліворуч і праворуч від якого написи півколом:  УКРАЇНА, рік карбування монети – 2023; номінал монети – 5/ГРИВЕНЬ; унизу – логотип Банкнотно-монетного двору Національного банку України; у центрі зображено господиню під час приготування українського борщу на тлі печі, що символізує неперервність життя народу, тепло, затишок, добробут, родинне щастя, оздоблену орнаментом за трипільським мотивом, який уособлює вікову історію і традицію приготування борщу.\n\nНа реверсі монет розміщено стилізовану композицію, що наповнена традиційним українським колоритом та побутом: у центрі зображено тарілку з борщем, що неначе “бурхливе озеро” символізує глибинну українську культуру і традиції, напис – БОРЩ (елемент оздоблення – тамподрук).", "desc_en": "The world is full of culinary masterpieces, but the distinctive dish that most fully conveys the taste and centuries-old culture of Ukraine is Ukrainian borshch. For Ukrainians, borshch is more than just a dish. Over time, Ukrainian borshch has gained recognition all over the world, becoming a symbol of Ukrainian cuisine and the embodiment of Ukrainian tradition. Borshch is revered everywhere, and its recipe is passed down from generation to generation.\nIn 2022, UNESCO inscribed Ukrainian borshch on the list of intangible cultural heritage in need of safeguarding, which is intended to spread knowledge about Ukraine’s cultural and gastronomic traditions throughout the world.\n\nThe obverse of the coin features: at the top the small State Coat of Arms of Ukraine, to the left and right of which are the inscriptions in a semicircle: УКРАЇНА, the year of issue of the coin – 2023; the denomination of the coin – 5/ГРИВЕНЬ; at the bottom the logo of the National Bank of Ukraine Banknote Printing and Minting Works; in the center is a housewife preparing Ukrainian borshch against the background of a stove, symbolizing the continuity of the people’s life, warmth, coziness, prosperity, family happiness, adorned with an ornament based on the Trypillian motif, which embodies the centuries-old history and tradition of borshch cooking.\n\nThe reverse of the coin features a stylized composition filled with traditional Ukrainian color and everyday life: in the center is a plate of borshch, which, like a “turbulent lake”, symbolizes the deep Ukrainian culture and traditions, the inscription – БОРЩ (a decorative element – pad printing)."}, {"id": 66, "uid": "4a6b4a4901", "name": "Воєнна розвідка України (н)", "cat": "Пам'ятні монети", "img": "images/img_66.jpg", "photos": [{"src": "images/img_66.jpg", "label": "Аверс"}, {"src": "images/img_66_b.jpg", "label": "Реверс"}], "url": "https://coins.bank.gov.ua/voienna-rozvidka-ukrajini-n-/p-1037.html", "price": 98, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "рифлений", "yakist": "спеціальний анциркулейтед", "tyrazh": "75000", "rik": "2023", "seriya": "Інші монети", "nominal": "5", "hud": "Дизайн – Балута Тетяна", "skul": "Дем'яненко Володимир", "note": "", "cat_nom": "5 грн", "cat_tir": 75000, "cat_year": 2023, "name_en": "\"Military Intelligence of Ukraine\" (nickel silver)", "desc_ua": "Присвячена воєнній розвідці України – високотехнологічній та високоінтелектуальній складовій сил безпеки і оборони України, яка надійно стоїть на захисті національних інтересів нашої держави.\n\nНа аверсі монети розміщено: у центрі на матовому тлі – емблема Головного управління розвідки Міністерства оборони України, ліворуч від неї – малий Державний Герб України; праворуч – номінал 5 та графічний символ гривні; написи: УКРАЇНА (півколом угорі), 2023/ГОЛОВНЕ УПРАВЛІННЯ РОЗВІДКИ (унизу); логотип Банкнотно-монетного двору Національного банку України (ліворуч від емблеми).\n\nНа реверсі монети розміщено: по колу написи: ВОЄННА РОЗВІДКА УКРАЇНИ та гасло воєнних розвідників латиницею SAPIENS DOMINABITUR ASTRIS (“Мудрий пануватиме над зірками”); у центрі – стилізовану композицію: на тлі поверхні земної кулі зображена сова, яка тримає меч (на його ефесі зображено малий Державний Герб України), що пронизує абриси території країни-агресора.", "desc_en": "Dedicated to the military intelligence of Ukraine – a high-tech and highly intellectual component of Ukraine's security and defence forces, which reliably protects the national interests of our state.\n\nThe obverse of the coin features: in the centre on a matte background – the emblem of the Defence Intelligence of the Ministry of Defence of Ukraine, to the left of it – the small State Coat of Arms of Ukraine; to the right – the denomination 5 and the graphic symbol of the hryvnia; the inscriptions: УКРАЇНА (in a semicircle at the top), 2023/ГОЛОВНЕ УПРАВЛІННЯ РОЗВІДКИ (at the bottom); the logo of the National Bank of Ukraine Banknote Printing and Minting Works (to the left of the emblem).\n\nThe reverse of the coin features: around the rim the inscriptions: ВОЄННА РОЗВІДКА УКРАЇНИ and the motto of military intelligence officers in Latin SAPIENS DOMINABITUR ASTRIS (“The wise will rule the stars”); in the centre – a stylized composition: against the background of the Earth's surface an owl holding a sword (on whose hilt the small State Coat of Arms of Ukraine is depicted) piercing the outlines of the territory of the aggressor country."}, {"id": 67, "uid": "cc40038ad1", "name": "Чорнобиль. Відродження. Рись євразійська (н)", "cat": "Пам'ятні монети", "img": "images/img_67.jpg", "photos": [{"src": "images/img_67.jpg", "label": "Аверс"}, {"src": "images/img_67_b.jpg", "label": "Реверс"}], "url": "https://coins.bank.gov.ua/chornobil-vidrodzhennja-ris-ievrazijska-n-/p-919.html", "price": 169, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "рифлений", "yakist": "спеціальний анциркулейтед", "tyrazh": "20000", "rik": "2023", "seriya": "Флора і фауна", "nominal": "5", "hud": "Фандікова Наталія", "skul": "Демяненко Анатолій, Дем'яненко Володимир", "note": "", "cat_nom": "5 грн", "cat_tir": 20000, "cat_year": 2023, "name_en": "\"Chornobyl. Revival. Eurasian Lynx\" (nickel silver)", "desc_ua": "Присвячена рисі євразійській. 30-кілометрова зона відчуження та зона безумовного відселення, на якій з 26 квітня 2016 року діє Чорнобильський радіаційно-екологічний біосферний заповідник, перетворились у своєрідний резерват для розмноження не тільки типових, а й рідкісних червонокнижних представників тваринного світу. \nСеред таких представників вид, який не так просто зустріти в дикій природі, – рись. У минулому рись була звичним для Полісся хижаком. Але внаслідок освоєння лісів і прямого переслідування її людиною ще в ХІХ ст. рись стала рідкісною твариною.\n Рись євразійська – вид занесений до Червоної книги України, додатка ІІ Бернської конвенції про охорону дикої флори та фауни і природних середовищ існування в Європі, Конвенції про міжнародну торгівлю видами дикої фауни і флори, що перебувають під загрозою зникнення.\n\nНа аверсі монети розміщено: малий Державний Герб України (угорі), написи: УКРАЇНА (під гербом); номінал монети – 5/ГРИВЕНЬ (праворуч від герба); у центрі – символічне колесо життя, що знаменує відродження природи: стилізований міжнародний знак “Радіаційна загроза”, оповитий листям, навколо якого тварини, популяції яких розвиваються у 30-кілометровій зоні відчуження, що стала своєрідним резерватом для розмноження, зокрема лелеки чорного, коня Пржевальського, рисі, зубра, лося, ведмедя бурого; по колу, на дзеркальному тлі написи: ЧОРНОБИЛЬСЬКИЙ РАДІАЦІЙНО-ЕКОЛОГІЧНИЙ БІОСФЕРНИЙ ЗАПОВІДНИК (ліворуч), CHORNOBYL RADIATION AND ECOLOGICAL BIOSPHERE RESERVE; рік карбування – 2023 (унизу); логотип Банкнотно-монетного двору Національного банку України (угорі).\n\nНа реверсі монети на тлі пейзажу зображено рись (використано тамподрук), над якою ліворуч на дзеркальному тлі написи: РИСЬ/ЄВРАЗІЙСЬКА/EURASIAN LYNX; угорі – рись та рисенята.", "desc_en": "Dedicated to the Eurasian lynx. The 30-kilometre exclusion zone and the unconditional resettlement zone, where the Chornobyl Radiation and Ecological Biosphere Reserve has been operating since 26 April 2016, have turned into a kind of reserve for the reproduction not only of typical but also of rare, Red-Book-listed representatives of the animal world.\nAmong such representatives is a species that is not so easy to meet in the wild – the lynx. In the past, the lynx was a common predator of Polissia. But as a result of the development of forests and direct persecution by humans, as early as the 19th century the lynx became a rare animal.\nThe Eurasian lynx is a species listed in the Red Book of Ukraine, Appendix II of the Bern Convention on the Conservation of European Wildlife and Natural Habitats, and the Convention on International Trade in Endangered Species of Wild Fauna and Flora.\n\nThe obverse of the coin features: the small State Coat of Arms of Ukraine (at the top), inscriptions: УКРАЇНА (below the coat of arms); the coin's denomination – 5 / ГРИВЕНЬ (to the right of the coat of arms); in the centre – a symbolic wheel of life signifying the revival of nature: a stylized international \"Radiation Hazard\" sign entwined with leaves, around which are animals whose populations are developing in the 30-kilometre exclusion zone, which has become a kind of reserve for reproduction, in particular the black stork, Przewalski's horse, lynx, European bison, moose, brown bear; along the circle, on a mirror background, inscriptions: ЧОРНОБИЛЬСЬКИЙ РАДІАЦІЙНО-ЕКОЛОГІЧНИЙ БІОСФЕРНИЙ ЗАПОВІДНИК (left), CHORNOBYL RADIATION AND ECOLOGICAL BIOSPHERE RESERVE; the year of issue – 2023 (below); the logo of the National Bank of Ukraine Banknote Printing and Minting Works (above).\n\nThe reverse of the coin, against a landscape background, depicts a lynx (pad printing used), above which on the left, on a mirror background, are the inscriptions: РИСЬ / ЄВРАЗІЙСЬКА / EURASIAN LYNX; above – a lynx and lynx kittens."}, {"id": 68, "uid": "b6f3b4b3b8", "name": "Пам`ятна медаль «Місто героїв - Миколаїв»", "cat": "Пам'ятні медалі", "img": "images/img_68.jpg", "photos": [{"src": "images/img_68.jpg", "label": "Аверс"}, {"src": "images/img_68_b.jpg", "label": "Реверс"}], "url": "https://coins.bank.gov.ua/pam-jatna-medal-misto-gerojiv-mikolajiv-/p-905.html", "price": 75, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "гладкий", "yakist": "спеціальний анциркулейтед", "tyrazh": "70000", "rik": "2023", "seriya": "—", "nominal": "—", "hud": "Фандікова Наталія", "skul": "Атаманчук Володимир, Дем'яненко Володимир; програмне моделювання – Лук'янов Юрій", "note": "Пам'ятна медаль", "cat_nom": "—", "cat_tir": 70000, "cat_year": 2023, "name_en": "Commemorative medal \"City of Heroes – Mykolaiv\"", "desc_ua": "Пам’ятна медаль присвячена відзначенню подвигу та стійкості мешканців міста корабелів, яке стало справжньою фортецею на шляху російських загарбників на півдні України.\nЗ перших днів повномасштабного вторгнення росіяни намагалися захопити Миколаїв, але після кількох невдалих штурмів, спроб оточення, оволодіння Миколаївським аеропортом та аеродромом Кульбакине почали бомбардувати й обстрілювати місто, завдавши непоправних втрат людським долям та матеріальних збитків місту – багато будівель було не тільки пошкоджено, а й зруйновано дощенту. \nЗгуртувавшись, підтримуючи одне одного, мешканці тримають оборону, захищають та відновлюють місто. А ще, у цю важку годину, спільними зусиллями оберігають його живу перлину – Миколаївський зоопарк.\n\nНа аверсі медалі розміщено: угорі написи – 2023 / УКРАЇНА, унизу – малий Державний Герб України, у центрі, на тлі стилізованої карти міста, рядки з історичного роману Ліни Костенко “Берестечко”: Я ЗНАЮ ГРАМОТУ СВОБОДИ – / ЇЇ ПІДПИСУЮТЬ МЕЧІ! / ЛІНА КОСТЕНКО; стилізовану композицію, яка підкреслює, що Миколаїв – місто суднобудування та морський порт; праворуч – будівля єдиного в країні Миколаївського музею суднобудування; логотип Банкнотно-монетного двору Національного банку України (ліворуч).\n\nНа реверсі медалі на дзеркальному тлі напис – МИКОЛАЇВ / МІСТО ГЕРОЇВ, що ділить поле медалі надвоє: у верхній частині розміщена дзеркальна композиція, що символізує спротив російському окупанту, попри значні руйнації, у нижній – стилізована панорама міста з його історичними й археологічними пам’ятками.", "desc_en": "The commemorative medal is dedicated to honoring the feat and resilience of the residents of the city of shipbuilders, which became a true fortress in the path of the Russian invaders in the south of Ukraine.\nFrom the first days of the full-scale invasion, the Russians tried to capture Mykolaiv, but after several failed assaults, attempts at encirclement, and seizing the Mykolaiv airport and the Kulbakyne airfield, they began bombing and shelling the city, inflicting irreparable losses on human lives and material damage to the city – many buildings were not only damaged but destroyed to the ground. \nHaving united and supported one another, the residents hold the defense, protect, and restore the city. And also, in this difficult hour, through joint efforts they safeguard its living pearl – the Mykolaiv Zoo.\n\nThe obverse of the medal features: at the top the inscriptions – 2023 / УКРАЇНА, at the bottom the small State Coat of Arms of Ukraine, in the center, against a stylized map of the city, lines from Lina Kostenko’s historical novel “Берестечко”: Я ЗНАЮ ГРАМОТУ СВОБОДИ – / ЇЇ ПІДПИСУЮТЬ МЕЧІ! / ЛІНА КОСТЕНКО; a stylized composition emphasizing that Mykolaiv is a shipbuilding city and a seaport; on the right the building of the country’s only Mykolaiv Shipbuilding Museum; the logo of the National Bank of Ukraine Banknote Printing and Minting Works (on the left).\n\nThe reverse of the medal, on a mirror background, bears the inscription – МИКОЛАЇВ / МІСТО ГЕРОЇВ, which divides the field of the medal in two: in the upper part is a mirrored composition symbolizing resistance to the Russian occupier despite significant destruction, in the lower part a stylized panorama of the city with its historical and archaeological landmarks."}, {"id": 69, "uid": "773049a564", "name": "Пам`ятна медаль «Місто героїв - Чернігів»", "cat": "Пам'ятні медалі", "img": "images/img_69.jpg", "photos": [{"src": "images/img_69.jpg", "label": "Аверс"}, {"src": "images/img_69_b.jpg", "label": "Реверс"}], "url": "https://coins.bank.gov.ua/pam-jatna-medal-misto-gerojiv-chernigiv-/p-906.html", "price": 75, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "гладкий", "yakist": "спеціальний анциркулейтед", "tyrazh": "70000", "rik": "2023", "seriya": "—", "nominal": "—", "hud": "Фандікова Наталія", "skul": "Демяненко Анатолій, Іваненко Святослав; програмне моделювання – Лук'янов Юрій", "note": "Пам'ятна медаль", "cat_nom": "—", "cat_tir": 70000, "cat_year": 2023, "name_en": "Commemorative medal \"City of Heroes – Chernihiv\"", "desc_ua": "Пам’ятна медаль присвячена відзначенню подвигу, масового героїзму та стійкості громадян міста, яке з перших годин вторгнення рф в Україну перебувало під цілодобовими обстрілами.\nСаме Чернігів, одне з найдавніших міст України, стало одним із перших, куди намагалися вдертися ворожі війська, але завдяки об’єднаному спротиву всіх складових оборони захопити його окупантам не вдалося.\nПісля невдалих спроб захопити місто росіяни підірвали мости та почали його рівняти із землею, внаслідок обстрілів пошкоджено багато цивільних об’єктів, зокрема шкіл і дитсадків, чимало житлових будинків зруйновано вщент. Тривалий час у Чернігові не було електропостачання, води, тепла, газу, бракувало їжі, але завдяки згуртованості, підтримці та взаємодопомозі місцеві жителі вистояли.\n\nНа аверсі медалі розміщено: угорі написи – 2023/УКРАЇНА, унизу – малий Державний Герб України, у центрі, на тлі стилізованої карти міста, рядки з поезії Ліни Костенко: ШМАТОК ЗЕМЛІ, ТИ ЗВЕШСЯ УКРАЇНОЮ./ ТИ БУВ ДО НАС. ТИ БУДЕШ ПІСЛЯ НАС./ ЛІНА КОСТЕНКО; стилізовану композицію з історичних культових споруд міста; логотип Банкнотно-монетного двору Національного банку України (ліворуч).\n\nНа реверсі медалі на дзеркальному тлі розміщено напис – ЧЕРНІГІВ/МІСТО ГЕРОЇВ, що ділить поле медалі надвоє: у верхній частині – дзеркальна композиція, що символізує спротив російським окупантам, попри руйнацію; у нижній – стилізована панорама міста з його історичними будівлями.", "desc_en": "The commemorative medal is dedicated to honouring the heroism, mass heroism, and resilience of the citizens of the city, which from the first hours of Russia's invasion of Ukraine was under round-the-clock shelling.\nIt was Chernihiv, one of the oldest cities of Ukraine, that became one of the first cities enemy troops tried to break into, but thanks to the united resistance of all components of the defence, the occupiers failed to capture it.\nAfter failed attempts to capture the city, the Russians blew up bridges and began to level it to the ground; shelling damaged many civilian objects, including schools and kindergartens, and many residential buildings were destroyed completely. For a long time, Chernihiv had no electricity, water, heat, gas, lacked food, but thanks to unity, support, and mutual assistance, the local residents held out.\n\nThe obverse of the medal features: at the top the inscriptions – 2023/УКРАЇНА, at the bottom – the small State Coat of Arms of Ukraine, in the centre, against the background of a stylized map of the city, lines from Lina Kostenko's poetry: ШМАТОК ЗЕМЛІ, ТИ ЗВЕШСЯ УКРАЇНОЮ./ ТИ БУВ ДО НАС. ТИ БУДЕШ ПІСЛЯ НАС./ ЛІНА КОСТЕНКО; a stylized composition of the city's historic religious buildings; the logo of the National Bank of Ukraine Banknote Printing and Minting Works (on the left).\n\nThe reverse of the medal on a mirror background features the inscription – ЧЕРНІГІВ/МІСТО ГЕРОЇВ, dividing the medal field in two: in the upper part – a mirrored composition symbolizing resistance to the Russian occupiers despite destruction; in the lower part – a stylized panorama of the city with its historic buildings."}, {"id": 70, "uid": "661346ecb0", "name": "Пам`ятна банкнота «ПАМ’ЯТАЄМО! НЕ ПРОБАЧИМО!» (у сувенірній упаковці)", "cat": "Банкноти", "img": "images/img_70.jpg", "photos": [{"src": "images/img_70.jpg", "label": "Аверс"}, {"src": "images/img_70_b.jpg", "label": "Реверс"}, {"src": "images/img_70_c.jpg", "label": "Аверс"}, {"src": "images/img_70_d.jpg", "label": "Реверс"}, {"src": "images/img_70_e.jpg", "label": "Аверс"}], "url": "https://coins.bank.gov.ua/pam-jatna-banknota-pam-jataiemo-ne-probachimo-u-suvenirnij-upakovci-/p-870.html", "price": 195, "qty": 1, "metal": "інша нумізматична продукція", "metal_short": "інша нумізматична продукція", "masa": "—", "diametr": "—", "gurt": "—", "yakist": "—", "tyrazh": "200000", "rik": "2023", "seriya": "—", "nominal": "20", "hud": "Таран Володимир", "skul": "—", "note": "Пам'ятна банкнота, 80×165 мм; дизайн реверсу – Сергій Мішакін", "cat_nom": "20 грн", "cat_tir": 200000, "cat_year": 2023, "name_en": "Commemorative banknote \"WE REMEMBER! WE WILL NOT FORGIVE!\" (in souvenir packaging)", "desc_ua": "Пам’ятна банкнота введена в обіг на відзначення стійкості, незламності, героїзму та сили духу українського народу, які він виявляє у боротьбі проти збройної агресії росії.\n24 лютого 2022 року росія розпочала повномасштабне вторгнення в Україну, оголосивши проведення “спеціальної військової операції”. Дії агресора, який масово та жорстоко вбиває цивільне населення, завдає нещадних артилерійських обстрілів та авіаударів, руйнує інфраструктуру та знищує населенні пункти, викликають шок у всьому цивілізованому світі! \nУкраїна відстоює свою незалежність, суверенітет, територіальну цілісність та право на життя! Наша Перемога – це перемога добра, справедливості, демократії; перемога світла над темрявою!\nПам’ятна банкнота номіналом 20 гривень 2023 року випуску з підписом Голови Національного банку України Андрія Пишного серії ЗС з номерами 0000001–0300000; містить елементи захисту чинного номінального ряду банкнот та додаткові оптично-змінні елементи захисту; розмір банкноти – 80 x 165 мм.\n\nОсновне зображення лицьового боку пам’ятної банкноти: українські військові встановлюють Державний Прапор України (фото “Українські воїни підіймають прапор” автора Олександра Смірнова) на тлі фрагментів карти України та прапорів країн, які підтримують Україну.\nУгорі тексти українською і англійською мовами: 24 ЛЮТОГО 2022 РОКУ / ПОВНОМАСШТАБНИМ ВТОРГНЕННЯМ / РОСІЙСЬКОЇ АРМІЇ РОЗПОЧАВСЯ НОВИЙ ЕТАП / ЗБРОЙНОЇ АГРЕСІЇ ПРОТИ УКРАЇНИ. / НАРОДНА ВІЙНА ЗА НЕЗАЛЕЖНІСТЬ І / СУВЕРЕНІТЕТ УКРАЇНИ ТРИВАЄ З 2014 РОКУ. / ЦЕ ТАКОЖ ВІЙНА ЗА ЦИВІЛІЗАЦІЙНИЙ ВИБІР: / УКРАЇНА ВІДСТОЮЄ СВОЮ ПРИНАЛЕЖНІСТЬ / ДО ЄВРОПЕЙСЬКОЇ ЦИВІЛІЗАЦІЇ І ВОДНОЧАС – / ТІ ЗАСАДНИЧІ ЦІННОСТІ, ПРАВА / І СВОБОДИ, ЩО ЛЕЖАТЬ В ОСНОВІ / ЗАХІДНОГО СВІТУ. (ліворуч); ON 24 FEBRUARY 2022, / A NEW STAGE OF ARMED AGGRRESSION AGAINST / UKRAINE BEGAN WITH A FULL-SCALE INVASION / OF UKRAINE BY THE RUSSIAN ARMY. / THE PEOPLE’S WAR FOR THE INDEPENDENCE / AND SOVEREIGNTY OF UKRAINE HAS BEEN / GOING ON SINCE 2014. THIS IS ALSO A WAR FOR / A CIVILIZATIONAL CHOICE: UKRAINE IS DEFENDING / ITS PLACE IN EUROPEAN CIVILIZATION, AND AT THE / SAME TIME FIGHTING FOR THE FUNDAMENTAL / VALUES, RIGHTS AND FREEDOMS THAT UNDERPIN / THE WESTERN WORLD. (праворуч); між текстами – лавровий вінок.\nНапис УКРАЇНА, під яким – малий Державний Герб України (ліворуч).\nПід лавровим вінком напис: І НА ОНОВЛЕНІЙ ЗЕМЛІ ВРАГА НЕ БУДЕ… та полімерна стрічка, що містить: шеврон Збройних Сил України, емблему Збройних Сил України та написи: СЛАВА УКРАЇНІ / ГЕРОЯМ СЛАВА.\nНа тлі синьої стрічки розміщено логотип Національного банку України; на тлі жовтої – підпис Андрія Пишного та напис ГОЛОВА. \nЦифрове позначення номіналу – 20 (унизу ліворуч), вертикальний напис ДВАДЦЯТЬ / ГРИВЕНЬ (праворуч від воїнів) та стилізований степ із квітами маку – нагадування про полеглих захисників України (унизу).\n\nОсновне зображення зворотного боку пам’ятної банкноти: стилізована композиція, що уособлює фізичні страждання та духовні переживання українців в окупації – зв’язані руки за спиною на тлі полотна, за яким вгадується постать зі слідом від кулі у вигляді маку (автор дизайну Сергій Мішакін), обабіч якого – стилізовані крила з полум’я свічок; угорі на тлі абрисів зруйнованих будівель – терновий вінок, символ мучеництва, праворуч від якого – захисний елемент, кольорова композиція, що поєднує зображення калини та протитанкового їжака. \nНаписи: ПАМ’ЯТАЄМО! НЕ ПРОБАЧИМО! НІКОЛИ! (під терновим вінком), ДВАДЦЯТЬ ГРИВЕНЬ (ліворуч вертикально); серійний номер банкноти, який складається з двобуквеної серії ЗС та семизначного номера (розташований двічі – уздовж правого та верхнього країв пам’ятної банкноти); унизу: цифрове позначення номіналу – 20 (по центру), 2023 (праворуч) та своєрідна алюзія – стилізовані маки, що символізують криваві сліди від куль.", "desc_en": "This commemorative banknote was put into circulation to mark the resilience, indomitability, heroism and strength of spirit of the Ukrainian people, which they demonstrate in the fight against Russia's armed aggression.\nOn 24 February 2022, Russia launched a full-scale invasion of Ukraine, announcing a “special military operation”. The aggressor's actions, which massively and brutally kill civilians, inflict merciless artillery shelling and air strikes, destroy infrastructure and wipe out populated areas, shock the entire civilized world!\nUkraine defends its independence, sovereignty, territorial integrity and right to life! Our Victory is the victory of good, justice, democracy; the victory of light over darkness!\nThe commemorative 20 hryvnia banknote, 2023 issue, with the signature of the Governor of the National Bank of Ukraine Andrii Pyshnyi, series ЗС numbered 0000001–0300000; it contains the security features of the current banknote series and additional optically variable security features; banknote size – 80 x 165 mm.\n\nThe main image of the front of the commemorative banknote: Ukrainian soldiers raise the State Flag of Ukraine (photo “Українські воїни підіймають прапор” by Oleksandr Smirnov) against the background of fragments of the map of Ukraine and the flags of the countries supporting Ukraine.\nAt the top, texts in Ukrainian and English: 24 ЛЮТОГО 2022 РОКУ / ПОВНОМАСШТАБНИМ ВТОРГНЕННЯМ / РОСІЙСЬКОЇ АРМІЇ РОЗПОЧАВСЯ НОВИЙ ЕТАП / ЗБРОЙНОЇ АГРЕСІЇ ПРОТИ УКРАЇНИ. / НАРОДНА ВІЙНА ЗА НЕЗАЛЕЖНІСТЬ І / СУВЕРЕНІТЕТ УКРАЇНИ ТРИВАЄ З 2014 РОКУ. / ЦЕ ТАКОЖ ВІЙНА ЗА ЦИВІЛІЗАЦІЙНИЙ ВИБІР: / УКРАЇНА ВІДСТОЮЄ СВОЮ ПРИНАЛЕЖНІСТЬ / ДО ЄВРОПЕЙСЬКОЇ ЦИВІЛІЗАЦІЇ І ВОДНОЧАС – / ТІ ЗАСАДНИЧІ ЦІННОСТІ, ПРАВА / І СВОБОДИ, ЩО ЛЕЖАТЬ В ОСНОВІ / ЗАХІДНОГО СВІТУ. (left); ON 24 FEBRUARY 2022, / A NEW STAGE OF ARMED AGGRRESSION AGAINST / UKRAINE BEGAN WITH A FULL-SCALE INVASION / OF UKRAINE BY THE RUSSIAN ARMY. / THE PEOPLE’S WAR FOR THE INDEPENDENCE / AND SOVEREIGNTY OF UKRAINE HAS BEEN / GOING ON SINCE 2014. THIS IS ALSO A WAR FOR / A CIVILIZATIONAL CHOICE: UKRAINE IS DEFENDING / ITS PLACE IN EUROPEAN CIVILIZATION, AND AT THE / SAME TIME FIGHTING FOR THE FUNDAMENTAL / VALUES, RIGHTS AND FREEDOMS THAT UNDERPIN / THE WESTERN WORLD. (right); between the texts – a laurel wreath.\nThe inscription УКРАЇНА, beneath which – the small State Coat of Arms of Ukraine (left).\nBeneath the laurel wreath, the inscription: І НА ОНОВЛЕНІЙ ЗЕМЛІ ВРАГА НЕ БУДЕ… and a polymer tape containing: the chevron of the Armed Forces of Ukraine, the emblem of the Armed Forces of Ukraine and the inscriptions: СЛАВА УКРАЇНІ / ГЕРОЯМ СЛАВА.\nAgainst the blue tape is the logo of the National Bank of Ukraine; against the yellow one – the signature of Andrii Pyshnyi and the inscription ГОЛОВА.\nThe digital designation of the denomination – 20 (bottom left), the vertical inscription ДВАДЦЯТЬ / ГРИВЕНЬ (to the right of the soldiers) and a stylized steppe with poppy flowers – a reminder of the fallen defenders of Ukraine (below).\n\nThe main image of the back of the commemorative banknote: a stylized composition embodying the physical suffering and spiritual experiences of Ukrainians under occupation – hands tied behind the back against the background of a cloth, behind which can be discerned a figure with a bullet mark in the form of a poppy (design by Serhii Mishakin), on either side of which – stylized wings of candle flames; at the top, against the background of the outlines of destroyed buildings – a crown of thorns, a symbol of martyrdom, to the right of which – a security feature, a coloured composition combining the image of a guelder rose and an anti-tank hedgehog.\nInscriptions: ПАМ’ЯТАЄМО! НЕ ПРОБАЧИМО! НІКОЛИ! (beneath the crown of thorns), ДВАДЦЯТЬ ГРИВЕНЬ (left, vertically); the banknote's serial number, which consists of the two-letter series ЗС and a seven-digit number (located twice – along the right and top edges of the commemorative banknote); below: the digital designation of the denomination – 20 (centre), 2023 (right) and a kind of allusion – stylized poppies symbolizing bloody bullet marks."}, {"id": 71, "uid": "7898ea32b5", "name": "Пам`ятна медаль «100 років від дня заснування Українського державного банку»", "cat": "Пам'ятні медалі", "img": "images/img_71.jpg", "photos": [{"src": "images/img_71.jpg", "label": "Аверс"}, {"src": "images/img_71_b.jpg", "label": "Фото 2"}], "url": "https://coins.bank.gov.ua/pam-jatna-medal-100-rokiv-vid-dnja-zasnuvannja-ukrajinskogo-derzhavnogo-banku-/p-894.html", "price": 30, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "гладкий", "yakist": "—", "tyrazh": "30000", "rik": "2017", "seriya": "—", "nominal": "—", "hud": "Таран Володимир, Харук Олександр, Харук Сергій", "skul": "Чайковський Роман, Дем'яненко Володимир, Демяненко Анатолій", "note": "Пам'ятна медаль", "cat_nom": "—", "cat_tir": 30000, "cat_year": 2017, "name_en": "Commemorative medal \"100th Anniversary of the Founding of the Ukrainian State Bank\"", "desc_ua": "Пам`ятна медаль випущена на відзначення 100-річчя Української революції 1917 - 1921 рр. та створення першого центрального банку України. Одним із перших законодавчих актів Центральної Ради Української Народної Республіки був закон про заснування Українського державного банку, який відіграв важливу роль у визвольних змаганнях українців тих років, а також у набутті ними власного досвіду банківництва.\n\nНа аверсі медалі розміщено: угорі - малий Державний Герб України та напис півколом - НАЦІОНАЛЬНИЙ БАНК УКРАЇНИ; у восьмикутному картуші на дзеркальному тлі зображено алегоричні жіночі фігури, які символізують торгівлю, багатство, добробут, могутність та щедрість і тримають розгорнутий сувій із зображенням емблеми Національного банку України. Унизу - рік карбування медалі - 2017.\n\nНа реверсі медалі зображено історичну двоповерхову будівлю банку над якою в картуші з рослинного орнаменту - тризуб, під будівлею - напис 100/ РОКІВ. По колу розміщено написи: ЗАСНУВАННЯ УКРАЇНСЬКОГО ДЕРЖАВНОГО БАНКУ (угорі півколом), УКРАЇНСЬКОЇ НАРОДНОЇ РЕСПУБЛІКИ (унизу півколом).", "desc_en": "The commemorative medal was issued to mark the 100th anniversary of the Ukrainian Revolution of 1917–1921 and the creation of the first central bank of Ukraine. One of the first legislative acts of the Central Rada of the Ukrainian People’s Republic was the law on the establishment of the Ukrainian State Bank, which played an important role in the liberation struggle of Ukrainians of those years, as well as in their gaining their own banking experience.\n\nThe obverse of the medal features: at the top the small State Coat of Arms of Ukraine and the inscription in a semicircle – НАЦІОНАЛЬНИЙ БАНК УКРАЇНИ; in an octagonal cartouche on a mirror background are allegorical female figures symbolizing trade, wealth, prosperity, power, and generosity, holding an unrolled scroll with the emblem of the National Bank of Ukraine. At the bottom is the year of issue of the medal – 2017.\n\nThe reverse of the medal depicts the historic two-story bank building, above which in a cartouche of plant ornament is a tryzub, beneath the building the inscription 100 / РОКІВ. Around the edge are the inscriptions: ЗАСНУВАННЯ УКРАЇНСЬКОГО ДЕРЖАВНОГО БАНКУ (in a semicircle at the top), УКРАЇНСЬКОЇ НАРОДНОЇ РЕСПУБЛІКИ (in a semicircle at the bottom)."}, {"id": 72, "uid": "c58add965e", "name": "Пам`ятна медаль «100 років Національній академії аграрних наук України»", "cat": "Пам'ятні медалі", "img": "images/img_72.jpg", "photos": [{"src": "images/img_72.jpg", "label": "Аверс"}, {"src": "images/img_72_b.jpg", "label": "Фото 2"}], "url": "https://coins.bank.gov.ua/pam-jatna-medal-100-rokiv-na-agrarnih-nauk-ukrajini-/p-897.html", "price": 45, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "31,0", "gurt": "гладкий", "yakist": "спеціальний анциркулейтед", "tyrazh": "20000", "rik": "2018", "seriya": "—", "nominal": "—", "hud": "Фандікова Наталія", "skul": "Дем'яненко Володимир, Демяненко Анатолій", "note": "Пам'ятна медаль", "cat_nom": "—", "cat_tir": 20000, "cat_year": 2017, "name_en": "Commemorative medal \"100th Anniversary of the National Academy of Agrarian Sciences of Ukraine\"", "desc_ua": "Пам`ятна медаль присвячена самоврядній науковій організації, основним завданням якої є наукове забезпечення розвитку галузей агропромислового комплексу. Історія Національної академії аграрних наук України починає свій відлік 01 листопада 1918 року, від дати створення Сільськогосподарського вченого комітету України, який за своєю структурою, кадровим потенціалом та завданнями мав ознаки повноцінної академічної установи, до створення якої мав безпосереднє відношення академік В. І. Вернадський.\n\nНа аверсі медалі розміщено: малий Державний Герб України, у центрі - історична будівля, побудована на початку ХХ століття, в якій розташована академія, угорі по колу написи: НАЦІОНАЛЬНА АКАДЕМІЯ АГРАРНИХ НАУК УКРАЇНИ; унизу - книга, на якій два зелених листки (елемент оздоблення - емаль), по обидва боки від книги колоски та роки 1918 і 2018.\n\nНа реверсі медалі на тлі колосків розміщено логотип Національної академії аграрних наук України; унизу написи: 100/РОКІВ, по обидва боки від написів - колоски; логотип Банкнотно-монетного двору Національного банку України (праворуч - на тлі колоска).", "desc_en": "The commemorative medal is dedicated to a self-governing scientific organization whose main task is the scientific support of the development of the branches of the agro-industrial complex. The history of the National Academy of Agrarian Sciences of Ukraine begins on 1 November 1918, the date of establishment of the Agricultural Scientific Committee of Ukraine, which in its structure, personnel potential, and tasks had the features of a full-fledged academic institution, in whose creation Academician V. I. Vernadsky was directly involved.\n\nThe obverse of the medal features: the small State Coat of Arms of Ukraine, in the centre – the historic building, built at the beginning of the twentieth century, which houses the academy, at the top along the rim the inscriptions: НАЦІОНАЛЬНА АКАДЕМІЯ АГРАРНИХ НАУК УКРАЇНИ; at the bottom – a book on which two green leaves (decoration element – enamel), on both sides of the book ears of grain and the years 1918 and 2018.\n\nThe reverse of the medal against the background of ears of grain features the logo of the National Academy of Agrarian Sciences of Ukraine; at the bottom the inscriptions: 100/РОКІВ, on both sides of the inscriptions – ears of grain; the logo of the National Bank of Ukraine Banknote Printing and Minting Works (on the right – against the background of an ear of grain)."}, {"id": 73, "uid": "8546938bcc", "name": "Пам`ятна медаль «100 років утворення Генерального Суду Української Народної Республіки»", "cat": "Пам'ятні медалі", "img": "images/img_73.jpg", "photos": [{"src": "images/img_73.jpg", "label": "Аверс"}, {"src": "images/img_73_b.jpg", "label": "Фото 2"}], "url": "https://coins.bank.gov.ua/pam-jatna-medal-100-rokiv-utvorennja-generalnogo-sudu-ukrajinskoji-narodnoji-respubliki-/p-893.html", "price": 30, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "гладкий", "yakist": "—", "tyrazh": "20000", "rik": "2017", "seriya": "—", "nominal": "—", "hud": "Таран Володимир, Харук Олександр, Харук Сергій", "skul": "Демяненко Анатолій, Дем'яненко Володимир", "note": "Пам'ятна медаль", "cat_nom": "—", "cat_tir": 20000, "cat_year": 2017, "name_en": "Commemorative medal \"100th Anniversary of the Establishment of the General Court of the Ukrainian People's Republic\"", "desc_ua": "Пам`ятна медаль присвячена 100-річчю створення Центральною Радою у грудні 1917 року найвищої судової установи в Україні - Генерального Суду УНР, правонаступником якого є Верховний Суд України. Генеральний Суд складався з трьох департаментів: цивільного, карного й адміністративного та виконував усі функції в судових справах, справах нагляду над судовими установами й особами судового відомства.\n\nНа аверсі медалі розміщено: угорі - малий Державний Герб України, під яким у обрамленні орнаменту - терези - найдавніша емблема міри та справедливості, символ правосуддя; по обидва боки від композиції зазначено роки - 1917 та 2017; у центрі на дзеркальному тлі - Кловський палац (ХVIII ст.), у якому знаходиться Верховний Суд України - найвищий судовий орган у системі судів загальної юрисдикції України, та написи: УКРАЇНА (над будівлею), ВЕРХОВНИЙ СУД (унизу); угорі праворуч - логотип Банкнотно-монетного двору Національного банку України.\n\nНа реверсі медалі зображено пам`ятку архітектури середини ХІХ ст. - Присутствені місця (загальна назва державних адміністративних органів для центрального, губернського або повітового управління), де розміщувався Генеральний Суд. Ліворуч від зображення вищезазначеної будівлі, в картуші з рослинного орнаменту - тризуб; під будівлею - напис 100/ РОКІВ. По колу розміщено написи: УТВОРЕННЯ ГЕНЕРАЛЬНОГО СУДУ (угорі), УКРАЇНСЬКОЇ НАРОДНОЇ РЕСПУБЛІКИ (унизу).", "desc_en": "This commemorative medal is dedicated to the 100th anniversary of the creation by the Central Rada in December 1917 of the highest judicial institution in Ukraine – the General Court of the UPR, whose successor is the Supreme Court of Ukraine. The General Court consisted of three departments: civil, criminal and administrative, and performed all functions in court cases, as well as supervision of judicial institutions and persons of the judicial department.\n\nThe obverse of the medal features: at the top – the small State Coat of Arms of Ukraine, beneath which, framed by an ornament – scales, the oldest emblem of measure and justice, a symbol of justice; on both sides of the composition are the years – 1917 and 2017; in the centre, on a mirror background – the Klov Palace (18th century), which houses the Supreme Court of Ukraine – the highest judicial body in the system of courts of general jurisdiction of Ukraine, and the inscriptions: УКРАЇНА (above the building), ВЕРХОВНИЙ СУД (below); at the top right – the logo of the National Bank of Ukraine Banknote Printing and Minting Works.\n\nThe reverse of the medal depicts an architectural monument of the mid-19th century – the Offices (the general name for state administrative bodies of central, provincial or district administration), which housed the General Court. To the left of the image of the aforementioned building, in a cartouche of plant ornament – a trident; beneath the building – the inscription 100 / РОКІВ. Around the circle are the inscriptions: УТВОРЕННЯ ГЕНЕРАЛЬНОГО СУДУ (above), УКРАЇНСЬКОЇ НАРОДНОЇ РЕСПУБЛІКИ (below)."}, {"id": 74, "uid": "d6c0df9ef0", "name": "Пам`ятна медаль «100 років утворення дипломатичної служби України»", "cat": "Пам'ятні медалі", "img": "images/img_74.jpg", "photos": [{"src": "images/img_74.jpg", "label": "Аверс"}, {"src": "images/img_74_b.jpg", "label": "Фото 2"}], "url": "https://coins.bank.gov.ua/pam-jatna-medal-100-rokiv-utvorennja-diplomatichnoji-sluzhbi-ukrajini-/p-895.html", "price": 30, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "35,0", "gurt": "гладкий", "yakist": "—", "tyrazh": "20000", "rik": "2017", "seriya": "—", "nominal": "—", "hud": "Таран Володимир, Харук Олександр, Харук Сергій", "skul": "Демяненко Анатолій, Дем'яненко Володимир", "note": "Пам'ятна медаль", "cat_nom": "—", "cat_tir": 20000, "cat_year": 2017, "name_en": "Commemorative medal \"100th Anniversary of the Establishment of Ukraine's Diplomatic Service\"", "desc_ua": "Пам`ятна медаль присвячена 100-річчю подій Української революції 1917 - 1921 рр. та створенню першого зовнішньополітичного відомства України - Генерального секретарства міжнародних справ. Генеральне секретарство міжнародних справ було сформоване в грудні 1917 року у складі Генерального секретаріату Української Народної Республіки. Його обов`язками було визначено: здійснення міжнародних зносин держави та охорона інтересів українських громадян поза межами УНР.\n\nНа аверсі медалі розміщено: угорі - малий Державний Герб України, праворуч від якого рік - 2017; у центрі на дзеркальному тлі - будівля, в якій нині розміщується Міністерство закордонних справ України - центральний орган виконавчої влади, який забезпечує проведення зовнішньої політики держави, і написи: 100/РОКІВ/YEARS (під будівлею), МІНІСТЕРСТВО ЗАКОРДОННИХ СПРАВ УКРАЇНИ (півколом угорі), MINISTRY OF FOREIGN AFFAIRS OF UKRAINE (півколом унизу); праворуч - логотип Банкнотно-монетного двору Національного банку України.\n\nНа реверсі медалі праворуч зображено будівлю по вул. Терещенківській, в якій 100 років тому розміщувалось Генеральне секретарство міжнародних справ, ліворуч над будівлею в картуші з рослинного орнаменту - тризуб; під будівлею - напис 100/РОКІВ/YEARS. По колу розміщено написи: УКРАЇНСЬКІЙ ДИПЛОМАТИЧНІЙ СЛУЖБІ (угорі), UKRAINIAN DIPLOMATIC SERVICE (унизу).", "desc_en": "The commemorative medal is dedicated to the 100th anniversary of the events of the Ukrainian Revolution of 1917–1921 and the creation of Ukraine’s first foreign policy department – the General Secretariat of International Affairs. The General Secretariat of International Affairs was formed in December 1917 as part of the General Secretariat of the Ukrainian People’s Republic. Its duties were defined as: conducting the state’s international relations and protecting the interests of Ukrainian citizens outside the UPR.\n\nThe obverse of the medal features: at the top the small State Coat of Arms of Ukraine, to the right of which is the year – 2017; in the center, on a mirror background, the building that currently houses the Ministry of Foreign Affairs of Ukraine – the central executive authority that ensures the conduct of the state’s foreign policy – and the inscriptions: 100/РОКІВ/YEARS (beneath the building), МІНІСТЕРСТВО ЗАКОРДОННИХ СПРАВ УКРАЇНИ (in a semicircle at the top), MINISTRY OF FOREIGN AFFAIRS OF UKRAINE (in a semicircle at the bottom); on the right the logo of the National Bank of Ukraine Banknote Printing and Minting Works.\n\nThe reverse of the medal depicts on the right the building on Tereshchenkivska Street, which 100 years ago housed the General Secretariat of International Affairs, on the left above the building in a cartouche of plant ornament a tryzub; beneath the building the inscription 100/РОКІВ/YEARS. Around the edge are the inscriptions: УКРАЇНСЬКІЙ ДИПЛОМАТИЧНІЙ СЛУЖБІ (at the top), UKRAINIAN DIPLOMATIC SERVICE (at the bottom)."}, {"id": 75, "uid": "30daa212f3", "name": "Пам`ятна медаль «Національний технічний університет України \"Київський політехнічний інститут імені Ігоря Сікорського\"»", "cat": "Пам'ятні медалі", "img": "images/img_75.jpg", "photos": [{"src": "images/img_75.jpg", "label": "Аверс"}, {"src": "images/img_75_b.jpg", "label": "Фото 2"}], "url": "https://coins.bank.gov.ua/pam-jatna-medal-nacionalnij-tehnichnij-universitet-ukrajini-kijivskij-politehnichnij-institut-imeni-igorja-sikorskogo-/p-896.html", "price": 38, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "31,0", "gurt": "гладкий", "yakist": "спеціальний анциркулейтед", "tyrazh": "30000", "rik": "2018", "seriya": "—", "nominal": "—", "hud": "Таран Володимир, Харук Олександр, Харук Сергій, Герук Яна", "skul": "Демяненко Анатолій, Атаманчук Володимир", "note": "Пам'ятна медаль", "cat_nom": "—", "cat_tir": 30000, "cat_year": 2018, "name_en": "Commemorative medal \"National Technical University of Ukraine 'Igor Sikorsky Kyiv Polytechnic Institute'\"", "desc_ua": "Пам`ятна медаль присвячена одному з найбільших закладів вищої освіти України і Європи, заснованому в 1898 році. Національний технічний університет України відіграє значну роль у підготовці висококваліфікованих інженерних і наукових кадрів та упродовж багатьох років входить у трійку найкращих навчальних закладів в Україні.\n\nНа аверсі медалі розміщено: головний корпус університету, над яким - малий Державний Герб України та рік заснування університету - 1898; по колу написи: НАЦІОНАЛЬНИЙ ТЕХНІЧНИЙ (угорі), УНІВЕРСИТЕТ УКРАЇНИ (унизу).\n\nНа реверсі медалі зображено позолочений герб університету (локальна позолота, вміст золота в чистоті не менше ніж 0,0008 г), під яким рік карбування - 2018. По колу розміщено написи: КИЇВСЬКИЙ ПОЛІТЕХНІЧНИЙ ІНСТИТУТ (угорі), ІМЕНІ ІГОРЯ СІКОРСЬКОГО (унизу).", "desc_en": "The commemorative medal is dedicated to one of the largest higher education institutions of Ukraine and Europe, founded in 1898. The National Technical University of Ukraine plays a significant role in training highly qualified engineering and scientific personnel and has for many years been among the top three educational institutions in Ukraine.\n\nThe obverse of the medal features: the main building of the university, above which – the small State Coat of Arms of Ukraine and the year of the university's founding – 1898; along the rim the inscriptions: НАЦІОНАЛЬНИЙ ТЕХНІЧНИЙ (at the top), УНІВЕРСИТЕТ УКРАЇНИ (at the bottom).\n\nThe reverse of the medal depicts the gilded coat of arms of the university (local gilding, pure gold content not less than 0.0008 g), under which the year of minting – 2018. Along the rim are the inscriptions: КИЇВСЬКИЙ ПОЛІТЕХНІЧНИЙ ІНСТИТУТ (at the top), ІМЕНІ ІГОРЯ СІКОРСЬКОГО (at the bottom)."}, {"id": 76, "uid": "c9170f6ee2", "name": "Пам`ятна медаль «Національний університет \"Львівська політехніка\"»", "cat": "Пам'ятні медалі", "img": "images/img_76.jpg", "photos": [{"src": "images/img_76.jpg", "label": "Аверс"}, {"src": "images/img_76_b.jpg", "label": "Фото 2"}], "url": "https://coins.bank.gov.ua/pam-jatna-medal-nacionalnij-universitet-lvivska-politehnika-/p-892.html", "price": 26, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "—", "diametr": "31,0", "gurt": "гладкий", "yakist": "спеціальний анциркулейтед", "tyrazh": "20000", "rik": "2017", "seriya": "—", "nominal": "—", "hud": "Демяненко Анатолій", "skul": "Демяненко Анатолій", "note": "Пам'ятна медаль", "cat_nom": "—", "cat_tir": 20000, "cat_year": 2017, "name_en": "Commemorative medal \"Lviv Polytechnic National University\"", "desc_ua": "Пам`ятна медаль присвячена одному з найстаріших технічних університетів зі славною історією - `Національному університету `Львівська політехніка`, який є потужним осередком науки й освіти, генератором ідей та винаходів.\n\nНа аверсі медалі розміщено: угорі малий Державний Герб України, по обидва боки від якого написи: УКРАЇНА UKRAINE; зображено розміщені на будівлі університету алегоричні скульптури, що символізують науки і мистецтва, під якими написи: LVIVSKA POLYTECHNIKA/ NATIONAL UNIVERSITY/1816. Ліворуч розміщено логотип Монетного двору Національного банку України.\n\nНа реверсі медалі зображено головну будівлю університету, яка збудована в останній третині ХІХ ст. за проектом архітектора Юліана Захаревича. На будівлі розміщено напис LITTERIS ET ARTIBUS (Науками й мистецтвами). Угорі розміщено написи: НАЦІОНАЛЬНИЙ УНІВЕРСИТЕТ (угорі півколом)/1816/ ЛЬВІВСЬКА ПОЛІТЕХНІКА.", "desc_en": "The commemorative medal is dedicated to one of the oldest technical universities with a glorious history – Lviv Polytechnic National University, which is a powerful centre of science and education, a generator of ideas and inventions.\n\nThe obverse of the medal features: at the top the small State Coat of Arms of Ukraine, on both sides of which the inscriptions: УКРАЇНА UKRAINE; allegorical sculptures placed on the university building, symbolizing the sciences and arts, under which the inscriptions: LVIVSKA POLYTECHNIKA/ NATIONAL UNIVERSITY/1816. On the left is the logo of the Mint of the National Bank of Ukraine.\n\nThe reverse of the medal depicts the main building of the university, built in the last third of the nineteenth century according to the design of architect Yulian Zakharevych. On the building is the inscription LITTERIS ET ARTIBUS (By Sciences and Arts). At the top are the inscriptions: НАЦІОНАЛЬНИЙ УНІВЕРСИТЕТ (at the top in a semicircle)/1816/ ЛЬВІВСЬКА ПОЛІТЕХНІКА."}, {"id": 77, "uid": "afd7d4ce97", "name": "Пам`ятна банкнота «ПАМ’ЯТАЄМО! НЕ ПРОБАЧИМО!» (у конверті)", "cat": "Банкноти", "img": "images/img_77.jpg", "photos": [{"src": "images/img_77.jpg", "label": "Аверс"}, {"src": "images/img_77_b.jpg", "label": "Реверс"}, {"src": "images/img_77_c.jpg", "label": "Реверс"}], "url": "https://coins.bank.gov.ua/pam-jatna-banknota-pam-jataiemo-ne-probachimo-u-konverti-/p-869.html", "price": 169, "qty": 1, "metal": "інша нумізматична продукція", "metal_short": "інша нумізматична продукція", "masa": "—", "diametr": "—", "gurt": "—", "yakist": "—", "tyrazh": "99952", "rik": "2023", "seriya": "—", "nominal": "20", "hud": "Таран Володимир", "skul": "—", "note": "Пам'ятна банкнота, 80×165 мм", "cat_nom": "20 грн", "cat_tir": 99952, "cat_year": 2023, "name_en": "Commemorative banknote \"WE REMEMBER! WE WILL NOT FORGIVE!\" (in envelope)", "desc_ua": "Пам’ятна банкнота введена в обіг на відзначення стійкості, незламності, героїзму та сили духу українського народу, які він виявляє у боротьбі проти збройної агресії росії.\n24 лютого 2022 року росія розпочала повномасштабне вторгнення в Україну, оголосивши проведення “спеціальної військової операції”. Дії агресора, який масово та жорстоко вбиває цивільне населення, завдає нещадних артилерійських обстрілів та авіаударів, руйнує інфраструктуру та знищує населенні пункти, викликають шок у всьому цивілізованому світі! \nУкраїна відстоює свою незалежність, суверенітет, територіальну цілісність та право на життя! Наша Перемога – це перемога добра, справедливості, демократії; перемога світла над темрявою!\nПам’ятна банкнота номіналом 20 гривень 2023 року випуску з підписом Голови Національного банку України Андрія Пишного серії ЗС з номерами 0000001–0300000; містить елементи захисту чинного номінального ряду банкнот та додаткові оптично-змінні елементи захисту; розмір банкноти – 80 x 165 мм.\n\nОсновне зображення лицьового боку пам’ятної банкноти: українські військові встановлюють Державний Прапор України (фото “Українські воїни підіймають прапор” автора Олександра Смірнова) на тлі фрагментів карти України та прапорів країн, які підтримують Україну.\nУгорі тексти українською і англійською мовами: 24 ЛЮТОГО 2022 РОКУ / ПОВНОМАСШТАБНИМ ВТОРГНЕННЯМ / РОСІЙСЬКОЇ АРМІЇ РОЗПОЧАВСЯ НОВИЙ ЕТАП / ЗБРОЙНОЇ АГРЕСІЇ ПРОТИ УКРАЇНИ. / НАРОДНА ВІЙНА ЗА НЕЗАЛЕЖНІСТЬ І / СУВЕРЕНІТЕТ УКРАЇНИ ТРИВАЄ З 2014 РОКУ. / ЦЕ ТАКОЖ ВІЙНА ЗА ЦИВІЛІЗАЦІЙНИЙ ВИБІР: / УКРАЇНА ВІДСТОЮЄ СВОЮ ПРИНАЛЕЖНІСТЬ / ДО ЄВРОПЕЙСЬКОЇ ЦИВІЛІЗАЦІЇ І ВОДНОЧАС – / ТІ ЗАСАДНИЧІ ЦІННОСТІ, ПРАВА / І СВОБОДИ, ЩО ЛЕЖАТЬ В ОСНОВІ / ЗАХІДНОГО СВІТУ. (ліворуч); ON 24 FEBRUARY 2022, / A NEW STAGE OF ARMED AGGRRESSION AGAINST / UKRAINE BEGAN WITH A FULL-SCALE INVASION / OF UKRAINE BY THE RUSSIAN ARMY. / THE PEOPLE’S WAR FOR THE INDEPENDENCE / AND SOVEREIGNTY OF UKRAINE HAS BEEN / GOING ON SINCE 2014. THIS IS ALSO A WAR FOR / A CIVILIZATIONAL CHOICE: UKRAINE IS DEFENDING / ITS PLACE IN EUROPEAN CIVILIZATION, AND AT THE / SAME TIME FIGHTING FOR THE FUNDAMENTAL / VALUES, RIGHTS AND FREEDOMS THAT UNDERPIN / THE WESTERN WORLD. (праворуч); між текстами – лавровий вінок.\nНапис УКРАЇНА, під яким – малий Державний Герб України (ліворуч).\nПід лавровим вінком напис: І НА ОНОВЛЕНІЙ ЗЕМЛІ ВРАГА НЕ БУДЕ… та полімерна стрічка, що містить: шеврон Збройних Сил України, емблему Збройних Сил України та написи: СЛАВА УКРАЇНІ / ГЕРОЯМ СЛАВА.\nНа тлі синьої стрічки розміщено логотип Національного банку України; на тлі жовтої – підпис Андрія Пишного та напис ГОЛОВА. \nЦифрове позначення номіналу – 20 (унизу ліворуч), вертикальний напис ДВАДЦЯТЬ / ГРИВЕНЬ (праворуч від воїнів) та стилізований степ із квітами маку – нагадування про полеглих захисників України (унизу).\n\nОсновне зображення зворотного боку пам’ятної банкноти: стилізована композиція, що уособлює фізичні страждання та духовні переживання українців в окупації – зв’язані руки за спиною на тлі полотна, за яким вгадується постать зі слідом від кулі у вигляді маку (автор дизайну Сергій Мішакін), обабіч якого – стилізовані крила з полум’я свічок; угорі на тлі абрисів зруйнованих будівель – терновий вінок, символ мучеництва, праворуч від якого – захисний елемент, кольорова композиція, що поєднує зображення калини та протитанкового їжака. \nНаписи: ПАМ’ЯТАЄМО! НЕ ПРОБАЧИМО! НІКОЛИ! (під терновим вінком), ДВАДЦЯТЬ ГРИВЕНЬ (ліворуч вертикально); серійний номер банкноти, який складається з двобуквеної серії ЗС та семизначного номера (розташований двічі – уздовж правого та верхнього країв пам’ятної банкноти); унизу: цифрове позначення номіналу – 20 (по центру), 2023 (праворуч) та своєрідна алюзія – стилізовані маки, що символізують криваві сліди від куль.", "desc_en": "This commemorative banknote was put into circulation to mark the resilience, indomitability, heroism and strength of spirit of the Ukrainian people, which they demonstrate in the fight against Russia's armed aggression.\nOn 24 February 2022, Russia launched a full-scale invasion of Ukraine, announcing a “special military operation”. The aggressor's actions, which massively and brutally kill civilians, inflict merciless artillery shelling and air strikes, destroy infrastructure and wipe out populated areas, shock the entire civilized world!\nUkraine defends its independence, sovereignty, territorial integrity and right to life! Our Victory is the victory of good, justice, democracy; the victory of light over darkness!\nThe commemorative 20 hryvnia banknote, 2023 issue, with the signature of the Governor of the National Bank of Ukraine Andrii Pyshnyi, series ЗС numbered 0000001–0300000; it contains the security features of the current banknote series and additional optically variable security features; banknote size – 80 x 165 mm.\n\nThe main image of the front of the commemorative banknote: Ukrainian soldiers raise the State Flag of Ukraine (photo “Українські воїни підіймають прапор” by Oleksandr Smirnov) against the background of fragments of the map of Ukraine and the flags of the countries supporting Ukraine.\nAt the top, texts in Ukrainian and English: 24 ЛЮТОГО 2022 РОКУ / ПОВНОМАСШТАБНИМ ВТОРГНЕННЯМ / РОСІЙСЬКОЇ АРМІЇ РОЗПОЧАВСЯ НОВИЙ ЕТАП / ЗБРОЙНОЇ АГРЕСІЇ ПРОТИ УКРАЇНИ. / НАРОДНА ВІЙНА ЗА НЕЗАЛЕЖНІСТЬ І / СУВЕРЕНІТЕТ УКРАЇНИ ТРИВАЄ З 2014 РОКУ. / ЦЕ ТАКОЖ ВІЙНА ЗА ЦИВІЛІЗАЦІЙНИЙ ВИБІР: / УКРАЇНА ВІДСТОЮЄ СВОЮ ПРИНАЛЕЖНІСТЬ / ДО ЄВРОПЕЙСЬКОЇ ЦИВІЛІЗАЦІЇ І ВОДНОЧАС – / ТІ ЗАСАДНИЧІ ЦІННОСТІ, ПРАВА / І СВОБОДИ, ЩО ЛЕЖАТЬ В ОСНОВІ / ЗАХІДНОГО СВІТУ. (left); ON 24 FEBRUARY 2022, / A NEW STAGE OF ARMED AGGRRESSION AGAINST / UKRAINE BEGAN WITH A FULL-SCALE INVASION / OF UKRAINE BY THE RUSSIAN ARMY. / THE PEOPLE’S WAR FOR THE INDEPENDENCE / AND SOVEREIGNTY OF UKRAINE HAS BEEN / GOING ON SINCE 2014. THIS IS ALSO A WAR FOR / A CIVILIZATIONAL CHOICE: UKRAINE IS DEFENDING / ITS PLACE IN EUROPEAN CIVILIZATION, AND AT THE / SAME TIME FIGHTING FOR THE FUNDAMENTAL / VALUES, RIGHTS AND FREEDOMS THAT UNDERPIN / THE WESTERN WORLD. (right); between the texts – a laurel wreath.\nThe inscription УКРАЇНА, beneath which – the small State Coat of Arms of Ukraine (left).\nBeneath the laurel wreath, the inscription: І НА ОНОВЛЕНІЙ ЗЕМЛІ ВРАГА НЕ БУДЕ… and a polymer tape containing: the chevron of the Armed Forces of Ukraine, the emblem of the Armed Forces of Ukraine and the inscriptions: СЛАВА УКРАЇНІ / ГЕРОЯМ СЛАВА.\nAgainst the blue tape is the logo of the National Bank of Ukraine; against the yellow one – the signature of Andrii Pyshnyi and the inscription ГОЛОВА.\nThe digital designation of the denomination – 20 (bottom left), the vertical inscription ДВАДЦЯТЬ / ГРИВЕНЬ (to the right of the soldiers) and a stylized steppe with poppy flowers – a reminder of the fallen defenders of Ukraine (below).\n\nThe main image of the back of the commemorative banknote: a stylized composition embodying the physical suffering and spiritual experiences of Ukrainians under occupation – hands tied behind the back against the background of a cloth, behind which can be discerned a figure with a bullet mark in the form of a poppy (design by Serhii Mishakin), on either side of which – stylized wings of candle flames; at the top, against the background of the outlines of destroyed buildings – a crown of thorns, a symbol of martyrdom, to the right of which – a security feature, a coloured composition combining the image of a guelder rose and an anti-tank hedgehog.\nInscriptions: ПАМ’ЯТАЄМО! НЕ ПРОБАЧИМО! НІКОЛИ! (beneath the crown of thorns), ДВАДЦЯТЬ ГРИВЕНЬ (left, vertically); the banknote's serial number, which consists of the two-letter series ЗС and a seven-digit number (located twice – along the right and top edges of the commemorative banknote); below: the digital designation of the denomination – 20 (centre), 2023 (right) and a kind of allusion – stylized poppies symbolizing bloody bullet marks."}, {"id": 78, "uid": "ba7d859542", "name": "«Чорнобиль. Відродження. Кінь Пржевальського» (н)", "cat": "Пам'ятні монети", "img": "images/img_78.jpg", "photos": [{"src": "images/img_78.jpg", "label": "Аверс"}, {"src": "images/img_78_b.jpg", "label": "Реверс"}], "url": "", "price": 0, "qty": 1, "metal": "нейзильбер (СuNi15Zn21)", "metal_short": "нейзильбер", "masa": "16,54", "diametr": "35,0", "gurt": "рифлений", "yakist": "спеціальний анциркулейтед", "tyrazh": "40000", "rik": "2021", "seriya": "Флора і фауна", "nominal": "5", "hud": "Наталія Фандікова", "skul": "Анатолій Демяненко, Володимир Дем'яненко", "note": "У тому числі 20 000 шт. у сувенірній упаковці; придбано поза магазином НБУ", "cat_nom": "5 грн",
